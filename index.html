      /* ==================== 15. KỊCH BẢN ĐẠO DIỄN & VÒNG LẶP RENDER 3D (ZERO GC) ==================== */
      let timelineStart = 0;
      let timelineRunning = false;
      let orbitSantaActive = false;

      const targetCamPos = new THREE.Vector3(0, 11, 56);
      const targetCamLook = new THREE.Vector3(0, 12, 0);
      const _forwardVec = new THREE.Vector3();
      const _centerLook = new THREE.Vector3(0, 11.5, 0);

      const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
      const schedule = (fn, delay) => timers.push(setTimeout(fn, delay));

      function updateDirectorTimeline(now, dt) {
        if (!timelineRunning) {
          camera.position.set(0, 11, 56);
          camera.lookAt(0, 12, 0);
          return;
        }

        const elapsed = (now - timelineStart) / 1000;

        // 1. Cánh cổng không gian mở ra & đóng lại (0.15s - 3.85s)
        if (elapsed >= 0.15 && elapsed <= 3.85) {
          portal3DGroup.visible = true;
          const portalScale = elapsed < 0.85
            ? Math.max(0.01, easeOutBack(clamp((elapsed - 0.15) / 0.70, 0, 1)))
            : elapsed > 3.10
            ? Math.max(0.01, 1 - easeInOutCubic(clamp((elapsed - 3.10) / 0.75, 0, 1)))
            : 1.0 + Math.sin(elapsed * 5.5) * 0.04;
          portal3DGroup.scale.setScalar(portalScale);
        } else {
          portal3DGroup.visible = false;
        }

        // 2. Ông già Noel bay từ Cánh cổng không gian ra ngoài (0.48s - 3.70s)
        if (elapsed >= 0.48 && elapsed <= 3.70) {
          introSanta3D.visible = true;
          const p = clamp((elapsed - 0.48) / 3.22, 0, 1);
          const climbPhase = clamp((p - 0.58) / 0.42, 0, 1);
          const sy = 12.2 + p * 2.5 + Math.pow(climbPhase, 1.85) * 58;
          const sz = -42 + 94 * easeOutCubic(p);

          const growScale = (0.22 + Math.pow(p, 1.3) * 2.03) * Math.max(0.15, smoothstep(0.0, 0.16, p));
          introSanta3D.scale.setScalar(growScale);
          introSanta3D.position.set(0, sy, sz);
          introSanta3D.rotation.set(-0.05 - climbPhase * 0.52, 0, Math.sin(p * Math.PI * 4) * 0.035);
          emitSleighTrail(introSanta3D.position);

          const easeUp = easeInOutCubic(clamp((elapsed - 1.90) / 1.75, 0, 1));
          targetCamPos.set(0, 12.5 + easeUp * 3.5, 56 - easeUp * 6);
          targetCamLook.set(0, 13.5 + easeUp * 96, -15 - easeUp * 20);
        } else {
          introSanta3D.visible = false;
        }

        // 3. Bông tuyết khổng lồ rơi & hạ Camera xuống Cây thông (3.50s - 6.50s)
        if (elapsed >= 3.50 && elapsed <= 6.50) {
          giantSnowflakesGroup.visible = true;
          const sp = clamp((elapsed - 3.50) / 3.00, 0, 1);
          if (elapsed >= 4.05 && !worldTreeGroup.visible) worldTreeGroup.visible = true;

          if (elapsed > 3.70) {
            const easeDown = easeInOutCubic(clamp((elapsed - 3.70) / 2.45, 0, 1));
            targetCamPos.set(0, 16 - easeDown * 5, 50 + easeDown * 6);
            targetCamLook.set(0, 109.5 - easeDown * 98, -35 + easeDown * 35);
          }

          camera.getWorldDirection(_forwardVec);
          giantSnowflakes.forEach((gs, idx) => {
            const localFall = gs.offsetY - sp * gs.fallSpeed;
            const dist = 10.5 + (idx % 5) * 2.2;
            gs.mesh.position.set(
              camera.position.x + _forwardVec.x * dist + gs.offsetX * 0.45,
              camera.position.y + _forwardVec.y * dist + localFall - 12,
              camera.position.z + _forwardVec.z * dist + _forwardVec.z
            );
            gs.mesh.rotation.x += 0.018 * gs.rotSpeedX;
            gs.mesh.rotation.y += 0.018 * gs.rotSpeedY;
            gs.mesh.rotation.z += 0.032 * gs.rotSpeedZ;
          });
        } else {
          giantSnowflakesGroup.visible = false;
        }

        // 4. Sau 6.50s: Góc nhìn 360 độ & 6 chế độ Camera
        if (elapsed > 6.50) {
          worldTreeGroup.visible = true;
          const blendWeight = smoothstep(6.50, 8.0, elapsed);
          const preset = CAMERA_MODES[cameraMode];

          if (preset.id === 'orbit360' || hasDraggedManual360) {
            if (preset.id === 'orbit360' && !isDraggingOrbit) orbitAzimuth += dt * 0.38;
            targetCamPos.set(
              _centerLook.x + orbitRadius * Math.sin(orbitPolar) * Math.sin(orbitAzimuth),
              Math.max(2.2, _centerLook.y + orbitRadius * Math.cos(orbitPolar) - 8),
              _centerLook.z + orbitRadius * Math.sin(orbitPolar) * Math.cos(orbitAzimuth)
            );
            targetCamLook.copy(_centerLook);
          } else {
            const gentleSwayX = Math.sin((elapsed - 6.50) * 0.45) * 2.0;
            const gentleSwayY = Math.cos((elapsed - 6.50) * 0.35) * 0.7;
            targetCamPos.set(
              preset.pos.x + (gentleSwayX + userLookOffset.x) * blendWeight,
              preset.pos.y + (gentleSwayY + userLookOffset.y * 0.5) * blendWeight,
              preset.pos.z
            );
            targetCamLook.set(
              preset.look.x + userLookOffset.x * 0.4 * blendWeight,
              preset.look.y + userLookOffset.y * 0.4 * blendWeight,
              preset.look.z
            );
          }
        }

        const lerpFactor = elapsed <= 6.50 ? 1 : Math.min(1, dt * (isDraggingOrbit ? 12 : 4.5));
        camPos.lerp(targetCamPos, lerpFactor);
        camLook.lerp(targetCamLook, lerpFactor);
        camera.position.copy(camPos);
        camera.lookAt(camLook);
      }

      let lastFrameTime = performance.now();

      function animate3D(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
        const timeSec = now / 1000;
        lastFrameTime = now;

        updateDirectorTimeline(now, dt);

        if (portal3DGroup.visible) {
          const pd = portal3DGroup.userData;
          pd.vortexDisc.rotation.z -= dt * 2.4;
          pd.innerVortexDisc.rotation.z += dt * 3.2;
          pd.outerRing.rotation.z += dt * 0.9;
          pd.cyanRing.rotation.z -= dt * 1.6;
          pd.portalLight.intensity = 2.8 + Math.sin(timeSec * 12) * 0.8;

          const sAttr = pd.sparkPoints.geometry.attributes.position;
          for (let i = 0; i < pd.sparkAngles.length; i++) {
            const sa = pd.sparkAngles[i];
            sa.angle += sa.speed * dt;
            const r = sa.radius + Math.sin(timeSec * 4 + i) * 0.45;
            sAttr.setXYZ(i, Math.cos(sa.angle) * r, Math.sin(sa.angle) * r, Math.sin(timeSec * 3 + i) * 1.2);
          }
          sAttr.needsUpdate = true;
        }

        moonSphere.rotation.y = timeSec * 0.04;
        const moonPulse = 1 + Math.sin(timeSec * 1.8) * 0.035;
        moonCoronaSprite.scale.set(38 * moonPulse, 38 * moonPulse, 1);

        auroraSkyDome.rotation.y = timeSec * 0.02;
        auroraSkyDome.material.opacity = 0.30 + Math.sin(timeSec * 1.1) * 0.06;

        auroraLayers.forEach((layer) => {
          const pos = layer.geo.attributes.position;
          const { colCount, colX, colBaseZ, topBaseY, botBaseY, speed, amp, phase } = layer;
          for (let col = 0; col < colCount; col++) {
            const x = colX[col];
            const waveZ = colBaseZ[col] + Math.sin(x * 0.026 + timeSec * speed + phase) * amp + Math.cos(x * 0.014 - timeSec * (speed * 0.7)) * (amp * 0.55);
            const waveY = Math.sin(x * 0.02 + timeSec * 0.85 + phase) * 2.2;
            pos.setY(col, topBaseY + waveY);
            pos.setZ(col, waveZ);
            pos.setY(col + colCount, botBaseY + waveY);
            pos.setZ(col + colCount, waveZ);
          }
          pos.needsUpdate = true;
          layer.mat.opacity = layer.baseOpacity + Math.sin(timeSec * 1.3 + phase) * 0.08;
        });
        auroraSkyLight.intensity = 0.68 + Math.sin(timeSec * 1.6) * 0.18;

        starLayerA.mat.opacity = 0.84 + Math.sin(timeSec * 2.8) * 0.16;
        starLayerB.mat.opacity = 0.82 + Math.cos(timeSec * 2.2 + 1.2) * 0.18;

        if (giantTree3D.userData.topStarMesh) {
          giantTree3D.userData.topStarMesh.rotation.y = Math.sin(timeSec * 1.8) * 0.35;
          giantTree3D.userData.starGlowHalo.scale.setScalar(1 + Math.sin(timeSec * 3.5) * 0.14);
        }
        giantTree3D.userData.lightBulbs.forEach((b) => {
          b.mesh.material.emissiveIntensity = 0.6 + 0.55 * Math.sin(timeSec * 4.2 + b.phase);
        });
        snowmenPair.forEach((sm) => {
          sm.userData.wavingArm.rotation.z = sm.userData.mirrorDir * Math.sin(timeSec * 4.2) * 0.25;
        });

        // Cập nhật khói trắng 3D bốc lên từ ống khói Ngôi nhà gỗ Bắc Cực & đèn hàng rào
        if (worldTreeGroup.visible) {
          cabinSmokePuffs.forEach((p) => {
            p.age += dt;
            if (p.age >= p.maxAge) p.age %= p.maxAge;
            const u = p.age / p.maxAge;
            const sway = Math.sin(timeSec * 2.2 + p.wobblePhase) * 0.45 * u;
            p.mesh.position.set(
              2.35 + p.driftX * u * 3.2 + sway,
              9.15 + u * 8.5,
              -1.65 + p.driftZ * u * 2.4
            );
            p.mesh.scale.setScalar(0.35 + u * 1.55);
            p.mat.opacity = u < 0.2 ? (u / 0.2) * 0.52 : (1 - (u - 0.2) / 0.8) * 0.52;
          });

          cabinFenceBulbs.forEach((fb) => {
            fb.mesh.material.emissiveIntensity = 0.65 + 0.55 * Math.sin(timeSec * 4.5 + fb.phase);
          });
        }

        // Cập nhật hồ băng, ánh phản chiếu và chim cánh cụt.
        if (cabinFrozenLake3D && worldTreeGroup.visible) {
          const ld = cabinFrozenLake3D.userData;
          ld.warmReflection.material.opacity = 0.42 + Math.sin(timeSec * 4.2) * 0.1;
          ld.moonReflection.material.opacity = 0.34 + Math.cos(timeSec * 2.5) * 0.08;
          ld.pierLight.intensity = 1.75 + Math.sin(timeSec * 5.0) * 0.2;

          const skateT = timeSec * 1.15;
          const px = Math.sin(skateT) * 3.8;
          const pz = Math.sin(skateT * 2) * 1.9 + 0.6;
          const dx = Math.cos(skateT) * 3.8;
          const dz = Math.cos(skateT * 2) * 3.8;
          ld.penguin.position.set(px, 0.18, pz);
          ld.penguin.rotation.y = Math.atan2(dx, dz);
          ld.penguin.rotation.z = Math.sin(skateT * 2) * 0.18;
        }
        if (introSanta3D.visible) animateRigReindeers(introSanta3D, timeSec);

        if (orbitSantaActive) {
          orbitSanta3D.visible = true;
          const angle = timeSec * 0.52, rx = 29, rz = 21;
          orbitSanta3D.position.set(Math.cos(angle) * rx, 14.5 + Math.sin(angle * 2) * 2.5, Math.sin(angle) * rz - 2);
          orbitSanta3D.rotation.y = Math.atan2(-Math.sin(angle) * rx, Math.cos(angle) * rz);
          orbitSanta3D.rotation.z = Math.sin(angle) * 0.12;
          animateRigReindeers(orbitSanta3D, timeSec);
          emitSleighTrail(orbitSanta3D.position);
        } else {
          orbitSanta3D.visible = false;
        }

        const trailAttr = trailPoints.geometry.attributes.position;
        for (let i = 0; i < trailCount; i++) {
          if (trailData[i].life > 0) {
            trailData[i].life -= dt * 0.9;
            if (trailData[i].life <= 0) {
              trailAttr.setXYZ(i, 0, -999, 0);
            } else {
              trailAttr.setXYZ(
                i,
                trailAttr.getX(i) + trailData[i].vx * dt,
                trailAttr.getY(i) + trailData[i].vy * dt,
                trailAttr.getZ(i) + trailData[i].vz * dt
              );
            }
          }
        }
        trailAttr.needsUpdate = true;

        if (burstLife > 0) {
          burstLife = Math.max(0, burstLife - dt * 1.4);
          burstMat.opacity = burstLife;
          const bAttr = burstGeo.attributes.position;
          for (let i = 0; i < burstCount; i++) {
            burstVel[i].vy -= 18 * dt;
            bAttr.setXYZ(
              i,
              bAttr.getX(i) + burstVel[i].vx * dt,
              bAttr.getY(i) + burstVel[i].vy * dt,
              bAttr.getZ(i) + burstVel[i].vz * dt
            );
          }
          bAttr.needsUpdate = true;
        }

        skyReindeers3D.forEach((deer) => {
          deer.position.x += deer.userData.dir * deer.userData.speed * dt;
          deer.position.y = deer.userData.baseY + Math.sin(timeSec * 2.5 + deer.userData.phase) * 1.8;
          if (deer.userData.dir > 0 && deer.position.x > 115) deer.position.x = -115;
          if (deer.userData.dir < 0 && deer.position.x < -115) deer.position.x = 115;
          deer.userData.legs.forEach((leg) => {
            const s = Math.sin(timeSec * 12 + leg.phase + deer.userData.phase);
            leg.pivot.rotation.x = s * 0.65;
            if (leg.knee) leg.knee.rotation.x = leg.isFront ? Math.max(0, s) * 0.6 : -Math.max(0, -s) * 0.5;
          });
        });

        const posAttr = snowParticles.geometry.attributes.position;
        for (let i = 0; i < snowParticleCount; i++) {
          const v = snowVel[i];
          let x = posAttr.getX(i) + (v.vx + Math.sin(timeSec + v.phase) * 0.8) * dt;
          let y = posAttr.getY(i) - v.vy * dt;
          let z = posAttr.getZ(i) + v.vz * dt;
          if (y < -12) { y = 88; x = rand(-95, 95); z = rand(-95, 95); }
          posAttr.setXYZ(i, x, y, z);
        }
        posAttr.needsUpdate = true;

        for (let i = 0; i < smallCrystalCount; i++) {
          const cf = smallCrystalFlakes[i];
          cf.mesh.position.y -= cf.vy * dt;
          cf.mesh.position.x += (cf.vx + Math.sin(timeSec * cf.swaySpeed + cf.phase) * cf.swayAmp) * dt;
          cf.mesh.rotation.x += cf.rotX * dt;
          cf.mesh.rotation.y += cf.rotY * dt;
          cf.mesh.rotation.z += cf.rotZ * dt;
          if (cf.mesh.position.y < -14) {
            cf.mesh.position.set(rand(-85, 85), rand(82, 96), rand(-85, 85));
          }
        }

        if (giftsFallingActive && gifts3DGroup.visible) {
          fallingGifts3D.forEach((g) => {
            g.y -= g.fallSpeed * dt;
            if (g.y < -22) g.y = rand(38, 56);
            const swayX = Math.sin(timeSec * g.swaySpeed + g.phase) * g.swayAmp;
            g.group.position.set(g.baseX + swayX, g.y, g.z);
            g.group.rotation.x += g.rotSpeedX * dt;
            g.group.rotation.y += g.rotSpeedY * dt;
            g.group.rotation.z = Math.sin(timeSec * g.swaySpeed + g.phase) * 0.25;

            if (g.group.userData.popAnim > 0) {
              g.group.userData.popAnim = Math.max(0, g.group.userData.popAnim - dt * 1.8);
              const p = Math.sin(g.group.userData.popAnim * Math.PI);
              g.group.userData.lidAnchor.position.y = 1.42 + p * 2.2;
              g.group.userData.lidAnchor.rotation.z = p * 0.55;
            }
          });
        }

// 1. Tự động đo & tối ưu hóa FPS theo thiết bị
        fpsAutoScaler.update(dt);

        // 2. Cập nhật Bảng gỗ 3D đếm ngược Giáng sinh (chỉ vẽ lại đúng 1 lần mỗi giây)
        const currentWholeSec = Math.floor(timeSec);
        if (currentWholeSec !== lastCountdownSec) {
          lastCountdownSec = currentWholeSec;
          updateCountdownSignCanvas();
        }

        // 3. Cập nhật Gia đình Chim cánh cụt đi dạo & Cáo tuyết Bắc Cực vẫy đuôi
        if (arcticWildlifeGroup && worldTreeGroup.visible) {
          penguinFamily.forEach((pf) => {
            const t = timeSec * 0.75 - pf.lag;
            // Đi bộ vòng cung quanh bờ hồ băng & trước hiên nhà gỗ
            const px = -19.5 + Math.cos(t) * 4.2;
            const pz = -1.2 + Math.sin(t) * 2.8;
            const dx = -Math.sin(t) * 4.2;
            const dz = Math.cos(t) * 2.8;
            const hop = Math.abs(Math.sin(timeSec * pf.waddleSpeed)) * 0.14;
            pf.mesh.position.set(px, -1.42 + hop, pz);
            pf.mesh.rotation.y = Math.atan2(dx, dz);
            pf.mesh.rotation.z = Math.sin(timeSec * pf.waddleSpeed) * 0.18; // Dáng đi lạch bạch
          });

          if (arcticFox3D) {
            const fd = arcticFox3D.userData;
            // Cáo tuyết vẫy chiếc đuôi bông xù, nghiêng đầu ngước nhìn và nhún nhảy nhẹ
            fd.tailPivot.rotation.y = Math.sin(timeSec * 6.5) * 0.38;
            fd.tailPivot.rotation.x = Math.cos(timeSec * 3.2) * 0.12;
            fd.headGroup.rotation.z = Math.sin(timeSec * 2.4) * 0.16;
            fd.headGroup.rotation.y = Math.cos(timeSec * 1.8) * 0.25;
            const foxHop = Math.max(0, Math.sin(timeSec * 3.6) - 0.65) * 0.85;
            arcticFox3D.position.y = -1.38 + foxHop;
          }
        }

// ==================== CẬP NHẬT 5 MÔ-ĐUN NÂNG CẤP TRONG ANIMATE3D ====================
        const wCfg = WEATHER_CONFIGS[weatherMode];

        // 1. Hiệu ứng gió lốc Bắc Cực hoặc Tuyết dịu theo chế độ thời tiết
        if (wCfg.windX !== 0 || wCfg.speedMult !== 1.0) {
          const extraVy = (wCfg.speedMult - 1.0) * 6.5 * dt;
          const extraVx = wCfg.windX * dt;
          const sPos = snowParticles.geometry.attributes.position;
          for (let i = 0; i < snowParticleCount; i++) {
            let x = sPos.getX(i) + extraVx;
            let y = sPos.getY(i) - extraVy;
            if (x > 95) x = -95;
            if (y < -12) y = 88;
            sPos.setX(i, x);
            sPos.setY(i, y);
          }
          sPos.needsUpdate = true;
        }

        // 2. Cập nhật Mưa Sao Băng 3D xẹt ngang bầu trời đêm
        shootingStars.forEach((st) => {
          if (!st.active) {
            st.delay -= dt * wCfg.starRate;
            if (st.delay <= 0) {
              st.active = true;
              st.life = 0;
              st.maxLife = rand(0.65, 1.05);
              st.x = rand(-95, 65);
              st.y = rand(52, 95);
              st.z = rand(-150, -85);
              const dir = Math.random() > 0.5 ? 1 : -1;
              st.vx = dir * rand(75, 115);
              st.vy = -rand(28, 46);
              st.vz = rand(-15, 15);
            }
          } else {
            st.life += dt;
            const p = st.life / st.maxLife;
            if (p >= 1) {
              st.active = false;
              st.mat.opacity = 0;
              st.delay = rand(2.5, 6.8);
            } else {
              st.x += st.vx * dt;
              st.y += st.vy * dt;
              st.z += st.vz * dt;
              const tailLen = 0.11;
              const posArr = st.line.geometry.attributes.position;
              posArr.setXYZ(0, st.x, st.y, st.z);
              posArr.setXYZ(1, st.x - st.vx * tailLen, st.y - st.vy * tailLen, st.z - st.vz * tailLen);
              posArr.needsUpdate = true;
              st.mat.opacity = Math.sin(p * Math.PI) * 0.95;
            }
          }
        });

        // 3. Cập nhật Pháo hoa 3D nổ trên bầu trời
        for (let i = fireworkBursts.length - 1; i >= 0; i--) {
          const fw = fireworkBursts[i];
          fw.life -= dt * 0.72;
          if (fw.life <= 0) {
            fireworkGroup.remove(fw.points, fw.fwLight);
            fw.geo.dispose();
            fw.mat.dispose();
            fireworkBursts.splice(i, 1);
          } else {
            fw.mat.opacity = fw.life;
            fw.fwLight.intensity = fw.life * 2.5;
            const attr = fw.geo.attributes.position;
            for (let j = 0; j < fw.vels.length; j++) {
              const v = fw.vels[j];
              v.vy -= 12.5 * dt; // Trọng lực kéo tia pháo hoa rơi cong xuống
              attr.setXYZ(
                j,
                attr.getX(j) + v.vx * dt * 0.92,
                attr.getY(j) + v.vy * dt * 0.92,
                attr.getZ(j) + v.vz * dt * 0.92
              );
            }
            attr.needsUpdate = true;
          }
        }

        // 4. Cập nhật Quả Châu Lời Chúc & Tương tác Easter Eggs (Ngôi sao + Người tuyết nhảy 360°)
        customWishBaubleGroup.rotation.y = timeSec * 1.4;
        wishBaubleRing.rotation.x = timeSec * 2.2;
        wishBaubleHalo.scale.setScalar(1 + Math.sin(timeSec * 4.5) * 0.18);

        if (treeMagicPulse > 0) {
          treeMagicPulse = Math.max(0, treeMagicPulse - dt * 0.85);
          const wave = Math.sin(treeMagicPulse * Math.PI);
          if (giantTree3D.userData.topStarMesh) {
            giantTree3D.userData.topStarMesh.rotation.y += dt * 12;
            giantTree3D.userData.starGlowHalo.scale.setScalar(1 + wave * 1.4);
          }
          giantTree3D.userData.lightBulbs.forEach((b) => {
            b.mesh.material.emissiveIntensity = 1.2 + wave * 2.2;
          });
        }

        snowmenPair.forEach((sm) => {
          if (sm.userData.jumpAnim > 0) {
            sm.userData.jumpAnim = Math.max(0, sm.userData.jumpAnim - dt * 1.35);
            const jp = sm.userData.jumpAnim;
            sm.position.y = sm.userData.baseY + Math.sin(jp * Math.PI) * 3.8;
            sm.rotation.y = sm.userData.baseRotY + (1 - jp) * Math.PI * 2;
          }
        });

        // 5. Góc nhìn thứ nhất "Ngồi Trên Cỗ Xe Ông Già Noel" (First-Person Sleigh POV)
        if (CAMERA_MODES[cameraMode] && CAMERA_MODES[cameraMode].id === 'sleigh_pov' && orbitSantaActive && !hasDraggedManual360) {
          const seatWorldPos = orbitSanta3D.localToWorld(new THREE.Vector3(0, 6.2, -4.5));
          const reindeerLookPos = orbitSanta3D.localToWorld(new THREE.Vector3(0, 3.8, 12.0));
          camera.position.lerp(seatWorldPos, 0.25);
          camera.lookAt(reindeerLookPos);
        }

        renderer.render(scene3D, camera);
        requestAnimationFrame(animate3D);
      }

      /* ==================== 16. SỰ KIỆN MỞ RÈM & KHỞI CHẠY ==================== */
      function openCurtain() {
        if (isCurtainOpened) return;
        isCurtainOpened = true;
        if (curtainHint) curtainHint.style.display = 'none';
        worldTreeGroup.visible = false;

        startJingleBellsMusic();
        curtainStage.classList.add('open');
        timelineStart = performance.now();
        timelineRunning = true;

        schedule(playSantaHoHoHoSound, 520);
        schedule(() => { snowWhiteout.classList.add('active'); worldTreeGroup.visible = true; }, 4100);
        schedule(() => snowWhiteout.classList.remove('active'), 4850);
        schedule(() => { giantSnowflakesGroup.visible = false; sceneEl.classList.add('show-title'); }, 6800);
        schedule(() => sceneEl.classList.add('show-subtitle'), 7550);
        schedule(() => { gifts3DGroup.visible = true; giftsFallingActive = true; orbitSantaActive = true; }, 8200);
        schedule(() => sceneEl.classList.add('dock-greeting'), 9800);

        if (customCardData.to || customCardData.msg) {
          schedule(() => {
            openGiftWish(
              {
                title: customCardData.to ? `Gửi ${customCardData.to} Yêu Quý!` : 'Giáng Sinh An Lành!',
                text: customCardData.msg || 'Chúc bạn một mùa Giáng sinh ngập tràn niềm vui, hạnh phúc và phép màu ấm áp!',
                sender: customCardData.from
              },
              GIFT_PALETTES[0],
              true
            );
          }, 10300);
        }
      }

      function resetAndStandbyCurtain() {
        clearTimers();
        isCurtainOpened = timelineRunning = giftsFallingActive = orbitSantaActive = hasDraggedManual360 = false;
        cameraMode = 0; orbitAzimuth = 0; orbitPolar = 1.38; orbitRadius = 56;
        cameraViewBtn.textContent = CAMERA_MODES[0].label;
        cameraViewBtn.classList.remove('active-360');

        portal3DGroup.visible = introSanta3D.visible = orbitSanta3D.visible = giantSnowflakesGroup.visible = gifts3DGroup.visible = false;
        worldTreeGroup.visible = true;
        snowWhiteout.classList.remove('active');

        closeGiftWish();
        creatorModalBackdrop.classList.remove('active');
        stopAllMusic();

        curtainStage.classList.remove('open');
        if (curtainHint) curtainHint.style.display = '';
        sceneEl.classList.remove('show-title', 'show-subtitle', 'dock-greeting');
        resetFallingGiftsState();
      }

      curtainStage.addEventListener('click', openCurtain);
      curtainStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openCurtain(); }
      });
      replayBtn.addEventListener('click', resetAndStandbyCurtain);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        updateCabinLakeViewportMode();
      }, { passive: true });

      resetFallingGiftsState();
      requestAnimationFrame(animate3D);
    })();
  </script>
</body>
</html>
