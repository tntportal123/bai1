<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Merry Christmas · Đêm tuyết nhiệm màu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Dancing+Script:wght@700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #07152b;
      --gold: #ffd887;
      --cream: #fff7e8;
      --red: #d94850;
      --green: #0c573f;
      --font-vn: "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-display: "Playfair Display", Georgia, "Times New Roman", serif;
      --font-script: "Dancing Script", cursive, serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: var(--night);
      color: var(--cream);
      font-family: var(--font-vn);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      user-select: none;
    }

    /* ================= BỐI CẢNH ĐÊM GIÁNG SINH ================= */
    .scene {
      position: relative;
      width: 100%; height: 100%; min-height: 480px;
      overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 76%, rgba(22, 91, 100, .45), transparent 37%),
        radial-gradient(ellipse at 50% 34%, rgba(41, 73, 120, .42), transparent 53%),
        linear-gradient(180deg, #081326 0%, #0c2040 48%, #112e4a 77%, #0b2637 100%);
    }
    .scene::before {
      content: ""; position: absolute; z-index: -1; inset: auto -15% -19%;
      height: 36%; border-radius: 50% 50% 0 0 / 23% 23% 0 0;
      background: linear-gradient(180deg, #e7f5f1 0%, #b8d9dc 100%);
      box-shadow: 0 -18px 70px rgba(218, 250, 255, .13);
    }
    .sky-glow {
      position: absolute; left: 50%; top: 48%; width: min(78vw, 850px); aspect-ratio: 1;
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(244, 203, 130, .105), rgba(118, 181, 194, .04) 42%, transparent 69%);
      animation: breathe 6s ease-in-out infinite alternate;
    }
    .moon {
      position: absolute; right: 12%; top: 10%; width: clamp(52px, 8vw, 98px); aspect-ratio: 1;
      border-radius: 50%; background: #ffedc4;
      box-shadow: 0 0 22px #ffe9bb, 0 0 75px rgba(255, 221, 162, .48);
      opacity: .83;
    }
    .moon::after {
      content: ""; position: absolute; width: 100%; height: 100%; left: 20%; top: -12%;
      border-radius: 50%; background: #142644;
    }
    .stars { position: absolute; inset: 0; pointer-events: none; }
    .star {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff2d3;
      box-shadow: 0 0 9px 2px rgba(255, 230, 184, .65);
      animation: twinkle var(--twinkle, 3s) ease-in-out infinite alternate;
    }

    /* ================= PHÂN CẢNH 1: TẤM RÈM ĐỎ GIÁNG SINH ================= */
    .curtain-stage {
      position: absolute;
      z-index: 20;
      inset: 0;
      overflow: hidden;
      cursor: pointer;
      pointer-events: auto;
      transition: visibility 0s linear 2s;
    }
    .curtain-stage.is-open {
      pointer-events: none;
      visibility: hidden;
    }

    /* Diềm rèm phía trên (Valance) */
    .curtain-valance {
      position: absolute;
      z-index: 4;
      top: 0; left: -2%; width: 104%;
      height: clamp(78px, 14vh, 130px);
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, .65));
      transition: transform 1.5s cubic-bezier(.6, .04, .25, 1) .15s;
    }
    .curtain-stage.is-open .curtain-valance {
      transform: translateY(-115%);
    }

    /* Hai cánh rèm trái & phải */
    .curtain-panel {
      position: absolute;
      z-index: 2;
      top: 0;
      width: 51%;
      height: 100%;
      /* Hiệu ứng nếp gấp vải nhung đỏ sang trọng */
      background:
        repeating-linear-gradient(
          90deg,
          rgba(45, 4, 10, .55) 0%,
          rgba(165, 22, 35, .1) 4%,
          rgba(220, 48, 60, .28) 8%,
          rgba(95, 10, 18, .48) 12%,
          rgba(45, 4, 10, .55) 16%
        ),
        linear-gradient(180deg, #8f111d 0%, #6d0b14 55%, #47050b 100%);
      box-shadow: inset 0 0 60px rgba(0, 0, 0, .65), 0 0 45px rgba(0, 0, 0, .75);
      transition: transform 1.85s cubic-bezier(.68, 0, .26, 1);
      will-change: transform;
    }
    .curtain-panel.left {
      left: 0;
      border-right: 4px solid #e6b85c;
      transform-origin: left top;
    }
    .curtain-panel.right {
      right: 0;
      border-left: 4px solid #e6b85c;
      transform-origin: right top;
    }
    .curtain-stage.is-open .curtain-panel.left {
      transform: translateX(-102%) skewX(-2deg);
    }
    .curtain-stage.is-open .curtain-panel.right {
      transform: translateX(102%) skewX(2deg);
    }

    /* Đồ trang trí gắn trên rèm */
    .curtain-decor {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }
    .ornament-swing {
      transform-box: fill-box;
      transform-origin: top center;
      animation: sway var(--sway-dur, 3.2s) ease-in-out infinite alternate;
    }
    .ornament-float {
      transform-box: fill-box;
      transform-origin: center;
      animation: gentle-pulse 2.8s ease-in-out infinite alternate;
    }

    /* Đèn nhấp nháy trên rèm */
    .bulb-a { animation: bulb-blink 1.1s ease-in-out infinite alternate; }
    .bulb-b { animation: bulb-blink 1.1s ease-in-out .55s infinite alternate; }
    .bulb-c { animation: bulb-blink 1.4s ease-in-out .3s infinite alternate; }

    /* Nút nhắc nhấn để mở màn - biến mất NGAY LẬP TỨC khi nhấp */
    .curtain-prompt {
      position: absolute;
      z-index: 5;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(145, 18, 31, .95) 0%, rgba(74, 6, 13, .95) 100%);
      border: 2px solid #ffd887;
      color: #fff6df;
      font-family: var(--font-vn);
      font-size: clamp(.85rem, 2vw, 1.05rem);
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: 0 0 30px rgba(255, 200, 92, .55), inset 0 0 12px rgba(255, 226, 158, .35);
      white-space: nowrap;
      cursor: pointer;
      animation: prompt-pulse 1.4s ease-in-out infinite alternate;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .curtain-stage:hover .curtain-prompt {
      box-shadow: 0 0 42px rgba(255, 216, 120, .85), inset 0 0 16px rgba(255, 240, 190, .55);
    }
    .curtain-stage.is-open .curtain-prompt,
    .curtain-prompt.is-hidden {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
      transition: none !important;
      animation: none !important;
    }

    /* ================= PHÂN CẢNH 2: SANTA CLAUS & ĐÀN TUẦN LỘC BAY ================= */
    .orbit {
      position: absolute;
      z-index: 5;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .flight-sleigh {
      opacity: 0;
      will-change: transform, opacity;
    }
    /* Ông già Noel bay theo quỹ đạo tròn/elip rộng quanh cây thông ở đoạn cuối */
    .orbit-sleigh-wrap {
      opacity: 0;
      transition: opacity 1s ease;
      will-change: transform, opacity;
    }
    .scene.play-orbit .orbit-sleigh-wrap {
      opacity: 1;
    }
    .sleigh {
      overflow: visible;
      filter: drop-shadow(0 10px 18px rgba(4, 12, 25, .6));
    }
    .magic-sparkle {
      animation: twinkle .6s ease-in-out infinite alternate;
    }

    /* Đàn tuần lộc bay qua bay lại từ trái sang phải & từ phải sang trái */
    .sky-reindeers {
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .scene.play-snow .sky-reindeers {
      opacity: 1;
    }
    .reindeer-runner {
      opacity: 0;
      will-change: transform, opacity;
    }
    .scene.play-snow .reindeer-ltr-1 {
      animation: reindeer-fly-ltr-1 13s linear 0.5s infinite;
    }
    .scene.play-snow .reindeer-rtl-1 {
      animation: reindeer-fly-rtl-1 15s linear 2.2s infinite;
    }
    .scene.play-snow .reindeer-ltr-2 {
      animation: reindeer-fly-ltr-2 17s linear 5.5s infinite;
    }
    .scene.play-snow .reindeer-rtl-2 {
      animation: reindeer-fly-rtl-2 14s linear 8.2s infinite;
    }
    .reindeer-bob {
      animation: reindeer-leap .65s ease-in-out infinite alternate;
    }

    /* ================= PHÂN CẢNH 3: TUYẾT RƠI, CÂY THÔNG & LỜI CHÚC ================= */
    #snow {
      position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
    }
    .scene.play-snow #snow {
      opacity: 1;
    }

    .intro-snow { position: absolute; z-index: 3; inset: 0; overflow: hidden; pointer-events: none; }
    .intro-flake {
      position: absolute; top: -42vh; left: var(--x); width: var(--size); height: var(--size);
      overflow: visible; opacity: 0; filter: drop-shadow(0 0 18px rgba(229, 249, 255, .76));
    }
    .scene.play-snow .intro-flake {
      animation: mega-fall 3.15s cubic-bezier(.38,.05,.62,.97) var(--delay) forwards;
    }
    .intro-flake path { fill: none; stroke: #f5fcff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }

    .snowbanks {
      position: absolute; z-index: 1; inset: auto 0 0; height: 20%; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(224, 243, 239, .28) 20%, #e7f5f1 72%);
      clip-path: ellipse(72% 78% at 50% 100%);
    }

    .tree-wrap {
      position: absolute; z-index: 2; left: 50%; top: 53%;
      width: clamp(240px, 41vw, 510px); height: min(76vh, 660px);
      transform: translate(-50%, -42%) scale(.68); opacity: 0;
      filter: drop-shadow(0 15px 26px rgba(1, 13, 22, .38));
    }
    .scene.play-tree .tree-wrap {
      animation: tree-arrive 2.1s cubic-bezier(.2,.8,.25,1) forwards;
    }
    .tree-svg { width: 100%; height: 100%; overflow: visible; }
    .tree-lights { animation: lights 2.2s ease-in-out infinite alternate; }
    .tree-lights-alt { animation: lights 1.8s ease-in-out .9s infinite alternate; }
    .top-star-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: star-glow 2s ease-in-out infinite alternate;
    }

    /* Rừng cây thông nhỏ trang trí hai bên đồi tuyết phía dưới */
    .mini-forest {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
    }
    .mini-tree {
      position: absolute;
      bottom: var(--bottom, 10%);
      width: var(--w, clamp(52px, 8.5vw, 114px));
      filter: drop-shadow(0 8px 12px rgba(4, 22, 28, .38));
      opacity: 0;
      transform: translateY(24px) scale(.82);
    }
    .mini-tree.back-layer {
      z-index: 1;
      filter: drop-shadow(0 5px 8px rgba(4, 20, 28, .28)) brightness(.88);
    }
    .scene.play-tree .mini-tree {
      animation:
        decor-arrive 1.05s cubic-bezier(.2, .85, .28, 1) var(--delay, .45s) forwards,
        bob var(--bob-dur, 4s) ease-in-out calc(var(--delay, .45s) + 1.1s) infinite;
    }
    /* 4 cây thông nhỏ bên trái */
    .mini-tree.t-l1 { left: 1.5%;  --bottom: 10.5%; --w: clamp(58px, 9.2vw, 124px); --delay: .38s; --bob-dur: 4.1s; }
    .mini-tree.t-l2 { left: 9.5%;  --bottom: 13.5%; --w: clamp(42px, 6.4vw, 86px);  --delay: .56s; --bob-dur: 3.6s; }
    .mini-tree.t-l3 { left: 16.5%; --bottom: 8.8%;  --w: clamp(50px, 7.8vw, 104px); --delay: .72s; --bob-dur: 4.4s; }
    .mini-tree.t-l4 { left: 24.5%; --bottom: 12.2%; --w: clamp(38px, 5.6vw, 74px);  --delay: .88s; --bob-dur: 3.8s; }
    /* 4 cây thông nhỏ bên phải */
    .mini-tree.t-r1 { right: 1.5%;  --bottom: 10.5%; --w: clamp(58px, 9.2vw, 124px); --delay: .44s; --bob-dur: 4.2s; }
    .mini-tree.t-r2 { right: 9.5%;  --bottom: 13.5%; --w: clamp(42px, 6.4vw, 86px);  --delay: .62s; --bob-dur: 3.7s; }
    .mini-tree.t-r3 { right: 16.5%; --bottom: 8.8%;  --w: clamp(50px, 7.8vw, 104px); --delay: .78s; --bob-dur: 4.5s; }
    .mini-tree.t-r4 { right: 24.5%; --bottom: 12.2%; --w: clamp(38px, 5.6vw, 74px);  --delay: .94s; --bob-dur: 3.9s; }

    .greeting {
      position: absolute; z-index: 4; left: 50%; top: 46%; width: min(92vw, 1000px);
      text-align: center; transform: translate(-50%, -50%) scale(.03); opacity: 0;
      pointer-events: none;
    }
    .scene.play-greeting .greeting {
      animation: greeting-arrive 1.25s cubic-bezier(.18,.9,.25,1.2) forwards;
    }
    .greeting h1 {
      margin: 0; color: #fff6df; font-family: var(--font-display);
      font-size: clamp(2.6rem, 8.2vw, 6.8rem);
      font-weight: 700; line-height: 1.02; letter-spacing: .02em;
      text-shadow: 0 2px 0 #ce9d55, 0 5px 0 rgba(111, 62, 31, .5), 0 0 28px rgba(255, 209, 126, .8), 0 0 82px rgba(255, 180, 91, .48);
    }
    .greeting p {
      margin: clamp(10px, 2vh, 18px) 0 0; color: #fff0d1;
      font-family: var(--font-vn); font-size: clamp(.95rem, 2.1vw, 1.38rem);
      font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
      opacity: .96; text-shadow: 0 2px 14px rgba(10, 28, 44, .9), 0 0 18px rgba(255, 208, 131, .65);
    }

    /* ================= 15 HỘP QUÀ RƠI LIÊN TỤC LẶP ĐI LẶP LẠI NHƯ TUYẾT ================= */
    .gifts-stage {
      position: absolute;
      z-index: 9;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      opacity: 0;
      transition: opacity .6s ease;
    }
    .scene.play-gifts .gifts-stage {
      opacity: 1;
    }
    .gift-box-btn {
      position: absolute;
      left: 0;
      top: 0;
      width: clamp(50px, 5.6vw, 68px);
      height: clamp(54px, 6vw, 72px);
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      pointer-events: none;
      touch-action: manipulation;
      will-change: transform;
      filter: drop-shadow(0 8px 12px rgba(4, 15, 28, .55));
      transition: filter .2s ease;
    }
    .scene.play-gifts .gift-box-btn {
      pointer-events: auto;
    }
    .gift-box-btn:hover,
    .gift-box-btn:focus-visible {
      filter: drop-shadow(0 0 20px rgba(255, 220, 125, .98));
      outline: none;
      z-index: 4;
    }
    .gift-box-btn:hover .gift-box-inner,
    .gift-box-btn:focus-visible .gift-box-inner {
      transform: scale(1.22);
    }
    .gift-box-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .18s cubic-bezier(.2, .9, .3, 1.3);
    }
    .gift-box-btn.is-opened {
      filter: drop-shadow(0 0 14px rgba(255, 222, 130, .9));
    }
    .gift-box-btn svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }
    .gift-opened-badge {
      position: absolute;
      top: -5px;
      right: -3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2ebd6b, #147a3d);
      border: 1.5px solid #fff6d6;
      color: #fff;
      font-family: var(--font-vn);
      font-weight: 700;
      font-size: 10px;
      line-height: 15px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.45);
      opacity: 0;
      transform: scale(0);
      transition: transform .25s ease, opacity .25s ease;
      pointer-events: none;
    }
    .gift-box-btn.is-opened .gift-opened-badge {
      opacity: 1;
      transform: scale(1);
    }

    /* ================= MODAL MỞ HỘP QUÀ & LỜI CHÚC ================= */
    .wish-modal-backdrop {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(4, 12, 24, .76);
      backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .32s ease, visibility .32s ease;
    }
    .wish-modal-backdrop.is-active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .wish-modal-card {
      position: relative;
      width: min(92vw, 480px);
      padding: 28px 26px 24px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 220, 138, .22), transparent 62%),
        linear-gradient(180deg, #7d101c 0%, #4d0811 55%, #2b0409 100%);
      border: 2.5px solid #ffd887;
      box-shadow: 0 22px 60px rgba(0, 0, 0, .75), 0 0 40px rgba(255, 205, 105, .35), inset 0 0 24px rgba(255, 224, 150, .18);
      text-align: center;
      color: #fff8ea;
      font-family: var(--font-vn);
      transform: scale(.72) translateY(24px);
      transition: transform .38s cubic-bezier(.18, .9, .28, 1.2);
      overflow: hidden;
    }
    .wish-modal-backdrop.is-active .wish-modal-card {
      transform: scale(1) translateY(0);
    }
    .wish-modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 216, 135, .65);
      background: rgba(25, 4, 8, .55);
      color: #ffe9b8;
      font-family: var(--font-vn);
      font-weight: 700;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .wish-modal-close:hover {
      background: #d93848;
      transform: scale(1.08);
    }
    .wish-modal-art {
      width: 96px;
      height: 96px;
      margin: 0 auto 10px;
      filter: drop-shadow(0 8px 18px rgba(255, 206, 105, .5));
      animation: modal-gift-bounce 2s ease-in-out infinite alternate;
    }
    .wish-modal-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(255, 216, 135, .18);
      border: 1px solid #ffd887;
      color: #ffe299;
      font-family: var(--font-vn);
      font-weight: 700;
      font-size: 12px;
      line-height: 1.3;
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .wish-modal-title {
      margin: 0 0 12px;
      font-family: var(--font-vn);
      font-weight: 700;
      font-size: clamp(1.3rem, 3.4vw, 1.68rem);
      line-height: 1.3;
      color: #fff3cf;
      text-shadow: 0 2px 10px rgba(255, 200, 95, .55);
    }
    .wish-modal-text {
      margin: 0 0 20px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(15, 3, 6, .42);
      border: 1px solid rgba(255, 216, 135, .3);
      font-family: var(--font-vn);
      font-size: clamp(.95rem, 2.2vw, 1.06rem);
      line-height: 1.65;
      color: #fff9ee;
    }
    .wish-modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .wish-btn {
      padding: 10px 20px;
      border-radius: 999px;
      font-family: var(--font-vn);
      font-weight: 700;
      font-size: 13px;
      line-height: 1.25;
      letter-spacing: .02em;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .wish-btn.primary {
      background: linear-gradient(180deg, #ffd97d 0%, #e09f2d 100%);
      border: 1.5px solid #fff4cf;
      color: #3d070e;
      box-shadow: 0 6px 18px rgba(255, 202, 92, .45);
    }
    .wish-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 216, 120, .7);
    }
    .wish-btn.secondary {
      background: rgba(255, 255, 255, .1);
      border: 1.5px solid rgba(255, 216, 135, .6);
      color: #ffefc7;
    }
    .wish-btn.secondary:hover {
      background: rgba(255, 255, 255, .2);
      transform: translateY(-2px);
    }

    .caption {
      position: absolute; z-index: 6; bottom: 0.8%; left: 0; width: 100%; text-align: center;
      color: rgba(31, 73, 84, .75); font: 600 10px/1.4 var(--font-vn); letter-spacing: .24em;
      text-transform: uppercase; opacity: 0; pointer-events: none;
    }
    .scene.play-greeting .caption {
      animation: caption-in 1s ease .8s forwards;
    }

    /* Nút phát lại toàn bộ hoạt cảnh */
    .replay-btn {
      position: absolute;
      z-index: 15;
      top: 16px;
      left: 16px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 216, 135, .55);
      background: rgba(12, 32, 64, .78);
      color: #ffefc7;
      font: 600 12px/1 var(--font-vn);
      letter-spacing: .04em;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease, background .25s ease;
    }
    .scene.play-greeting .replay-btn {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
      transition-delay: 1.1s;
    }
    .replay-btn:hover {
      background: rgba(181, 47, 60, .9);
      border-color: #fff2cc;
    }

    /* ================= KEYFRAMES HOẠT ẢNH ================= */
    @keyframes breathe { to { opacity: .55; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes twinkle { from { opacity: .22; transform: scale(.65); } to { opacity: 1; transform: scale(1.3); } }
    @keyframes lights { from { opacity: .68; } to { opacity: 1; filter: drop-shadow(0 0 7px #ffd36c); } }
    @keyframes star-glow {
      from { transform: scale(.95); filter: drop-shadow(0 0 6px #ffe89e); }
      to { transform: scale(1.08); filter: drop-shadow(0 0 16px #fff5cc); }
    }
    @keyframes sway {
      from { transform: rotate(-5deg); }
      to { transform: rotate(5deg); }
    }
    @keyframes gentle-pulse {
      from { transform: scale(.97) rotate(-2deg); }
      to { transform: scale(1.03) rotate(2deg); }
    }
    @keyframes bulb-blink {
      0% { opacity: .38; filter: brightness(.8); }
      100% { opacity: 1; filter: brightness(1.35) drop-shadow(0 0 9px currentColor); }
    }
    @keyframes prompt-pulse {
      from { transform: translateX(-50%) scale(.97); opacity: .82; }
      to { transform: translateX(-50%) scale(1.03); opacity: 1; }
    }

    /* Các đường bay qua lại của đàn tuần lộc trên bầu trời (Trái -> Phải & Phải -> Trái) */
    @keyframes reindeer-fly-ltr-1 {
      0%   { opacity: 0; transform: translate(-180px, 130px) rotate(-6deg) scale(.62); }
      6%   { opacity: .92; }
      50%  { opacity: .95; transform: translate(520px, 85px) rotate(2deg) scale(.68); }
      94%  { opacity: .92; }
      100% { opacity: 0; transform: translate(1180px, 140px) rotate(7deg) scale(.62); }
    }
    @keyframes reindeer-fly-rtl-1 {
      0%   { opacity: 0; transform: translate(1180px, 210px) scale(-0.58, 0.58) rotate(-6deg); }
      6%   { opacity: .9; }
      50%  { opacity: .92; transform: translate(480px, 150px) scale(-0.64, 0.64) rotate(2deg); }
      94%  { opacity: .9; }
      100% { opacity: 0; transform: translate(-180px, 220px) scale(-0.58, 0.58) rotate(7deg); }
    }
    @keyframes reindeer-fly-ltr-2 {
      0%   { opacity: 0; transform: translate(-180px, 290px) rotate(-8deg) scale(.52); }
      6%   { opacity: .85; }
      50%  { opacity: .88; transform: translate(500px, 225px) rotate(1deg) scale(.56); }
      94%  { opacity: .85; }
      100% { opacity: 0; transform: translate(1180px, 275px) rotate(8deg) scale(.52); }
    }
    @keyframes reindeer-fly-rtl-2 {
      0%   { opacity: 0; transform: translate(1180px, 105px) scale(-0.52, 0.52) rotate(-5deg); }
      6%   { opacity: .86; }
      50%  { opacity: .9; transform: translate(500px, 68px) scale(-0.56, 0.56) rotate(2deg); }
      94%  { opacity: .86; }
      100% { opacity: 0; transform: translate(-180px, 118px) scale(-0.52, 0.52) rotate(6deg); }
    }
    @keyframes reindeer-leap {
      from { transform: translateY(-4px) rotate(-3deg); }
      to   { transform: translateY(5px) rotate(4deg); }
    }

    @keyframes modal-gift-bounce {
      from { transform: translateY(0) scale(.97) rotate(-3deg); }
      to   { transform: translateY(-6px) scale(1.04) rotate(3deg); }
    }

    @keyframes mega-fall {
      0% { opacity: 0; transform: translate3d(-50%, -3vh, 0) rotate(-25deg); }
      12% { opacity: .94; }
      88% { opacity: .88; }
      100% { opacity: 0; transform: translate3d(-50%, 185vh, 0) rotate(335deg); }
    }
    @keyframes tree-arrive { to { transform: translate(-50%, -48%) scale(1); opacity: 1; } }
    @keyframes greeting-arrive {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.02) rotate(-8deg); filter: blur(16px); }
      56% { opacity: 1; transform: translate(-50%, -50%) scale(1.28) rotate(2deg); filter: blur(0); }
      72% { opacity: 1; transform: translate(-50%, -50%) scale(.9) rotate(-1deg); }
      88% { opacity: 1; transform: translate(-50%, -50%) scale(1.06) rotate(.4deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes decor-arrive { to { opacity: .93; transform: translateY(0) scale(1); } }
    @keyframes bob { 50% { translate: 0 -8px; } }
    @keyframes caption-in { to { opacity: 1; } }

    @media (max-width: 600px) {
      .moon { right: 8%; top: 8%; }
      .tree-wrap { top: 53%; height: 58vh; width: min(70vw, 340px); }
      .intro-flake { top: -36vh; }
      .greeting { top: 44%; }
      .greeting h1 { font-size: clamp(2.4rem, 11vw, 4.2rem); }
      .greeting p { letter-spacing: .08em; }
      .mini-tree.t-l1 { left: 0.5%;  --bottom: 12.5%; --w: clamp(46px, 13vw, 74px); }
      .mini-tree.t-l2 { left: 8.5%;  --bottom: 15%;   --w: clamp(34px, 9.5vw, 56px); }
      .mini-tree.t-l3 { left: 15.5%; --bottom: 10.5%; --w: clamp(40px, 11vw, 64px); }
      .mini-tree.t-l4 { left: 23%;   --bottom: 13.8%; --w: clamp(30px, 8.5vw, 48px); }
      .mini-tree.t-r1 { right: 0.5%;  --bottom: 12.5%; --w: clamp(46px, 13vw, 74px); }
      .mini-tree.t-r2 { right: 8.5%;  --bottom: 15%;   --w: clamp(34px, 9.5vw, 56px); }
      .mini-tree.t-r3 { right: 15.5%; --bottom: 10.5%; --w: clamp(40px, 11vw, 64px); }
      .mini-tree.t-r4 { right: 23%;   --bottom: 13.8%; --w: clamp(30px, 8.5vw, 48px); }
      .gift-box-btn { width: 46px; height: 50px; }
      .replay-btn { top: 10px; left: 10px; padding: 7px 12px; font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

      let introFlightActive = false;
      let introFlightStart = 0;

      // Trạng thái bay vòng quanh cây thông ở đoạn cuối
      let orbitActive = false;
      let orbitAngle = Math.PI; // Bắt đầu từ phía bên trái cây thông

      let giftsFallingActive = false;

      const rand = (min, max) => Math.random() * (max - min) + min;

      // Danh sách 15 lời chúc Giáng sinh ý nghĩa, ấm áp (sẽ được xáo trộn ngẫu nhiên cho 15 hộp quà)
      const CHRISTMAS_WISHES_POOL = [

      // Bảng màu đa dạng cho 15 hộp quà
      const GIFT_PALETTES = [
        { box: "#d93848", dark: "#9e1826", ribbon: "#ffd875", bow: "#ffe89e" },
        { box: "#197a4b", dark: "#0d4f2e", ribbon: "#ff4d5a", bow: "#ff7882" },
        { box: "#246bce", dark: "#134287", ribbon: "#ffd875", bow: "#fff0b8" },
        { box: "#8b3dc7", dark: "#571d87", ribbon: "#ffdf80", bow: "#fff2bd" },
        { box: "#e07a1b", dark: "#9e4d08", ribbon: "#fff4d1", bow: "#ffd875" },
        { box: "#178ca6", dark: "#0c5669", ribbon: "#ffd875", bow: "#ffe8a3" },
        { box: "#c72c6c", dark: "#821441", ribbon: "#ffe082", bow: "#fff5cc" },
        { box: "#d49b17", dark: "#916405", ribbon: "#d92638", bow: "#ff5263" }
      ];

      let shuffledWishes = [];
      let openedGifts = new Set();

      // Hàm xáo trộn mảng Fisher-Yates
      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      // Tạo SVG hộp quà theo màu sắc
      function createGiftBoxSVG(palette, isOpenedModal = false) {
        const lidTransform = isOpenedModal ? 'transform="translate(0, -10) rotate(-8 50 32)"' : '';
        return `
          <svg viewBox="0 0 100 105" aria-hidden="true">
            <!-- Bóng đổ dưới đáy hộp -->
            <ellipse cx="50" cy="96" rx="38" ry="6" fill="rgba(0,0,0,0.28)"/>
            <!-- Thân hộp quà -->
            <rect x="18" y="42" width="64" height="52" rx="6" fill="${palette.box}" stroke="${palette.dark}" stroke-width="2.5"/>
            <path d="M50 42 H82 V94 H50 Z" fill="${palette.dark}" opacity="0.25"/>
            <!-- Dây ruy băng dọc & ngang trên thân hộp -->
            <rect x="43" y="42" width="14" height="52" fill="${palette.ribbon}"/>
            <rect x="18" y="62" width="64" height="11" fill="${palette.ribbon}" opacity="0.9"/>
            <!-- Nắp hộp & Nơ -->
            <g ${lidTransform}>
              <rect x="13" y="28" width="74" height="16" rx="5" fill="${palette.box}" stroke="${palette.dark}" stroke-width="2.5"/>
              <rect x="42" y="28" width="16" height="16" fill="${palette.ribbon}"/>
              <!-- Cánh nơ trái & phải -->
              <path d="M50,28 C32,8 14,18 28,28 C36,32 45,30 50,28 Z" fill="${palette.bow}" stroke="${palette.dark}" stroke-width="2"/>
              <path d="M50,28 C68,8 86,18 72,28 C64,32 55,30 50,28 Z" fill="${palette.bow}" stroke="${palette.dark}" stroke-width="2"/>
              <circle cx="50" cy="27" r="6.5" fill="${palette.ribbon}" stroke="${palette.dark}" stroke-width="2"/>
            </g>
            <!-- Ngôi sao lấp lánh trên hộp quà -->
            <circle cx="28" cy="52" r="2.2" fill="#fff9db" opacity="0.85"/>
            <circle cx="72" cy="82" r="2" fill="#fff9db" opacity="0.75"/>
          </svg>
        `;
      }

      // Tính tọa độ ngang cho hộp quà theo làn để phủ đều màn hình
      function computeGiftX(index) {
        const w = width || window.innerWidth || 1000;
        const margin = 28;
        const usableWidth = Math.max(200, w - margin * 2 - 60);
        const laneWidth = usableWidth / 15;
        return margin + index * laneWidth + rand(0, Math.max(8, laneWidth * 0.75));
      }

      // Khởi tạo 15 hộp quà rơi liên tục từ trên xuống như tuyết
      function renderGiftBoxes() {
        shuffledWishes = shuffleArray(CHRISTMAS_WISHES_POOL);
        openedGifts.clear();
        giftsStage.innerHTML = '';
        fallingGifts = [];

        const h = height || window.innerHeight || 700;
        // Xáo trộn thứ tự độ cao ban đầu để 15 hộp quà rơi rải rác tự nhiên khắp màn hình
        const heightOrder = shuffleArray(Array.from({ length: 15 }, (_, idx) => idx));

        for (let i = 0; i < 15; i++) {
          const palette = GIFT_PALETTES[i % GIFT_PALETTES.length];
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'gift-box-btn';
          btn.dataset.index = i;
          btn.setAttribute('aria-label', 'Mở hộp quà Giáng sinh nhận lời chúc');
          btn.innerHTML = `
            <div class="gift-box-inner">
              ${createGiftBoxSVG(palette, false)}
              <span class="gift-opened-badge" title="Đã mở">✓</span>
            </div>
          `;

          // Bắt sự kiện ngay khi chạm/nhấn chuột để người dùng dễ dàng bấm trúng khi hộp quà đang rơi
          btn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            openGiftModal(i);
          });
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            openGiftModal(i);
          });

          giftsStage.appendChild(btn);

          const initialX = computeGiftX(i);
          const initialY = -95 - heightOrder[i] * Math.max(55, (h + 180) / 15) - rand(0, 35);
          const giftObj = {
            index: i,
            el: btn,
            baseX: initialX,
            x: initialX,
            y: initialY,
            speed: rand(1.05, 1.75),
            swayAmp: rand(12, 26),
            swaySpeed: rand(0.0011, 0.0022),
            phase: rand(0, Math.PI * 2),
            rotAmp: rand(8, 16)
          };
          btn.style.transform = `translate3d(${giftObj.x.toFixed(1)}px, ${giftObj.y.toFixed(1)}px, 0) rotate(0deg)`;
          fallingGifts.push(giftObj);
        }
      }

      // Cập nhật vị trí rơi liên tục của 15 hộp quà (khi rơi qua đáy sẽ vòng lại lên đỉnh màn hình)
      function updateFallingGifts(time, delta) {
        if (!giftsFallingActive) return;
        const h = height || window.innerHeight || 700;

        for (let i = 0; i < fallingGifts.length; i++) {
          const g = fallingGifts[i];
          g.y += g.speed * delta;
          const wave = Math.sin(time * g.swaySpeed + g.phase);
          g.x = g.baseX + wave * g.swayAmp;
          const rot = wave * g.rotAmp;

          // Khi hộp quà rơi qua khỏi cạnh dưới màn hình, đưa trở lại lên phía trên đỉnh màn hình để rơi tiếp
          if (g.y > h + 90) {
            g.y = rand(-130, -85);
            g.baseX = computeGiftX(g.index);
            g.x = g.baseX;
            g.speed = rand(1.05, 1.75);
            g.phase = rand(0, Math.PI * 2);
          }

          g.el.style.transform = `translate3d(${g.x.toFixed(1)}px, ${g.y.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg)`;
        }
      }

      function openGiftModal(index) {
        const item = shuffledWishes[index];
        const palette = GIFT_PALETTES[index % GIFT_PALETTES.length];
        openedGifts.add(index);

        const btn = giftsStage.querySelector(`.gift-box-btn[data-index="${index}"]`);
        if (btn) btn.classList.add('is-opened');

        wishModalArt.innerHTML = createGiftBoxSVG(palette, true);
        wishModalBadge.textContent = '🎁 MÓN QUÀ GIÁNG SINH DIỆU KỲ';
        wishModalTitle.textContent = item.title;
        wishModalText.textContent = `“${item.wish}”`;
        wishModal.classList.add('is-active');
      }

      function closeGiftModal() {
        wishModal.classList.remove('is-active');
      }

      // Mở ngẫu nhiên một hộp quà chưa mở (hoặc bất kỳ nếu đã mở hết 15 hộp)
      function openNextRandomGift() {
        const unopened = [];
        for (let i = 0; i < 15; i++) {
          if (!openedGifts.has(i)) unopened.push(i);
        }
        const pool = unopened.length > 0 ? unopened : Array.from({ length: 15 }, (_, idx) => idx);
        const randomIndex = pool[Math.floor(Math.random() * pool.length)];
        openGiftModal(randomIndex);
      }

      wishModalClose.addEventListener('click', closeGiftModal);
      wishCloseBtn.addEventListener('click', closeGiftModal);
      wishNextBtn.addEventListener('click', openNextRandomGift);
      wishModal.addEventListener('click', (e) => {
        if (e.target === wishModal) closeGiftModal();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wishModal.classList.contains('is-active')) {
          closeGiftModal();
        }
      });

      // Khởi tạo 46 ngôi sao lấp lánh trên bầu trời
      for (let i = 0; i < 46; i++) {
        const star = document.createElement('i');
        star.className = 'star';
        star.style.left = `${rand(3, 97)}%`;
        star.style.top = `${rand(3, 74)}%`;
        star.style.setProperty('--twinkle', `${rand(1.8, 4.8)}s`);
        star.style.animationDelay = `${rand(-5, 0)}s`;
        stars.appendChild(star);
      }

      // Quản lý bộ đếm thời gian cho kịch bản 3 giai đoạn
      function clearTimers() {
        while (timers.length) {
          clearTimeout(timers.pop());
        }
      }

      function schedule(fn, delay) {
        const id = setTimeout(fn, delay);
        timers.push(id);
      }

      // Cập nhật chuyến bay mở màn của Ông già Noel: bay theo đường vòng cung cao rõ nét từ trái sang phải, không dừng ở giữa
      function updateIntroSantaFlight(now) {
        if (!introFlightActive) return;
        const elapsed = now - introFlightStart;
        const p = Math.min(Math.max(elapsed / INTRO_FLIGHT_DURATION, 0), 1);

        const startX = -220;
        const endX = 1220;
        const baseY = 475;
        const archAmplitude = 350; // Vòng cung vút cao lên đỉnh bầu trời (y = 125 ở giữa màn hình)

        const x = startX + (endX - startX) * p;
        const y = baseY - archAmplitude * Math.sin(p * Math.PI);

        // Đạo hàm tiếp tuyến liên tục để mũi xe & tuần lộc hướng lên khi bay lên đỉnh vòng cung và chúc xuống khi đáp sang phải
        const dx = endX - startX;
        const dy = -Math.PI * archAmplitude * Math.cos(p * Math.PI);
        const angle = Math.atan2(dy, dx) * (180 / Math.PI) * 0.72;
        const scale = 1.12 + 0.16 * Math.sin(p * Math.PI);

        // Mờ dần vào ở đầu biên trái và mờ dần ra ở cuối biên phải
        let opacity = 1;
        if (p < 0.06) opacity = p / 0.06;
        else if (p > 0.94) opacity = (1 - p) / 0.06;

        introSleigh.style.opacity = opacity.toFixed(3);
        introSleigh.setAttribute(
          'transform',
          `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${angle.toFixed(2)}) scale(${scale.toFixed(3)})`
        );

        if (p >= 1) {
          introFlightActive = false;
          introSleigh.style.opacity = '0';
        }
      }

      // Cập nhật vị trí Ông già Noel (to hơn) bay theo phương trình elip RỘNG hơn quanh cây thông
      function updateOrbitPosition() {
        const centerX = 500;
        const centerY = 390;
        const radiusX = 430; // Quỹ đạo ngang rộng hơn bao quanh cây thông
        const radiusY = 270; // Quỹ đạo dọc rộng hơn

        const x = centerX + radiusX * Math.cos(orbitAngle);
        const y = centerY + radiusY * Math.sin(orbitAngle);

        // Vận tốc tiếp tuyến trên đường cong elip để xác định hướng quay và độ nghiêng tự nhiên
        const vx = -radiusX * Math.sin(orbitAngle);
        const vy = radiusY * Math.cos(orbitAngle);
        const dir = vx >= 0 ? 1 : -1;
        const tiltDeg = Math.atan2(vy, Math.abs(vx)) * (180 / Math.PI) * 0.26;

        // Kích thước Santa lớn hơn (scale từ 0.78 đến 0.98)
        const scale = 0.88 + 0.1 * Math.sin(orbitAngle);

        orbitSleighWrap.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(3)})`);
        orbitSleighFlip.setAttribute('transform', `scale(${dir} 1) rotate(${tiltDeg.toFixed(1)})`);
      }

      // Kịch bản chỉ bắt đầu khi người dùng nhấn vào rèm:
      // 1. Dòng chữ "Chạm vào rèm..." biến mất NGAY LẬP TỨC, đồng thời tấm rèm nhung đỏ mở sang 2 bên
      // 2. Ông già Noel (kích thước lớn) bay từ ngoài màn hình trái sang phải rồi biến mất
      // 3. Bông tuyết khổng lồ rơi xuống & đàn tuần lộc bay qua lại -> Cây thông Noel hiện lên -> Chữ "Merry Christmas / Giáng sinh an lành" và 15 hộp quà xuất hiện
      function openCurtainAndPlay() {
        if (sequenceStarted) return;
        sequenceStarted = true;
        clearTimers();

        // Bước 1: Ẩn ngay lập tức dòng chữ nhắc (0ms) và mở rèm đỏ
        curtainPrompt.classList.add('is-hidden');
        curtainStage.classList.add('is-open');

        // Bước 2: Ngay khi rèm hé mở (0.4s), Santa Claus bay liên tục từ ngoài bên trái sang bên phải (không dừng ở giữa)
        schedule(() => {
          introFlightStart = performance.now();
          introFlightActive = true;
        }, 400);

        // Bước 3A: Ngay khi Santa vừa bay khuất sang bên phải (3.95s), bông tuyết khổng lồ rơi xuống, mưa tuyết & đàn tuần lộc bay qua lại hiện ra
        schedule(() => {
          scene.classList.add('play-snow');
        }, 3950);

        // Bước 3B: Tiếp đến cây thông Noel lớn hiện lên ở giữa (5.6s) và 15 hộp quà bắt đầu rơi liên tục từ trên trời xuống
        schedule(() => {
          scene.classList.add('play-tree', 'play-gifts');
          giftsFallingActive = true;
        }, 5600);

        // Bước 3C: Cuối cùng dòng chữ "Merry Christmas / Giáng sinh an lành" bung ra ở giữa (7.5s)
        schedule(() => {
          scene.classList.add('play-greeting');
        }, 7500);

        // Bước 3D: Đoạn kết (8.2s), Santa Claus xuất hiện và bay theo quỹ đạo elip rộng quanh cây thông liên tục
        schedule(() => {
          orbitAngle = Math.PI;
          updateOrbitPosition();
          orbitActive = true;
          scene.classList.add('play-orbit');
        }, 8200);
      }

      // Hàm đưa về trạng thái đóng rèm ban đầu khi nhấn nút "Xem lại" và xáo trộn lại 15 lời chúc
      function resetAndReplay() {
        clearTimers();
        closeGiftModal();
        sequenceStarted = false;
        introFlightActive = false;
        orbitActive = false;
        giftsFallingActive = false;
        introSleigh.style.opacity = '0';
        introSleigh.setAttribute('transform', 'translate(-220 475) rotate(-28) scale(1.12)');

        // Xáo trộn lại 15 hộp quà cho lượt xem mới
        renderGiftBoxes();

        // Đóng màn nhung đỏ lại, hiện lại dòng chữ nhắc mở màn và reset các hiệu ứng phía sau
        curtainPrompt.classList.remove('is-hidden');
        curtainStage.classList.remove('is-open');
        scene.classList.remove('play-santa', 'play-snow', 'play-tree', 'play-gifts', 'play-greeting', 'play-orbit');
      }

      // Chỉ mở rèm khi người dùng nhấp chuột / chạm vào rèm hoặc nhấn phím Enter/Space
      curtainStage.addEventListener('click', openCurtainAndPlay);
      curtainStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCurtainAndPlay();
        }
      });
      replayBtn.addEventListener('click', resetAndReplay);

      // Tạo đối tượng bông tuyết 6 cánh nhỏ rơi ngẫu nhiên
      function createCrystalFlake(randomY = false) {
        return {
          x: rand(0, width),
          y: randomY ? rand(-height, height) : rand(-60, -12),
          size: rand(5.5, 11.5), // Đường kính khoảng 11px - 23px
          speed: rand(.55, 1.45),
          drift: rand(-.35, .35),
          phase: rand(0, Math.PI * 2),
          angle: rand(0, Math.PI * 2),
          spin: rand(-.018, .018),
          alpha: rand(.55, .95)
        };
      }

      // Vẽ bông tuyết 6 cánh tinh xảo trên Canvas
      function drawCrystalFlake(f) {
        ctx.save();
        ctx.translate(f.x, f.y);
        ctx.rotate(f.angle);
        ctx.strokeStyle = `rgba(245, 252, 255, ${f.alpha})`;
        ctx.lineWidth = Math.max(1.1, f.size * 0.14);
        ctx.lineCap = 'round';
        ctx.shadowBlur = 8;
        ctx.shadowColor = 'rgba(220, 245, 255, .85)';

        const s = f.size;
        const b1 = s * 0.52;
        const b2 = s * 0.28;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          // Nhánh chính
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -s);
          // Nhánh phụ nhỏ trên mỗi cánh
          ctx.moveTo(0, -b1);
          ctx.lineTo(-b2, -b1 - b2 * 0.75);
          ctx.moveTo(0, -b1);
          ctx.lineTo(b2, -b1 - b2 * 0.75);
          ctx.rotate(Math.PI / 3);
        }
        ctx.stroke();
        ctx.restore();
      }

      // Thiết lập Canvas tuyết rơi liên tục
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth; height = canvas.clientHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.max(90, Math.min(220, Math.round(width * height / 6500)));
        flakes = Array.from({ length: count }, () => ({
          x: rand(0, width), y: rand(-height, height), r: rand(1, 4.2),
          speed: rand(.45, 2.2), drift: rand(-.45, .45), phase: rand(0, Math.PI * 2),
          alpha: rand(.36, .91)
        }));
        const crystalCount = Math.max(14, Math.min(32, Math.round(width / 48)));
        crystalFlakes = Array.from({ length: crystalCount }, () => createCrystalFlake(true));

        // Cập nhật lại làn rơi ngang của 15 hộp quà khi thay đổi kích thước màn hình
        if (fallingGifts.length === 15) {
          for (let i = 0; i < fallingGifts.length; i++) {
            fallingGifts[i].baseX = computeGiftX(i);
          }
        }
      }

      function draw(time) {
        if (reduced) {
          ctx.clearRect(0, 0, width, height);
          flakes.forEach(f => {
            ctx.beginPath(); ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
          });
          crystalFlakes.forEach(drawCrystalFlake);
          return;
        }
        const delta = Math.min((time - (last || time)) / 16.7, 2.5); last = time;
        ctx.clearRect(0, 0, width, height);

        // Cập nhật chuyến bay mở màn liên tục (từ trái qua phải, không khựng lại ở giữa)
        if (introFlightActive) {
          updateIntroSantaFlight(time);
        }

        // Vẽ các hạt tuyết tròn mềm mại
        for (const f of flakes) {
          f.y += f.speed * delta; f.x += (f.drift + Math.sin(time / 1000 + f.phase) * .34) * delta;
          if (f.y > height + 7) { f.y = -8; f.x = rand(0, width); }
          if (f.x < -8) f.x = width + 8; else if (f.x > width + 8) f.x = -8;
          ctx.beginPath(); ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
          ctx.shadowBlur = f.r > 3.2 ? 12 : 4; ctx.shadowColor = 'rgba(232,247,255,.9)';
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Vẽ các bông tuyết 6 cánh nhỏ xoay tròn và rơi ngẫu nhiên
        for (let i = 0; i < crystalFlakes.length; i++) {
          const cf = crystalFlakes[i];
          cf.y += cf.speed * delta;
          cf.x += (cf.drift + Math.cos(time / 900 + cf.phase) * .42) * delta;
          cf.angle += cf.spin * delta;

          if (cf.y > height + 20) {
            crystalFlakes[i] = createCrystalFlake(false);
          } else {
            if (cf.x < -20) cf.x = width + 20;
            else if (cf.x > width + 20) cf.x = -20;
            drawCrystalFlake(cf);
          }
        }

        // Cập nhật 15 hộp quà rơi liên tục từ đỉnh xuống đáy màn hình lặp đi lặp lại
        if (giftsFallingActive) {
          updateFallingGifts(time, delta);
        }

        // Cập nhật chuyển động elip/tròn rộng mượt mà của Ông già Noel quanh cây thông
        if (orbitActive) {
          orbitAngle = (orbitAngle + 0.009 * delta) % (Math.PI * 2);
          updateOrbitPosition();
        }

        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();
      renderGiftBoxes();
      updateOrbitPosition();
      if (reduced) draw(0); else requestAnimationFrame(draw);
    })();
  </script>
</body>
