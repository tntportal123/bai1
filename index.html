          opacity: 0.55,
          depthWrite: false,
          side: THREE.DoubleSide
        });

        const mainPlane = new THREE.Mesh(new THREE.PlaneGeometry(radius * 2, radius * 2), crystalMat);
        const backPlane = new THREE.Mesh(new THREE.PlaneGeometry(radius * 2.08, radius * 2.08), softLayerMat);
        backPlane.position.z = -0.12;
        backPlane.rotation.z = Math.PI / 6;

        flake.add(backPlane, mainPlane);
        return flake;
      }

      const giantSnowflakesGroup = new THREE.Group();
      giantSnowflakesGroup.visible = false;
      scene3D.add(giantSnowflakesGroup);

      const giantSnowflakes = [];
      for (let i = 0; i < 32; i++) {
        const size = rand(4.2, 8.4);
        const sf = createGiantCrystalSnowflake3D(size, i);
        giantSnowflakesGroup.add(sf);
        giantSnowflakes.push({
          mesh: sf,
          offsetX: rand(-25, 25),
          offsetY: rand(16, 48),
          offsetZ: rand(-22, -4),
          fallSpeed: rand(56, 72),
          rotSpeedX: rand(-1.2, 1.2),
          rotSpeedY: rand(-1.4, 1.4),
          rotSpeedZ: rand(-2.2, 2.2)
        });
      }

      /* ==================== MƯA TUYẾT HẠT TRÒN + BÔNG TUYẾT NHỎ 6 CÁNH ==================== */
      const snowParticleCount = 950;
      const snowGeo = new THREE.BufferGeometry();
      const snowPos = new Float32Array(snowParticleCount * 3);
      const snowVel = [];

      for (let i = 0; i < snowParticleCount; i++) {
        snowPos[i * 3] = rand(-95, 95);
        snowPos[i * 3 + 1] = rand(-12, 95);
        snowPos[i * 3 + 2] = rand(-95, 95);
        snowVel.push({
          vy: rand(4.5, 11.0),
          vx: rand(-1.4, 1.4),
          vz: rand(-1.4, 1.4),
          phase: rand(0, Math.PI * 2)
        });
      }
      snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));

      const snowSpriteCanvas = document.createElement('canvas');
      snowSpriteCanvas.width = 64;
      snowSpriteCanvas.height = 64;
      const sCtx = snowSpriteCanvas.getContext('2d');
      const grad = sCtx.createRadialGradient(32, 32, 2, 32, 32, 30);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.45, 'rgba(235, 248, 255, 0.82)');
      grad.addColorStop(1, 'rgba(235, 248, 255, 0)');
      sCtx.fillStyle = grad;
      sCtx.fillRect(0, 0, 64, 64);
      const snowTexture = new THREE.CanvasTexture(snowSpriteCanvas);

      const snowParticles = new THREE.Points(
        snowGeo,
        new THREE.PointsMaterial({
          size: 1.25,
          map: snowTexture,
          transparent: true,
          opacity: 0.86,
          depthWrite: false
        })
      );
      scene3D.add(snowParticles);

      const smallCrystalFlakesGroup = new THREE.Group();
      scene3D.add(smallCrystalFlakesGroup);

      const smallCrystalMaterials = crystalTextures.map((tex) =>
        new THREE.MeshBasicMaterial({
          map: tex,
          color: 0xf4fcff,
          transparent: true,
          opacity: 0.9,
          depthWrite: false,
          side: THREE.DoubleSide,
          blending: THREE.AdditiveBlending
        })
      );

      const smallCrystalFlakes = [];
      const smallCrystalCount = 240;
      const unitPlaneGeo = new THREE.PlaneGeometry(1, 1);

      for (let i = 0; i < smallCrystalCount; i++) {
        const mat = smallCrystalMaterials[i % smallCrystalMaterials.length];
        const flakeMesh = new THREE.Mesh(unitPlaneGeo, mat);
        const s = rand(1.15, 2.55);
        flakeMesh.scale.set(s, s, s);
        flakeMesh.position.set(rand(-85, 85), rand(-12, 92), rand(-85, 85));
        flakeMesh.rotation.set(rand(0, Math.PI), rand(0, Math.PI), rand(0, Math.PI));
        smallCrystalFlakesGroup.add(flakeMesh);

        smallCrystalFlakes.push({
          mesh: flakeMesh,
          vy: rand(4.2, 9.2),
          vx: rand(-1.2, 1.2),
          swayAmp: rand(0.8, 2.2),
          swaySpeed: rand(1.1, 2.4),
          rotX: rand(-1.5, 1.5),
          rotY: rand(-1.8, 1.8),
          rotZ: rand(-2.4, 2.4),
          phase: rand(0, Math.PI * 2)
        });
      }

      /* ==================== PHÁO HOA HẠT SÁNG KHI BẤM MỞ HỘP QUÀ ==================== */
      const burstCount = 90;
      const burstGeo = new THREE.BufferGeometry();
      const burstPos = new Float32Array(burstCount * 3);
      const burstVel = [];
      for (let i = 0; i < burstCount; i++) {
        burstPos[i * 3] = 0;
        burstPos[i * 3 + 1] = -999;
        burstPos[i * 3 + 2] = 0;
        burstVel.push({ vx: 0, vy: 0, vz: 0 });
      }
      burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
      const burstMat = new THREE.PointsMaterial({
        color: 0xffe484,
        size: 1.85,
        map: snowTexture,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const burstParticles = new THREE.Points(burstGeo, burstMat);
      scene3D.add(burstParticles);
      let burstLife = 0;

      function triggerGiftSparkleBurst(pos, hexColor) {
        burstMat.color.setHex(hexColor || 0xffe484);
        burstMat.opacity = 1;
        burstLife = 1.0;
        const attr = burstParticles.geometry.attributes.position;
        for (let i = 0; i < burstCount; i++) {
          attr.setXYZ(i, pos.x, pos.y, pos.z);
          const theta = rand(0, Math.PI * 2);
          const phi = rand(0, Math.PI);
          const speed = rand(6, 22);
          burstVel[i].vx = Math.sin(phi) * Math.cos(theta) * speed;
          burstVel[i].vy = Math.cos(phi) * speed + 4;
          burstVel[i].vz = Math.sin(phi) * Math.sin(theta) * speed;
        }
        attr.needsUpdate = true;
      }

      /* ==================== 15 HỘP QUÀ KHỔNG LỒ 3D RƠI TỪ TRÊN TRỜI XUỐNG ==================== */
      const gifts3DGroup = new THREE.Group();
      gifts3DGroup.visible = false;
      scene3D.add(gifts3DGroup);

      let fallingGifts3D = [];
      let giftsFallingActive = false;

      const sharedGiftGeos = {
        box: new THREE.BoxGeometry(3.2, 2.7, 3.2),
        lid: new THREE.BoxGeometry(3.48, 0.72, 3.48),
        rib1: new THREE.BoxGeometry(0.58, 2.82, 3.32),
        rib2: new THREE.BoxGeometry(3.32, 2.82, 0.58),
        lidRib1: new THREE.BoxGeometry(0.64, 0.78, 3.56),
        lidRib2: new THREE.BoxGeometry(3.56, 0.78, 0.64),
        bow: new THREE.TorusGeometry(0.62, 0.18, 10, 20),
        knot: new THREE.SphereGeometry(0.32, 12, 12),
        hit: new THREE.SphereGeometry(2.9, 10, 10)
      };

      function createGiantGiftBox3D(palette) {
        const giftGroup = new THREE.Group();

        const boxMat = new THREE.MeshStandardMaterial({
          color: palette.hexBox,
          roughness: 0.28,
          metalness: 0.22
        });
        const lidMat = new THREE.MeshStandardMaterial({
          color: palette.hexLid,
          roughness: 0.24,
          metalness: 0.25
        });
        const ribbonMat = new THREE.MeshStandardMaterial({
          color: palette.hexRibbon,
          emissive: palette.hexRibbon,
          emissiveIntensity: 0.28,
          roughness: 0.18,
          metalness: 0.78
        });

        const boxMesh = new THREE.Mesh(sharedGiftGeos.box, boxMat);
        boxMesh.castShadow = true;
        const rib1 = new THREE.Mesh(sharedGiftGeos.rib1, ribbonMat);
        const rib2 = new THREE.Mesh(sharedGiftGeos.rib2, ribbonMat);
        giftGroup.add(boxMesh, rib1, rib2);

        const lidAnchor = new THREE.Group();
        lidAnchor.position.y = 1.42;

        const lidMesh = new THREE.Mesh(sharedGiftGeos.lid, lidMat);
        lidMesh.castShadow = true;
        const lidRib1 = new THREE.Mesh(sharedGiftGeos.lidRib1, ribbonMat);
        const lidRib2 = new THREE.Mesh(sharedGiftGeos.lidRib2, ribbonMat);

        const bowLeft = new THREE.Mesh(sharedGiftGeos.bow, ribbonMat);
        bowLeft.position.set(-0.52, 0.66, 0);
        bowLeft.rotation.z = Math.PI / 5;
        const bowRight = new THREE.Mesh(sharedGiftGeos.bow, ribbonMat);
        bowRight.position.set(0.52, 0.66, 0);
        bowRight.rotation.z = -Math.PI / 5;
        const bowCenter = new THREE.Mesh(sharedGiftGeos.knot, ribbonMat);
        bowCenter.position.set(0, 0.48, 0);

        lidAnchor.add(lidMesh, lidRib1, lidRib2, bowLeft, bowRight, bowCenter);
        giftGroup.add(lidAnchor);
        giftGroup.userData.lidAnchor = lidAnchor;

        const hitSphere = new THREE.Mesh(
          sharedGiftGeos.hit,
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        giftGroup.add(hitSphere);

        return giftGroup;
      }

      function disposeGiftGroupMaterials(group) {
        group.traverse((child) => {
          if (child.isMesh && child.material) {
            child.material.dispose();
          }
        });
      }

      function buildFallingGifts3D() {
        while (gifts3DGroup.children.length > 0) {
          const oldGift = gifts3DGroup.children[0];
          disposeGiftGroupMaterials(oldGift);
          gifts3DGroup.remove(oldGift);
        }
        fallingGifts3D = [];

        const shuffledWishes = shuffleArray(WISHES_POOL);
        const laneIndices = shuffleArray(Array.from({ length: 15 }, (_, idx) => idx));

        shuffledWishes.forEach((wish, i) => {
          const palette = GIFT_PALETTES[i % GIFT_PALETTES.length];
          const meshGroup = createGiantGiftBox3D(palette);

          const laneX = -32 + (laneIndices[i] / 14) * 64 + rand(-1.5, 1.5);
          const startY = 36 + i * 5.2 + rand(0, 4);
          const startZ = rand(-18, 24);

          meshGroup.position.set(laneX, startY, startZ);
          meshGroup.userData.giftInfo = { wish, palette };
          meshGroup.userData.popAnim = 0;

          meshGroup.traverse((child) => {
            child.userData.giftRoot = meshGroup;
          });

          gifts3DGroup.add(meshGroup);

          fallingGifts3D.push({
            group: meshGroup,
            baseX: laneX,
            y: startY,
            z: startZ,
            fallSpeed: rand(6.2, 10.2),
            swayAmp: rand(1.1, 2.5),
            swaySpeed: rand(0.9, 1.8),
            rotSpeedX: rand(-1.1, 1.1),
            rotSpeedY: rand(-1.6, 1.6),
            rotSpeedZ: rand(-0.9, 0.9),
            phase: rand(0, Math.PI * 2)
          });
        });
      }

      /* ==================== GÓC NHÌN 360 ĐỘ TỰ DO + 5 GÓC MÁY (CÓ THÊM GÓC NHÌN MỚI) ==================== */
      const raycaster = new THREE.Raycaster();
      const pointerNDC = new THREE.Vector2();
      const userLookOffset = new THREE.Vector2(0, 0);
      let hoveredGiftRoot = null;

      // Hệ tọa độ cầu 360 độ (Spherical Orbit) cho phép người dùng xoay tròn đủ 360 độ quanh khung cảnh
      let orbitAzimuth = 0;          // Góc xoay ngang 360 độ (-Infinity .. +Infinity)
      let orbitPolar = 1.38;         // Góc ngẩng/cúi (giới hạn an toàn không xuyên xuống đất)
      let orbitRadius = 56;          // Khoảng cách từ camera tới tâm
      let isDraggingOrbit = false;
      let hasDraggedManual360 = false;
      let dragStartPos = { x: 0, y: 0 };
      let prevDragPos = { x: 0, y: 0 };

      let cameraMode = 0;
      const CAMERA_MODES = [
        {
          id: 'panoramic',
          label: '🎥 Góc máy: Toàn cảnh (Kéo chuột xoay 360°)',
          pos: new THREE.Vector3(0, 11, 56),
          look: new THREE.Vector3(0, 11.5, 0)
        },
        {
          id: 'orbit360',
          label: '🎥 Góc máy: Xoay 360° Quanh Cây Thông',
          pos: new THREE.Vector3(0, 14, 56),
          look: new THREE.Vector3(0, 11.5, 0)
        },
        {
          id: 'aerial_sleigh',
          label: '🎥 Góc máy: Từ Cỗ Xe Trên Cao Nhìn Xuống (Mới)',
          pos: new THREE.Vector3(-22, 34, 42),
          look: new THREE.Vector3(0, 10, 0)
        },
        {
          id: 'snowman_low',
          label: '🎥 Góc máy: Cạnh Người Tuyết & Mặt Trăng (Mới)',
          pos: new THREE.Vector3(-19, 4.5, 22),
          look: new THREE.Vector3(8, 18, -18)
        },
        {
          id: 'moon_aurora',
          label: '🎥 Góc máy: Ngước Nhìn Mặt Trăng & Cực Quang',
          pos: new THREE.Vector3(-6, 7.5, 58),
          look: new THREE.Vector3(18, 34, -45)
        }
      ];

      cameraViewBtn.addEventListener('click', () => {
        cameraMode = (cameraMode + 1) % CAMERA_MODES.length;
        hasDraggedManual360 = false;
        const modeObj = CAMERA_MODES[cameraMode];
        cameraViewBtn.textContent = modeObj.label;
        cameraViewBtn.classList.toggle('active-360', modeObj.id === 'orbit360');

        // Đồng bộ góc tọa độ cầu ban đầu theo góc máy vừa chọn
        const offset = modeObj.pos.clone().sub(modeObj.look);
        orbitRadius = offset.length();
        orbitAzimuth = Math.atan2(offset.x, offset.z);
        orbitPolar = clamp(Math.acos(clamp(offset.y / orbitRadius, -1, 1)), 0.35, 1.52);
      });

      function getIntersectedGiftRoot(clientX, clientY) {
        if (!giftsFallingActive || !gifts3DGroup.visible) return null;
        const rect = renderer.domElement.getBoundingClientRect();
        pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(pointerNDC, camera);
        const intersects = raycaster.intersectObjects(gifts3DGroup.children, true);
        if (intersects.length > 0) {
          return intersects[0].object.userData.giftRoot || null;
        }
        return null;
      }

      renderer.domElement.addEventListener('pointerdown', (e) => {
        if (wishModalBackdrop.classList.contains('active') || creatorModalBackdrop.classList.contains('active')) return;
        isDraggingOrbit = true;
        dragStartPos = { x: e.clientX, y: e.clientY };
        prevDragPos = { x: e.clientX, y: e.clientY };
      });

      window.addEventListener('pointermove', (e) => {
        const rect = renderer.domElement.getBoundingClientRect();
        const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        userLookOffset.set(nx * 4.5, ny * 2.5);

        if (isDraggingOrbit && isCurtainOpened) {
          const dx = e.clientX - prevDragPos.x;
          const dy = e.clientY - prevDragPos.y;
          const totalMoved = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);

          if (totalMoved > 5) {
            hasDraggedManual360 = true;
            orbitAzimuth -= dx * 0.0075; // Xoay tròn đủ 360 độ không giới hạn
            orbitPolar = clamp(orbitPolar - dy * 0.0055, 0.32, 1.53);
            renderer.domElement.style.cursor = 'grabbing';
          }
          prevDragPos = { x: e.clientX, y: e.clientY };
          return;
        }

        const hitRoot = getIntersectedGiftRoot(e.clientX, e.clientY);
        if (hoveredGiftRoot && hoveredGiftRoot !== hitRoot) {
          hoveredGiftRoot.scale.setScalar(1);
        }
        hoveredGiftRoot = hitRoot;
        if (hoveredGiftRoot) {
          hoveredGiftRoot.scale.setScalar(1.24);
          renderer.domElement.style.cursor = 'pointer';
        } else {
          renderer.domElement.style.cursor = 'grab';
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (!isDraggingOrbit) return;
        isDraggingOrbit = false;
        renderer.domElement.style.cursor = 'grab';

        const totalMoved = Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y);
        // Nếu người dùng nhấp nhẹ (< 6px) vào hộp quà thay vì kéo xoay 360 độ -> Mở hộp quà!
        if (totalMoved < 6) {
          if (wishModalBackdrop.classList.contains('active') || creatorModalBackdrop.classList.contains('active')) return;
          const hitRoot = getIntersectedGiftRoot(e.clientX, e.clientY);
          if (hitRoot && hitRoot.userData.giftInfo) {
            const { wish, palette } = hitRoot.userData.giftInfo;
            hitRoot.userData.popAnim = 1.0;
            triggerGiftSparkleBurst(hitRoot.position, palette.hexRibbon);
            setTimeout(() => openGiftWish(wish, palette), 240);
          }
        }
      });

      // Hỗ trợ lăn chuột phóng to / thu nhỏ khoảng cách trong góc nhìn 360 độ
      renderer.domElement.addEventListener('wheel', (e) => {
        if (!isCurtainOpened) return;
        e.preventDefault();
        hasDraggedManual360 = true;
        orbitRadius = clamp(orbitRadius + e.deltaY * 0.035, 26, 92);
      }, { passive: false });

      /* ==================== KỊCH BẢN ĐẠO DIỄN 3D ==================== */
      let timelineStart = 0;
      let timelineRunning = false;
      let orbitSantaActive = false;

      const targetCamPos = new THREE.Vector3(0, 11, 56);
      const targetCamLook = new THREE.Vector3(0, 12, 0);

      function clearTimers() {
        timers.forEach((id) => clearTimeout(id));
        timers = [];
      }
      function schedule(fn, delay) {
        timers.push(setTimeout(fn, delay));
      }

      function updateDirectorTimeline(now, dt) {
        if (!timelineRunning) {
          camera.position.set(0, 11, 56);
          camera.lookAt(0, 12, 0);
          return;
        }

        const elapsed = (now - timelineStart) / 1000;

        // 1. HIỆU ỨNG CÁNH CỔNG KHÔNG GIAN 3D MỞ RA & ĐÓNG LẠI (0.15s - 3.85s)
        if (elapsed >= 0.15 && elapsed <= 3.85) {
          portal3DGroup.visible = true;
          let portalScale = 1.0;
          if (elapsed < 0.85) {
            const openP = clamp((elapsed - 0.15) / 0.70, 0, 1);
            portalScale = Math.max(0.01, easeOutBack(openP));
          } else if (elapsed > 3.10) {
            const closeP = clamp((elapsed - 3.10) / 0.75, 0, 1);
            portalScale = Math.max(0.01, 1 - easeInOutCubic(closeP));
          } else {
            portalScale = 1.0 + Math.sin(elapsed * 5.5) * 0.04;
          }
          portal3DGroup.scale.setScalar(portalScale);
        } else {
          portal3DGroup.visible = false;
        }

        // 2. ÔNG GIÀ NOEL BAY TỪ TÂM CÁNH CỔNG KHÔNG GIAN RA NGOÀI (0.48s - 3.70s)
        if (elapsed >= 0.48 && elapsed <= 3.70) {
          introSanta3D.visible = true;
          const p = clamp((elapsed - 0.48) / 3.22, 0, 1);
          const easeP = easeOutCubic(p);

          const sz = -42 + 94 * easeP;
          const sx = 0;

          const climbPhase = clamp((p - 0.58) / 0.42, 0, 1);
          const climbLift = Math.pow(climbPhase, 1.85) * 58;
          const sy = 12.2 + p * 2.5 + climbLift;

          const emergeFactor = smoothstep(0.0, 0.16, p);
          const growScale = (0.22 + Math.pow(p, 1.3) * 2.03) * Math.max(0.15, emergeFactor);
          introSanta3D.scale.setScalar(growScale);
          introSanta3D.position.set(sx, sy, sz);
          introSanta3D.rotation.set(
            -0.05 - climbPhase * 0.52,
            0,
            Math.sin(p * Math.PI * 4) * 0.035
          );

          emitSleighTrail(introSanta3D.position);

          const panUpProgress = clamp((elapsed - 1.90) / 1.75, 0, 1);
          const easeUp = easeInOutCubic(panUpProgress);

          targetCamPos.set(0, 12.5 + easeUp * 3.5, 56 - easeUp * 6);
          targetCamLook.set(0, 13.5 + easeUp * 96, -15 - easeUp * 20);
        } else {
          introSanta3D.visible = false;
        }

        // 3. BÔNG TUYẾT KHỔNG LỒ RƠI CHUYỂN CẢNH & HẠ CAMERA XUỐNG CÂY THÔNG (3.50s - 6.50s)
        if (elapsed >= 3.50 && elapsed <= 6.50) {
          giantSnowflakesGroup.visible = true;
          const sp = clamp((elapsed - 3.50) / 3.00, 0, 1);

          if (elapsed >= 4.05 && !worldTreeGroup.visible) {
            worldTreeGroup.visible = true;
          }

          if (elapsed > 3.70) {
            const panDownProgress = clamp((elapsed - 3.70) / 2.45, 0, 1);
            const easeDown = easeInOutCubic(panDownProgress);

            targetCamPos.set(0, 16 - easeDown * 5, 50 + easeDown * 6);
            targetCamLook.set(0, 109.5 - easeDown * 98, -35 + easeDown * 35);
          }

          const forward = new THREE.Vector3();
          camera.getWorldDirection(forward);

          giantSnowflakes.forEach((gs, idx) => {
            const localFall = gs.offsetY - sp * gs.fallSpeed;
            const dist = 10.5 + (idx % 5) * 2.2;
            gs.mesh.position.copy(camera.position)
              .addScaledVector(forward, dist)
              .add(new THREE.Vector3(gs.offsetX * 0.45, localFall - 12, 0));
            gs.mesh.rotation.x += 0.018 * gs.rotSpeedX;
            gs.mesh.rotation.y += 0.018 * gs.rotSpeedY;
            gs.mesh.rotation.z += 0.032 * gs.rotSpeedZ;
          });
        } else {
          giantSnowflakesGroup.visible = false;
        }

        // 4. SAU KHI BÔNG TUYẾT KHỔNG LỒ ĐÃ RƠI HẾT (Sau 6.50s): Điều khiển Góc máy & Chế độ Xoay 360 độ
        if (elapsed > 6.50) {
          worldTreeGroup.visible = true;
          const blendWeight = smoothstep(6.50, 8.0, elapsed);
          const preset = CAMERA_MODES[cameraMode];

          // Nếu đang ở chế độ Xoay 360° tự động hoặc người dùng dùng chuột kéo 360°
          if (preset.id === 'orbit360' || hasDraggedManual360) {
            if (preset.id === 'orbit360' && !isDraggingOrbit) {
              orbitAzimuth += dt * 0.38; // Xoay tròn 360 độ mượt mà quanh cây thông
            }
            const centerLook = new THREE.Vector3(0, 11.5, 0);
            const cx = centerLook.x + orbitRadius * Math.sin(orbitPolar) * Math.sin(orbitAzimuth);
            const cy = Math.max(2.2, centerLook.y + orbitRadius * Math.cos(orbitPolar) - 8);
            const cz = centerLook.z + orbitRadius * Math.sin(orbitPolar) * Math.cos(orbitAzimuth);

            targetCamPos.set(cx, cy, cz);
            targetCamLook.copy(centerLook);
          } else {
            const gentleSwayX = Math.sin((elapsed - 6.50) * 0.45) * 2.0;
            const gentleSwayY = Math.cos((elapsed - 6.50) * 0.35) * 0.7;

            targetCamPos.set(
              preset.pos.x + (gentleSwayX + userLookOffset.x) * blendWeight,
              preset.pos.y + (gentleSwayY + userLookOffset.y * 0.5) * blendWeight,
              preset.pos.z
            );
            targetCamLook.set(
              preset.look.x + userLookOffset.x * 0.4 * blendWeight,
              preset.look.y + userLookOffset.y * 0.4 * blendWeight,
              preset.look.z
            );
          }
        }

        const lerpFactor = elapsed <= 6.50 ? 1 : Math.min(1, dt * (isDraggingOrbit ? 12 : 4.5));
        camPos.lerp(targetCamPos, lerpFactor);
        camLook.lerp(targetCamLook, lerpFactor);
        camera.position.copy(camPos);
        camera.lookAt(camLook);
      }

      /* ==================== VÒNG LẶP RENDER 3D CHÍNH ==================== */
      let lastFrameTime = performance.now();

      function animate3D(now) {
        const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
        const timeSec = now / 1000;
        lastFrameTime = now;

        // 1. Cập nhật đạo diễn Camera & Góc nhìn 360 độ
        updateDirectorTimeline(now, dt);

        // 2. Cập nhật chuyển động xoáy của Cánh cổng không gian 3D
        if (portal3DGroup.visible && portal3DGroup.userData) {
          const pd = portal3DGroup.userData;
          pd.vortexDisc.rotation.z -= dt * 2.4;
          pd.innerVortexDisc.rotation.z += dt * 3.2;
          pd.outerRing.rotation.z += dt * 0.9;
          pd.cyanRing.rotation.z -= dt * 1.6;
          pd.portalLight.intensity = 2.8 + Math.sin(timeSec * 12) * 0.8;

          const sAttr = pd.sparkPoints.geometry.attributes.position;
          for (let i = 0; i < pd.sparkAngles.length; i++) {
            const sa = pd.sparkAngles[i];
            sa.angle += sa.speed * dt;
            const r = sa.radius + Math.sin(timeSec * 4 + i) * 0.45;
            sAttr.setXYZ(i, Math.cos(sa.angle) * r, Math.sin(sa.angle) * r, Math.sin(timeSec * 3 + i) * 1.2);
          }
          sAttr.needsUpdate = true;
        }

        // 3. Cập nhật Mặt trăng 3D xoay nhẹ & hào quang dịu không bị cực quang lấn át
        moonSphere.rotation.y = timeSec * 0.04;
        const moonPulse = 1 + Math.sin(timeSec * 1.8) * 0.035;
        moonCoronaSprite.scale.set(38 * moonPulse, 38 * moonPulse, 1);

        // 4. Cập nhật Vòm Cực quang 360 độ & các dải Cực quang uốn lượn dịu mắt
        auroraSkyDome.rotation.y = timeSec * 0.02;
        auroraSkyDome.material.opacity = 0.30 + Math.sin(timeSec * 1.1) * 0.06;

        auroraLayers.forEach((layer) => {
          const pos = layer.geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = layer.baseX[i];
            const y = layer.baseY[i];
            const waveZ =
              Math.sin(x * 0.026 + timeSec * layer.speed + layer.phase) * layer.amp +
              Math.cos(x * 0.014 - timeSec * (layer.speed * 0.7)) * (layer.amp * 0.55);
            const waveY = Math.sin(x * 0.02 + timeSec * 0.85 + layer.phase) * 2.2;
            pos.setY(i, y + waveY);
            pos.setZ(i, layer.baseZ[i] + waveZ);
          }
          pos.needsUpdate = true;
          layer.mat.opacity = layer.baseOpacity + Math.sin(timeSec * 1.3 + layer.phase) * 0.08;
        });
        auroraSkyLight.intensity = 0.68 + Math.sin(timeSec * 1.6) * 0.18;

        // 5. Cập nhật 800 chấm sao nhỏ phát sáng nhấp nháy trên bầu trời
        starLayerA.mat.opacity = 0.84 + Math.sin(timeSec * 2.8) * 0.16;
        starLayerB.mat.opacity = 0.82 + Math.cos(timeSec * 2.2 + 1.2) * 0.18;

        // 6. Nhấp nháy đèn cây thông, xoay ngôi sao & Người tuyết vẫy tay
        if (giantTree3D.userData.topStarMesh) {
          giantTree3D.userData.topStarMesh.rotation.y = Math.sin(timeSec * 1.8) * 0.35;
          const pulse = 1 + Math.sin(timeSec * 3.5) * 0.14;
          giantTree3D.userData.starGlowHalo.scale.setScalar(pulse);
        }
        if (giantTree3D.userData.lightBulbs) {
          giantTree3D.userData.lightBulbs.forEach((b) => {
            b.mesh.material.emissiveIntensity = 0.6 + 0.55 * Math.sin(timeSec * 4.2 + b.phase);
          });
        }
        if (snowman3D.userData.wavingArm) {
          snowman3D.userData.wavingArm.rotation.z = Math.sin(timeSec * 4.2) * 0.25;
        }

        // 7. Cử động tuần lộc của Ông già Noel bay ra từ cổng không gian
        if (introSanta3D.visible) {
          animateRigReindeers(introSanta3D, timeSec);
        }

        // 8. Ông già Noel bay theo quỹ đạo elip 3D xung quanh cây thông ở đoạn cuối
        if (orbitSantaActive) {
          orbitSanta3D.visible = true;
          const orbitSpeed = 0.52;
          const angle = timeSec * orbitSpeed;
          const rx = 29;
          const rz = 21;
          const ox = Math.cos(angle) * rx;
          const oz = Math.sin(angle) * rz - 2;
          const oy = 14.5 + Math.sin(angle * 2) * 2.5;

          orbitSanta3D.position.set(ox, oy, oz);
          const tx = -Math.sin(angle) * rx;
          const tz = Math.cos(angle) * rz;
          orbitSanta3D.rotation.y = Math.atan2(tx, tz);
          orbitSanta3D.rotation.z = Math.sin(angle) * 0.12;
          animateRigReindeers(orbitSanta3D, timeSec);
          emitSleighTrail(orbitSanta3D.position);
        } else {
          orbitSanta3D.visible = false;
        }

        // 9. Cập nhật hạt bụi tiên vàng (Magic Stardust Trail)
        const trailAttr = trailPoints.geometry.attributes.position;
        for (let i = 0; i < trailCount; i++) {
          if (trailData[i].life > 0) {
            trailData[i].life -= dt * 0.9;
            const x = trailAttr.getX(i) + trailData[i].vx * dt;
            const y = trailAttr.getY(i) + trailData[i].vy * dt;
            const z = trailAttr.getZ(i) + trailData[i].vz * dt;
            trailAttr.setXYZ(i, x, y, z);
            if (trailData[i].life <= 0) {
              trailAttr.setXYZ(i, 0, -999, 0);
            }
          }
        }
        trailAttr.needsUpdate = true;

        // 10. Cập nhật pháo hoa hạt sáng khi mở hộp quà
        if (burstLife > 0) {
          burstLife = Math.max(0, burstLife - dt * 1.4);
          burstMat.opacity = burstLife;
          const bAttr = burstParticles.geometry.attributes.position;
          for (let i = 0; i < burstCount; i++) {
            const x = bAttr.getX(i) + burstVel[i].vx * dt;
            const y = bAttr.getY(i) + burstVel[i].vy * dt;
            const z = bAttr.getZ(i) + burstVel[i].vz * dt;
            burstVel[i].vy -= 18 * dt;
            bAttr.setXYZ(i, x, y, z);
          }
          bAttr.needsUpdate = true;
        }

        // 11. Đàn tuần lộc 3D bay qua lại trên bầu trời
        skyReindeers3D.forEach((deer) => {
          deer.position.x += deer.userData.dir * deer.userData.speed * dt;
          deer.position.y = deer.userData.baseY + Math.sin(timeSec * 2.5 + deer.userData.phase) * 1.8;
          if (deer.userData.dir > 0 && deer.position.x > 115) deer.position.x = -115;
          if (deer.userData.dir < 0 && deer.position.x < -115) deer.position.x = 115;

          deer.userData.legs.forEach((leg) => {
            const s = Math.sin(timeSec * 12 + leg.phase + deer.userData.phase);
            leg.pivot.rotation.x = s * 0.65;
            if (leg.knee) {
              leg.knee.rotation.x = leg.isFront ? Math.max(0, s) * 0.6 : -Math.max(0, -s) * 0.5;
            }
          });
        });

        // 12. Mưa hạt tuyết tròn & Bông tuyết tinh thể 6 cánh nhỏ
        const posAttr = snowParticles.geometry.attributes.position;
        for (let i = 0; i < snowParticleCount; i++) {
          let x = posAttr.getX(i);
          let y = posAttr.getY(i);
          let z = posAttr.getZ(i);
          const v = snowVel[i];

          y -= v.vy * dt;
          x += (v.vx + Math.sin(timeSec + v.phase) * 0.8) * dt;
          z += v.vz * dt;

          if (y < -12) {
            y = 88;
            x = rand(-95, 95);
            z = rand(-95, 95);
          }
          posAttr.setXYZ(i, x, y, z);
        }
        posAttr.needsUpdate = true;

        for (let i = 0; i < smallCrystalCount; i++) {
          const cf = smallCrystalFlakes[i];
          cf.mesh.position.y -= cf.vy * dt;
          cf.mesh.position.x += (cf.vx + Math.sin(timeSec * cf.swaySpeed + cf.phase) * cf.swayAmp) * dt;
          cf.mesh.rotation.x += cf.rotX * dt;
          cf.mesh.rotation.y += cf.rotY * dt;
          cf.mesh.rotation.z += cf.rotZ * dt;

          if (cf.mesh.position.y < -14) {
            cf.mesh.position.y = rand(82, 96);
            cf.mesh.position.x = rand(-85, 85);
            cf.mesh.position.z = rand(-85, 85);
          }
        }

        // 13. 15 Hộp quà 3D khổng lồ rơi & Hiệu ứng bật nắp
        if (giftsFallingActive && gifts3DGroup.visible) {
          fallingGifts3D.forEach((g) => {
            g.y -= g.fallSpeed * dt;
            if (g.y < -22) {
              g.y = rand(38, 56);
            }
            const swayX = Math.sin(timeSec * g.swaySpeed + g.phase) * g.swayAmp;
            g.group.position.set(g.baseX + swayX, g.y, g.z);
            g.group.rotation.x += g.rotSpeedX * dt;
            g.group.rotation.y += g.rotSpeedY * dt;
            g.group.rotation.z = Math.sin(timeSec * g.swaySpeed + g.phase) * 0.25;

            if (g.group.userData.popAnim > 0) {
              g.group.userData.popAnim = Math.max(0, g.group.userData.popAnim - dt * 1.8);
              const p = Math.sin(g.group.userData.popAnim * Math.PI);
              if (g.group.userData.lidAnchor) {
                g.group.userData.lidAnchor.position.y = 1.42 + p * 2.2;
                g.group.userData.lidAnchor.rotation.z = p * 0.55;
              }
            }
          });
        }

        renderer.render(scene3D, camera);
        requestAnimationFrame(animate3D);
      }

      /* ==================== SỰ KIỆN MỞ RÈM & KHỞI CHẠY KỊCH BẢN 3D ==================== */
      function openCurtain() {
        if (isCurtainOpened) return;
        isCurtainOpened = true;

        if (curtainHint) curtainHint.style.display = 'none';

        worldTreeGroup.visible = false;

        startJingleBellsMusic();
        curtainStage.classList.add('open');

        timelineStart = performance.now();
        timelineRunning = true;

        schedule(() => playSantaHoHoHoSound(), 520);

        schedule(() => {
          snowWhiteout.classList.add('active');
          worldTreeGroup.visible = true;
        }, 4100);
        schedule(() => snowWhiteout.classList.remove('active'), 4850);

        // Chờ bông tuyết khổng lồ rơi hết hoàn toàn (6.50s) mới hiện chữ "Merry Christmas" (6.80s)
        schedule(() => {
          giantSnowflakesGroup.visible = false;
          sceneEl.classList.add('show-title');
        }, 6800);

        // Tiếp theo hiện chữ "Giáng sinh an lành" bên dưới (7.55s)
        schedule(() => {
          sceneEl.classList.add('show-subtitle');
        }, 7550);

        // 15 hộp quà khổng lồ rơi & Ông già Noel bay vòng quanh cây thông (8.20s)
        schedule(() => {
          gifts3DGroup.visible = true;
          giftsFallingActive = true;
          orbitSantaActive = true;
        }, 8200);

        // Thu nhỏ tiêu đề bay lên góc trên cùng (9.80s)
        schedule(() => {
          sceneEl.classList.add('dock-greeting');
        }, 9800);

        if (customCardData.to || customCardData.msg) {
          schedule(() => {
            openGiftWish(
              {
                title: customCardData.to ? `Gửi ${customCardData.to} Yêu Quý!` : 'Giáng Sinh An Lành!',
                text: customCardData.msg || 'Chúc bạn một mùa Giáng sinh ngập tràn niềm vui, hạnh phúc và phép màu ấm áp!',
                sender: customCardData.from
              },
              GIFT_PALETTES[0],
              true
            );
          }, 10300);
        }
      }

      function resetAndStandbyCurtain() {
        clearTimers();
        isCurtainOpened = false;
        timelineRunning = false;
        giftsFallingActive = false;
        orbitSantaActive = false;
        cameraMode = 0;
        hasDraggedManual360 = false;
        orbitAzimuth = 0;
        orbitPolar = 1.38;
        orbitRadius = 56;
        cameraViewBtn.textContent = CAMERA_MODES[0].label;
        cameraViewBtn.classList.remove('active-360');

        portal3DGroup.visible = false;
        introSanta3D.visible = false;
        orbitSanta3D.visible = false;
        giantSnowflakesGroup.visible = false;
        gifts3DGroup.visible = false;
        worldTreeGroup.visible = true;
        snowWhiteout.classList.remove('active');

        closeGiftWish();
        creatorModalBackdrop.classList.remove('active');
        stopAllMusic();

        curtainStage.classList.remove('open');
        if (curtainHint) curtainHint.style.display = '';

        sceneEl.classList.remove('show-title', 'show-subtitle', 'dock-greeting');
        buildFallingGifts3D();
      }

      curtainStage.addEventListener('click', openCurtain);
      curtainStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCurtain();
        }
      });
      replayBtn.addEventListener('click', resetAndStandbyCurtain);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, { passive: true });

      buildFallingGifts3D();
      requestAnimationFrame(animate3D);
    })();
  </script>
