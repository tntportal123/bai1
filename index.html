<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Merry Christmas 3D · Giáng sinh an lành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --night: #050f20;
      --gold: #ffd887;
      --cream: #fff7e8;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: var(--font-sans);
      background: var(--night); color: var(--cream);
      -webkit-font-smoothing: antialiased; user-select: none;
    }
    .scene {
      position: relative; width: 100%; height: 100%;
      overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(20, 95, 110, .24), transparent 70%),
        radial-gradient(ellipse at 20% 15%, rgba(65, 50, 135, .20), transparent 60%),
        linear-gradient(180deg, #02060f 0%, #051428 46%, #0a2238 78%, #071826 100%);
    }
    #webgl-container, #webgl-container canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 2; display: block; touch-action: none;
    }
    .snow-whiteout {
      position: absolute; z-index: 8; inset: 0; pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(240, 250, 255, .94) 0%, rgba(215, 240, 255, .8) 55%, rgba(190, 228, 250, .58) 100%);
      opacity: 0; transition: opacity .6s cubic-bezier(.4, 0, .2, 1);
    }
    .snow-whiteout.active { opacity: 1; }

    /* ==================== 1. TẤM RÈM NHUNG ĐỎ MỞ ĐẦU ==================== */
    .curtain-stage {
      position: absolute; z-index: 30; inset: 0;
      display: flex; cursor: pointer; perspective: 1200px;
      transition: visibility 0s linear 2.3s;
    }
    .curtain-stage.open { pointer-events: none; visibility: hidden; }
    .curtain-valance {
      position: absolute; z-index: 4; top: 0; left: 0; width: 100%;
      height: clamp(56px, 9.5vh, 92px);
      background: repeating-linear-gradient(90deg, #5c0811 0px, #8f1120 26px, #b81d2f 52px, #8f1120 78px, #5c0811 104px);
      border-bottom: 5px solid #f4c96b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .68), inset 0 -6px 14px rgba(255, 215, 130, .28);
      transition: transform 1.65s cubic-bezier(.65, 0, .25, 1) .18s;
    }
    .curtain-stage.open .curtain-valance { transform: translateY(-135%); }
    .valance-lights { position: absolute; inset: 0; width: 100%; height: 145%; overflow: visible; }
    .curtain-panel {
      position: relative; width: 50.5%; height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 110, 110, .16), transparent 65%),
        repeating-linear-gradient(90deg, #46040c 0%, #7d0c19 4.5%, #ba1c2e 9%, #830e1c 13.5%, #46040c 18%);
      box-shadow: inset 0 0 85px rgba(20, 0, 4, .78), 0 0 50px rgba(0, 0, 0, .7);
      transition: transform 2.15s cubic-bezier(.55, .06, .18, 1), filter 2.15s ease;
      overflow: hidden; will-change: transform;
    }
    .curtain-panel.left { transform-origin: left top; border-right: 4px solid #f2c76e; }
    .curtain-panel.right { transform-origin: right top; border-left: 4px solid #f2c76e; }
    .curtain-stage.open .curtain-panel.left { transform: translateX(-92%) scaleX(.72) rotate(4.5deg) skewY(-2deg); filter: brightness(.75); }
    .curtain-stage.open .curtain-panel.right { transform: translateX(92%) scaleX(.72) rotate(-4.5deg) skewY(2deg); filter: brightness(.75); }
    .curtain-ornaments { position: absolute; inset: 0; width: 100%; height: 100%; }
    .bulb-glow-1 { animation: bulb-blink 1.1s ease-in-out infinite alternate; }
    .bulb-glow-2 { animation: bulb-blink 1.1s ease-in-out .38s infinite alternate; }
    .bulb-glow-3 { animation: bulb-blink 1.1s ease-in-out .75s infinite alternate; }
    .dangling-item { transform-box: fill-box; transform-origin: top center; animation: sway 3.2s ease-in-out infinite alternate; }
    .dangling-item.delay-1 { animation-delay: -.8s; }
    .dangling-item.delay-2 { animation-delay: -1.6s; }
    .dangling-item.delay-3 { animation-delay: -2.3s; }
    .curtain-hint {
      position: absolute; z-index: 6; left: 50%; bottom: 9%; transform: translateX(-50%);
      padding: 14px 32px; border-radius: 999px;
      background: rgba(58, 6, 14, .92); border: 2px solid rgba(255, 220, 142, .92);
      color: #fff6dc; font-weight: 700; font-size: clamp(.92rem, 1.8vw, 1.14rem);
      letter-spacing: .04em; white-space: nowrap;
      box-shadow: 0 0 30px rgba(255, 202, 104, .5), inset 0 0 12px rgba(255, 220, 142, .25);
      animation: hint-pulse 1.5s ease-in-out infinite alternate;
    }
    .curtain-stage.open .curtain-hint { display: none !important; }

    /* ==================== 2. TIÊU ĐỀ & ĐIỀU KHIỂN ==================== */
    .greeting {
      position: absolute; z-index: 10; left: 50%; top: 47%; width: min(94vw, 1080px);
      text-align: center; transform: translate(-50%, -50%) scale(1); pointer-events: none;
      transition: top 1.35s cubic-bezier(.22, .88, .26, 1), transform 1.35s cubic-bezier(.22, .88, .26, 1), opacity .5s ease;
    }
    .scene.dock-greeting .greeting { top: clamp(42px, 7.2vh, 68px); transform: translate(-50%, -50%) scale(.42); }
    .greeting h1 {
      margin: 0; color: #fff6df; font-family: var(--font-serif);
      font-size: clamp(2.6rem, 7.6vw, 6.4rem); font-weight: 700; line-height: 1.04;
      letter-spacing: .03em; word-spacing: .22em;
      text-shadow: 0 3px 0 #b88235, 0 7px 18px rgba(12, 5, 2, .75), 0 0 32px rgba(255, 209, 126, .88), 0 0 85px rgba(255, 180, 91, .52);
      opacity: 0; transform: scale(.04) rotate(-6deg);
    }
    .scene.show-title .greeting h1 { animation: title-pop-in 1.2s cubic-bezier(.18, .9, .25, 1.2) forwards; }
    .greeting p {
      margin: clamp(14px, 2.4vh, 24px) 0 0; color: #fff3d6;
      font-size: clamp(1.08rem, 2.5vw, 1.72rem); font-weight: 700;
      letter-spacing: .16em; text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(4, 14, 28, .95), 0 0 22px rgba(255, 210, 128, .85);
      opacity: 0; transform: translateY(24px) scale(.85);
    }
    .scene.show-subtitle .greeting p { animation: subtitle-rise-in .95s cubic-bezier(.2, .88, .28, 1.15) forwards; }

    .bottom-controls {
      position: absolute; z-index: 20; bottom: 2.2%; right: 2%; left: 2%;
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity .6s ease;
    }
    .scene.show-subtitle .bottom-controls { opacity: 1; pointer-events: auto; }
    .controls-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .control-btn {
      padding: 9px 16px; border-radius: 999px;
      background: rgba(11, 34, 54, .86); border: 1px solid rgba(255, 222, 148, .62);
      color: #ffefc9; font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
      letter-spacing: .03em; cursor: pointer; backdrop-filter: blur(6px);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .control-btn:hover { background: rgba(22, 58, 88, .96); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255, 210, 120, .28); }
    .control-btn.highlight { background: linear-gradient(135deg, rgba(168, 24, 42, .92), rgba(110, 14, 26, .95)); border-color: #ffd885; color: #fff8e6; }
    .control-btn.active-360 { background: linear-gradient(135deg, rgba(16, 94, 72, .94), rgba(10, 58, 46, .96)); border-color: #6df7c1; color: #eafff6; }

    /* ==================== 3. MODAL LỜI CHÚC & TẠO THIỆP ==================== */
    .wish-modal-backdrop {
      position: fixed; z-index: 50; inset: 0;
      background: rgba(4, 12, 24, .76); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s ease;
    }
    .wish-modal-backdrop.active { opacity: 1; visibility: visible; }
    .wish-modal {
      position: relative; width: min(92vw, 470px); padding: 32px 28px 26px; border-radius: 24px;
      background: radial-gradient(circle at 50% 0%, rgba(255, 218, 133, .26), transparent 65%), linear-gradient(160deg, #6d0f1c 0%, #430811 55%, #2a060d 100%);
      border: 2px solid #f5ca72; box-shadow: 0 22px 64px rgba(0, 0, 0, .82), 0 0 42px rgba(255, 206, 112, .38);
      text-align: center; color: #fff8e8; transform: scale(.65) translateY(30px);
      transition: transform .4s cubic-bezier(.2, .9, .25, 1.25);
    }
    .wish-modal-backdrop.active .wish-modal { transform: scale(1) translateY(0); }
    .wish-modal-icon { width: 84px; height: 84px; margin: -64px auto 12px; filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); animation: modal-gift-pop .7s cubic-bezier(.2, .9, .3, 1.4); }
    .wish-modal-badge {
      display: inline-block; padding: 5px 16px; border-radius: 999px;
      background: rgba(255, 216, 135, .18); border: 1px solid rgba(255, 216, 135, .55);
      color: #ffd984; font-size: .82rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 12px;
    }
    .wish-modal h3 { margin: 0 0 12px; font-family: var(--font-serif); font-size: clamp(1.4rem, 3.2vw, 1.82rem); color: #ffe8a8; text-shadow: 0 2px 10px rgba(255, 198, 92, .4); }
    .wish-modal p { margin: 0 0 18px; font-size: clamp(1rem, 2.2vw, 1.14rem); line-height: 1.68; color: #fff6e5; word-break: break-word; }
    .wish-sender-line { margin: -6px 0 20px; font-size: .92rem; color: #ffd887; font-style: italic; }
    .wish-close-btn {
      padding: 11px 30px; border-radius: 999px;
      background: linear-gradient(180deg, #ffd97d 0%, #e09f36 100%);
      border: none; color: #3d1205; font-family: var(--font-sans); font-weight: 700; font-size: .96rem;
      cursor: pointer; box-shadow: 0 6px 18px rgba(255, 197, 84, .45); transition: transform .2s ease, box-shadow .2s ease;
    }
    .wish-close-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 24px rgba(255, 210, 108, .65); }

    .creator-form { display: flex; flex-direction: column; gap: 12px; text-align: left; margin-top: 8px; }
    .creator-form label { font-size: .84rem; font-weight: 600; color: #ffe5a3; display: block; margin-bottom: 4px; }
    .creator-form input, .creator-form textarea {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255, 216, 135, .45); background: rgba(20, 4, 8, .65);
      color: #fff8ea; font-family: var(--font-sans); font-size: .94rem; outline: none;
    }
    .creator-form input:focus, .creator-form textarea:focus { border-color: #ffd97d; box-shadow: 0 0 12px rgba(255, 217, 125, .35); }
    .creator-actions { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
    .secondary-btn {
      padding: 11px 20px; border-radius: 999px; background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 220, 148, .45); color: #ffefc9; font-family: var(--font-sans); font-weight: 600; font-size: .92rem; cursor: pointer;
    }
    .copy-status { font-size: .84rem; color: #7ae582; margin-top: 8px; min-height: 1.2em; text-align: center; font-weight: 600; }

    @keyframes bulb-blink { from { opacity: .45; filter: drop-shadow(0 0 2px currentColor); } to { opacity: 1; filter: drop-shadow(0 0 11px currentColor); } }
    @keyframes sway { from { transform: rotate(-4.5deg); } to { transform: rotate(4.5deg); } }
    @keyframes hint-pulse { from { transform: translateX(-50%) scale(.96); box-shadow: 0 0 18px rgba(255, 202, 104, .3); } to { transform: translateX(-50%) scale(1.04); box-shadow: 0 0 32px rgba(255, 214, 128, .65); } }
    @keyframes title-pop-in {
      0% { opacity: 0; transform: scale(.04) rotate(-8deg); filter: blur(14px); }
      58% { opacity: 1; transform: scale(1.14) rotate(2deg); filter: blur(0); }
      78% { opacity: 1; transform: scale(.96) rotate(-1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes subtitle-rise-in {
      0% { opacity: 0; transform: translateY(26px) scale(.84); filter: blur(8px); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes modal-gift-pop { 0% { transform: scale(0) rotate(-18deg); } 70% { transform: scale(1.15) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }

    @media (max-width: 680px) {
      .greeting { top: 45%; }
      .scene.dock-greeting .greeting { top: 52px; transform: translate(-50%, -50%) scale(.46); }
      .greeting h1 { font-size: clamp(2.1rem, 9.8vw, 3.8rem); }
      .greeting p { font-size: clamp(.9rem, 3.6vw, 1.18rem); letter-spacing: .12em; }
      .bottom-controls { justify-content: center; }
    }
.frozen-lake-stage {
      position: absolute;
      z-index: 7;
      left: 5%;       /* Chuyển từ right: 4% sang left: 5% để nằm ngay gần ngôi nhà bên trái */
      bottom: 7%;
      width: clamp(180px, 23vw, 320px);
      aspect-ratio: 2.2 / 1;
      pointer-events: none;
      opacity: 0;
      transform: translateY(18px) scale(0.9);
      transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2, .88, .28, 1.15);
      filter: drop-shadow(0 8px 24px rgba(10, 40, 75, .7));
    }
    .scene.show-title .frozen-lake-stage {
      opacity: 1; transform: translateY(0) scale(1);
    }
    .lake-shimmer { animation: ice-shimmer 2.8s ease-in-out infinite alternate; }
    .moon-reflection-beam { transform-origin: center; transform-box: fill-box; animation: moon-ripple 2.2s ease-in-out infinite alternate; }
    @keyframes ice-shimmer { from { opacity: .55; } to { opacity: .95; } }
    @keyframes moon-ripple { from { transform: scaleX(.92) translateX(-4px); opacity: .65; } to { transform: scaleX(1.08) translateX(4px); opacity: .98; } }
    .frozen-lake-stage { display: none; }
    @media (max-width: 680px) {
      .frozen-lake-stage { display: block; left: 5%; bottom: 10%; width: 155px; }
    }
  </style>
</head>

  <main class="scene" id="scene" aria-label="Hoạt cảnh Giáng sinh 3D nhiệm màu">
    <!-- ==================== 1. TẤM RÈM MỞ ĐẦU ==================== -->
    <div class="curtain-stage" id="curtainStage" role="button" tabindex="0" aria-label="Nhấn để mở rèm Giáng sinh 3D">
      <div class="curtain-valance" aria-hidden="true">
        <svg class="valance-lights" viewBox="0 0 1200 130" preserveAspectRatio="none">
          <path d="M0 18 Q150 92 300 18 Q450 92 600 18 Q750 92 900 18 Q1050 92 1200 18" fill="none" stroke="#28422b" stroke-width="4"/>
          <path d="M0 32 Q150 110 300 32 Q450 110 600 32 Q750 110 900 32 Q1050 110 1200 32" fill="none" stroke="#f6cf77" stroke-width="2" stroke-dasharray="6 6" opacity=".7"/>
          <g>
            <circle class="bulb-glow-1" cx="75" cy="48" r="9" fill="#ffeb7a" style="color:#ffeb7a"/>
            <circle class="bulb-glow-2" cx="150" cy="64" r="9" fill="#ff5964" style="color:#ff5964"/>
            <circle class="bulb-glow-3" cx="225" cy="48" r="9" fill="#4cd97b" style="color:#4cd97b"/>
            <circle class="bulb-glow-1" cx="300" cy="22" r="9" fill="#63d2ff" style="color:#63d2ff"/>
            <circle class="bulb-glow-2" cx="375" cy="48" r="9" fill="#ffeb7a" style="color:#ffeb7a"/>
            <circle class="bulb-glow-3" cx="450" cy="64" r="9" fill="#ff5964" style="color:#ff5964"/>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const sceneEl = $('scene');
      const webglContainer = $('webgl-container');
      const snowWhiteout = $('snowWhiteout');
      const curtainStage = $('curtainStage');
      const curtainHint = $('curtainHint');
      const replayBtn = $('replayBtn');
      const soundToggleBtn = $('soundToggleBtn');
      const cameraViewBtn = $('cameraViewBtn');
      const createCardBtn = $('createCardBtn');
      const greetingSubtitle = $('greetingSubtitle');

      const wishModalBackdrop = $('wishModalBackdrop');
      const wishModalBadge = $('wishModalBadge');
      const wishModalTitle = $('wishModalTitle');
      const wishModalText = $('wishModalText');
      const wishSenderLine = $('wishSenderLine');
      const wishModalIcon = $('wishModalIcon');
      const wishCloseBtn = $('wishCloseBtn');

      const creatorModalBackdrop = $('creatorModalBackdrop');
      const inputReceiver = $('inputReceiver');
      const inputSender = $('inputSender');
      const inputCustomWish = $('inputCustomWish');
      const copyStatusText = $('copyStatusText');
      const creatorCloseBtn = $('creatorCloseBtn');
      const copyShareLinkBtn = $('copyShareLinkBtn');

      const jingleBellsAudio = $('jingleBellsAudio');
      const hoHoHoAudio = $('hoHoHoAudio');

      let isCurtainOpened = false;
      let isMuted = false;
      let timers = [];

      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeOutBack = (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2);
      const smoothstep = (min, max, val) => {
        const x = clamp((val - min) / (max - min), 0, 1);
        return x * x * (3 - 2 * x);
      };

      /* ==================== 1. BẢO MẬT XSS & DỮ LIỆU THIỆP ==================== */
      const sanitizeText = (str, maxLen = 240) =>
        typeof str === 'string' ? str.replace(/[\u0000-\u001F\u007F<>]/g, '').trim().slice(0, maxLen) : '';

      const urlParams = new URLSearchParams(window.location.search);
      const customCardData = {
        to: sanitizeText(urlParams.get('to') || '', 45),
        from: sanitizeText(urlParams.get('from') || '', 45),
        msg: sanitizeText(urlParams.get('msg') || '', 240)
      };
      if (customCardData.to) {
        greetingSubtitle.textContent = `Dành tặng ${customCardData.to} · Giáng sinh an lành`;
      }

      /* ==================== 2. HỆ THỐNG ÂM THANH ==================== */
      let audioCtx = null;
      let jingleLoopTimer = null;
      let sleighBellTimer = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtx = new AudioCtx();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }

      function playSleighBellShake(duration = 0.14, volume = 0.08) {
        if (isMuted) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const bufferSize = Math.floor(ctx.sampleRate * duration);
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.32));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4800, now);
        filter.Q.setValueAtTime(3.5, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);

        [2637, 3520].forEach((freq) => {
          const osc = ctx.createOscillator();
          const bellGain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          bellGain.gain.setValueAtTime(volume * 0.35, now);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(bellGain);
          bellGain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function playChimeNote(freq, startTime, duration, vol = 0.16) {
        if (isMuted || !audioCtx) return;
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const osc2Gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);
        osc2Gain.gain.setValueAtTime(0.3, startTime);

        osc1.connect(gain);
        osc2.connect(osc2Gain);
        osc2Gain.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.04);
        osc2.stop(startTime + duration + 0.04);
      }

      const NOTES = {
        C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
      };

      const JINGLE_BELLS_MELODY = [
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['E5', 'D4', 1], ['D5', null, 1], ['D5', 'A4', 1], ['E5', null, 1], ['D5', 'G4', 2], ['G5', 'B4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['G5', 'G4', 1], ['G5', null, 1], ['F5', 'B4', 1], ['D5', null, 1], ['C5', 'C4', 4]
      ];

      function stopSynthesizedJingleBells() {
        if (jingleLoopTimer) { clearTimeout(jingleLoopTimer); jingleLoopTimer = null; }
        if (sleighBellTimer) { clearInterval(sleighBellTimer); sleighBellTimer = null; }
      }

      function startSynthesizedJingleBells() {
        stopSynthesizedJingleBells();
        if (document.hidden) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const beatSec = 0.24;
        function scheduleSongLoop() {
          if (isMuted || document.hidden) return;
          let cursor = ctx.currentTime + 0.05;
          let totalBeats = 0;

          JINGLE_BELLS_MELODY.forEach(([melodyNote, bassNote, beats]) => {
            const dur = beats * beatSec;
            if (melodyNote && NOTES[melodyNote]) playChimeNote(NOTES[melodyNote], cursor, dur * 0.92, 0.14);
            if (bassNote && NOTES[bassNote]) playChimeNote(NOTES[bassNote], cursor, dur * 1.1, 0.08);
            cursor += dur;
            totalBeats += beats;
          });
          jingleLoopTimer = setTimeout(scheduleSongLoop, totalBeats * beatSec * 1000);
        }

        scheduleSongLoop();
        sleighBellTimer = setInterval(() => {
          if (!isMuted && !document.hidden) playSleighBellShake(0.11, 0.045);
        }, beatSec * 1000);
      }

      function startJingleBellsMusic() {
        jingleBellsAudio.muted = isMuted;
        jingleBellsAudio.currentTime = 0;
        const p = jingleBellsAudio.play();
        if (p !== undefined) {
          p.then(stopSynthesizedJingleBells).catch(startSynthesizedJingleBells);
        } else {
          startSynthesizedJingleBells();
        }
      }

      function stopAllMusic() {
        jingleBellsAudio.pause();
        jingleBellsAudio.currentTime = 0;
        hoHoHoAudio.pause();
        hoHoHoAudio.currentTime = 0;
        stopSynthesizedJingleBells();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }

      function playSynthesizedHoHoHo() {
        if (isMuted) return;
        const ctx = ensureAudioContext();
        [0, 180, 360, 540, 720, 900].forEach((d) => setTimeout(() => playSleighBellShake(0.16, 0.09), d));

        if (ctx) {
          [135, 128, 118].forEach((baseFreq, idx) => {
            const start = ctx.currentTime + 0.1 + idx * 0.42;
            const dur = 0.32;
            const osc = ctx.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq * 1.08, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.86, start + dur);

            const f1 = ctx.createBiquadFilter();
            f1.type = 'bandpass'; f1.frequency.setValueAtTime(460, start); f1.Q.setValueAtTime(4.5, start);
            const f2 = ctx.createBiquadFilter();
            f2.type = 'bandpass'; f2.frequency.setValueAtTime(820, start); f2.Q.setValueAtTime(5, start);

            const vGain = ctx.createGain();
            vGain.gain.setValueAtTime(0.001, start);
            vGain.gain.linearRampToValueAtTime(0.28, start + 0.05);
            vGain.gain.exponentialRampToValueAtTime(0.002, start + dur);

            osc.connect(f1); osc.connect(f2);
            f1.connect(vGain); f2.connect(vGain);
            vGain.connect(ctx.destination);
            osc.start(start); osc.stop(start + dur + 0.02);
          });
        }

        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance('Ho! Ho! Ho! Merry Christmas!');
            u.lang = 'en-US'; u.pitch = 0.35; u.rate = 0.78; u.volume = 1;
            window.speechSynthesis.speak(u);
          } catch (_) {}
        }
      }

      function playSantaHoHoHoSound() {
        if (isMuted) return;
        hoHoHoAudio.muted = isMuted;
        hoHoHoAudio.currentTime = 0;
        const p = hoHoHoAudio.play();
        if (p !== undefined) p.catch(playSynthesizedHoHoHo);
        else playSynthesizedHoHoHo();
      }

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stopSynthesizedJingleBells();
        else if (isCurtainOpened && !isMuted && jingleBellsAudio.paused) startSynthesizedJingleBells();
      });

      soundToggleBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        jingleBellsAudio.muted = isMuted;
        hoHoHoAudio.muted = isMuted;
        soundToggleBtn.textContent = isMuted ? '🔇 Bật nhạc' : '🔊 Tắt nhạc';
        if (isMuted) {
          stopSynthesizedJingleBells();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } else if (isCurtainOpened && jingleBellsAudio.paused) {
          startSynthesizedJingleBells();
        }
      });

      /* ==================== 3. DỮ LIỆU LỜI CHÚC & BẢNG MÀU QUÀ ==================== */
      const WISHES_POOL = [
        { title: "Giáng Sinh Ấm Áp", text: "Chúc bạn một mùa Giáng sinh ngập tràn hơi ấm bên gia đình, mọi ước nguyện đêm Noel đều sớm trở thành hiện thực!" },
        { title: "Bình An & Hạnh Phúc", text: "Chúc bạn luôn giữ được nụ cười rạng rỡ, tâm hồn bình yên và trái tim tràn đầy yêu thương trong mùa lễ hội này." },

      /* ==================== 5. CÁNH CỔNG KHÔNG GIAN 3D ==================== */
      function createDimensionalPortal3D() {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2, cy = size / 2, R = size * 0.48;

        const baseGrad = c.createRadialGradient(cx, cy, 4, cx, cy, R);
        baseGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        baseGrad.addColorStop(0.18, 'rgba(255, 238, 158, 0.95)');
        baseGrad.addColorStop(0.42, 'rgba(72, 235, 255, 0.85)');
        baseGrad.addColorStop(0.68, 'rgba(138, 82, 255, 0.65)');
        baseGrad.addColorStop(0.88, 'rgba(255, 180, 72, 0.42)');
        baseGrad.addColorStop(1, 'rgba(20, 60, 120, 0)');
        c.fillStyle = baseGrad;
        c.beginPath(); c.arc(cx, cy, R, 0, Math.PI * 2); c.fill();

        c.save();
        c.translate(cx, cy);
        for (let arm = 0; arm < 12; arm++) {
          c.save();
          c.rotate((arm * Math.PI * 2) / 12);
          c.strokeStyle = arm % 2 === 0 ? 'rgba(255, 240, 175, 0.72)' : 'rgba(120, 245, 255, 0.65)';
          c.lineWidth = 4.5;
          c.beginPath();
          for (let r = 8; r < R * 0.92; r += 6) {
            const a = r * 0.018;
            if (r === 8) c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
            else c.lineTo(Math.cos(a) * r, Math.sin(a) * r);
          }
          c.stroke();
          c.restore();
        }
        c.strokeStyle = 'rgba(255, 230, 140, 0.9)'; c.lineWidth = 3.5; c.setLineDash([12, 8, 4, 8]);
        c.beginPath(); c.arc(0, 0, R * 0.82, 0, Math.PI * 2); c.stroke();
        c.strokeStyle = 'rgba(140, 250, 255, 0.85)'; c.lineWidth = 2.5; c.setLineDash([6, 10]);
        c.beginPath(); c.arc(0, 0, R * 0.64, 0, Math.PI * 2); c.stroke();
        c.restore();

        const vortexTex = new THREE.CanvasTexture(cvs);
        const portalGroup = new THREE.Group();

        const vortexDisc = new THREE.Mesh(
          new THREE.PlaneGeometry(24, 24),
          new THREE.MeshBasicMaterial({ map: vortexTex, transparent: true, opacity: 0.96, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
        );
        const innerVortexDisc = new THREE.Mesh(
          new THREE.PlaneGeometry(18, 18),
          new THREE.MeshBasicMaterial({ map: vortexTex, color: 0xa8f5ff, transparent: true, opacity: 0.78, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending })
        );
        innerVortexDisc.position.z = 0.25;

        const outerRing = new THREE.Mesh(
          new THREE.TorusGeometry(9.6, 0.42, 14, 56),
          new THREE.MeshStandardMaterial({ color: 0xffe07d, emissive: 0xffa826, emissiveIntensity: 1.15, metalness: 0.9, roughness: 0.12 })
        );
        const gemGeo = new THREE.OctahedronGeometry(0.68, 0);
        const gemMat = new THREE.MeshBasicMaterial({ color: 0x6df7ff });
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * Math.PI * 2;
          const gem = new THREE.Mesh(gemGeo, gemMat);
          gem.position.set(Math.cos(a) * 9.6, Math.sin(a) * 9.6, 0.2);
          gem.rotation.z = a;
          outerRing.add(gem);
        }

        const cyanRing = new THREE.Mesh(
          new THREE.TorusGeometry(7.6, 0.22, 12, 48),
          new THREE.MeshBasicMaterial({ color: 0x63f5ff, transparent: true, opacity: 0.88, blending: THREE.AdditiveBlending })
        );
        cyanRing.position.z = 0.4;

        const sparkCount = 90;
        const sparkGeo = new THREE.BufferGeometry();
        const sparkPos = new Float32Array(sparkCount * 3);
        const sparkAngles = [];
        for (let i = 0; i < sparkCount; i++) {
          const a = rand(0, Math.PI * 2), r = rand(6.2, 11.4);
          sparkPos[i * 3] = Math.cos(a) * r;
          sparkPos[i * 3 + 1] = Math.sin(a) * r;
          sparkPos[i * 3 + 2] = rand(-1.2, 1.8);
          sparkAngles.push({ angle: a, radius: r, speed: rand(1.8, 3.8) });
        }
        sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
        const sparkPoints = new THREE.Points(
          sparkGeo,
          new THREE.PointsMaterial({ color: 0xfff0a6, size: 1.65, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
        );

        const portalLight = new THREE.PointLight(0x7ceeff, 3.2, 65);
        portalLight.position.set(0, 0, 3);

        portalGroup.add(vortexDisc, innerVortexDisc, outerRing, cyanRing, sparkPoints, portalLight);
        portalGroup.userData = { vortexDisc, innerVortexDisc, outerRing, cyanRing, sparkPoints, sparkAngles, portalLight };
        return portalGroup;
      }

      /* ==================== 6. MẶT TRĂNG 3D SẮC NÉT ==================== */
      function createMoon3D() {
        const w = 512, h = 256;
        const cvs = document.createElement('canvas');
        cvs.width = w; cvs.height = h;
        const c = cvs.getContext('2d');

        const baseGrad = c.createLinearGradient(0, 0, 0, h);
        baseGrad.addColorStop(0, '#fff7dc');
        baseGrad.addColorStop(0.5, '#f7e5b4');
        baseGrad.addColorStop(1, '#e8ce92');
        c.fillStyle = baseGrad;
        c.fillRect(0, 0, w, h);

        [
          { x: 145, y: 92, rx: 72, ry: 46, alpha: 0.36 },
          { x: 215, y: 128, rx: 58, ry: 42, alpha: 0.32 },
          { x: 290, y: 86, rx: 52, ry: 38, alpha: 0.34 },
          { x: 350, y: 142, rx: 64, ry: 48, alpha: 0.28 },
          { x: 175, y: 168, rx: 44, ry: 32, alpha: 0.25 },
          { x: 92, y: 142, rx: 40, ry: 28, alpha: 0.26 }
        ].forEach((m) => {
          const g = c.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.rx);
          g.addColorStop(0, `rgba(110, 92, 65, ${m.alpha})`);
          g.addColorStop(0.65, `rgba(130, 110, 78, ${m.alpha * 0.65})`);
          g.addColorStop(1, 'rgba(130, 110, 78, 0)');
          c.fillStyle = g;
          c.beginPath(); c.ellipse(m.x, m.y, m.rx, m.ry, 0.2, 0, Math.PI * 2); c.fill();
        });

        for (let i = 0; i < 75; i++) {
          const cx = rand(14, w - 14), cy = rand(14, h - 14), r = rand(3.5, 19);
          c.strokeStyle = 'rgba(255, 252, 232, 0.62)';
          c.lineWidth = r > 9 ? 2.4 : 1.3;
          c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.stroke();

          const cg = c.createRadialGradient(cx - r * 0.25, cy - r * 0.25, 1, cx, cy, r);
          cg.addColorStop(0, 'rgba(115, 96, 68, 0.34)');
          cg.addColorStop(0.78, 'rgba(98, 82, 56, 0.38)');
          cg.addColorStop(1, 'rgba(255, 248, 220, 0.22)');
          c.fillStyle = cg;
          c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
        }
        const lunarTex = new THREE.CanvasTexture(cvs);

        c.globalCompositeOperation = 'lighter';
        for (let band = 0; band < 5; band++) {
          c.beginPath();
          const baseY = 60 + band * 54;

            const u = (x / w) * Math.PI * 2;
            const y = baseY + Math.sin(u * (2 + (band % 3)) + band * 1.3) * 26 + Math.cos(u * 5 - band) * 12;

          c.strokeStyle = band % 2 === 0 ? 'rgba(50, 240, 170, 0.20)' : 'rgba(85, 195, 245, 0.18)';
          c.lineWidth = 28; c.stroke();
        }

        for (let i = 0; i < 160; i++) {

      function createIceCrystalTexture(variant = 0) {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2, cy = size / 2, R = size * 0.42;

        const glowGrad = c.createRadialGradient(cx, cy, 4, cx, cy, R * 1.08);
        glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        glowGrad.addColorStop(0.28, 'rgba(210, 244, 255, 0.32)');
        glowGrad.addColorStop(0.65, 'rgba(165, 225, 255, 0.10)');
        glowGrad.addColorStop(1, 'rgba(165, 225, 255, 0)');
        c.fillStyle = glowGrad;
        c.beginPath(); c.arc(cx, cy, R * 1.08, 0, Math.PI * 2); c.fill();

        c.save();
        c.translate(cx, cy);
        c.lineCap = 'round'; c.lineJoin = 'round';
        c.shadowColor = 'rgba(195, 240, 255, 0.95)'; c.shadowBlur = 14;

        const branchSpecs = variant === 0
          ? [{ pos: 0.28, len: 0.24, w: 5.0, sub: true }, { pos: 0.50, len: 0.34, w: 5.2, sub: true }, { pos: 0.70, len: 0.25, w: 4.4, sub: false }, { pos: 0.86, len: 0.14, w: 3.6, sub: false }]
          : variant === 1
          ? [{ pos: 0.34, len: 0.30, w: 5.2, sub: true }, { pos: 0.58, len: 0.28, w: 4.6, sub: true }, { pos: 0.78, len: 0.18, w: 3.8, sub: false }]
          : [{ pos: 0.24, len: 0.20, w: 4.6, sub: false }, { pos: 0.44, len: 0.35, w: 5.5, sub: true }, { pos: 0.64, len: 0.26, w: 4.5, sub: true }, { pos: 0.82, len: 0.16, w: 3.6, sub: false }];

        for (let arm = 0; arm < 6; arm++) {
          c.save();
          c.rotate((arm * Math.PI) / 3);
          const mainGrad = c.createLinearGradient(0, 0, 0, -R);
          mainGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          mainGrad.addColorStop(0.7, 'rgba(235, 250, 255, 0.96)');
          mainGrad.addColorStop(1, 'rgba(195, 238, 255, 0.85)');
          c.strokeStyle = mainGrad; c.lineWidth = 7.5;
          c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -R); c.stroke();

          branchSpecs.forEach((b) => {
            const y0 = -R * b.pos, bLen = R * b.len;
            const dx = Math.sin(Math.PI / 3) * bLen, dy = -Math.cos(Math.PI / 3) * bLen;
            c.lineWidth = b.w;
            [-1, 1].forEach((side) => {
              c.beginPath(); c.moveTo(0, y0); c.lineTo(side * dx, y0 + dy); c.stroke();
              if (b.sub) {
                const mx = side * dx * 0.58, my = y0 + dy * 0.58, twigLen = bLen * 0.42;
                c.lineWidth = b.w * 0.62;
                c.beginPath(); c.moveTo(mx, my); c.lineTo(mx + side * twigLen * 0.35, my - twigLen * 0.92); c.stroke();
                c.lineWidth = b.w;
              }
            });
          });

          c.fillStyle = 'rgba(255, 255, 255, 0.96)';
          c.beginPath(); c.moveTo(0, -R - 10); c.lineTo(8, -R + 6); c.lineTo(0, -R + 20); c.lineTo(-8, -R + 6); c.closePath(); c.fill();
          c.restore();
        }

        [0.16, 0.29].forEach((hexRatio, idx) => {
          const hr = R * hexRatio;
          c.lineWidth = idx === 0 ? 5 : 3.2;
          c.strokeStyle = 'rgba(245, 253, 255, 0.92)';
          c.fillStyle = idx === 0 ? 'rgba(230, 248, 255, 0.35)' : 'rgba(210, 242, 255, 0.14)';
          c.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3 + (idx === 1 ? Math.PI / 6 : 0);
            if (i === 0) c.moveTo(Math.cos(a) * hr, Math.sin(a) * hr);
            else c.lineTo(Math.cos(a) * hr, Math.sin(a) * hr);
          }
          c.closePath(); c.fill(); c.stroke();
        });

        c.fillStyle = '#ffffff';
        c.beginPath(); c.arc(0, 0, 8, 0, Math.PI * 2); c.fill();
        c.restore();
        return new THREE.CanvasTexture(cvs);
      }

      function createScallopedPineGeometry(radius, height, lobes = 14) {
        const geo = new THREE.ConeGeometry(radius, height, lobes * 6, 12, false);
        const pos = geo.attributes.position;
        const halfH = height / 2;

        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
          const t = clamp((halfH - y) / height, 0, 1);
          if (t > 0.04) {
            const angle = Math.atan2(z, x);
            const lobeWave = Math.cos(angle * lobes);
            const secondaryWave = Math.sin(angle * lobes * 2) * 0.25;
            const scaleXZ = (1 + (lobeWave * 0.16 + secondaryWave * 0.05) * Math.pow(t, 0.85)) * (1 + 0.08 * Math.pow(t, 1.6));
            x *= scaleXZ; z *= scaleXZ;
            y -= y > -halfH + 0.05 ? Math.max(0, lobeWave) * 0.42 * Math.pow(t, 1.3) : lobeWave * 0.32;
          }
          pos.setXYZ(i, x, y, z);
        }
        geo.computeVertexNormals();
        return geo;
      }

      function createSnowDrapeRing(radius, lobes = 14, tubeRadius = 0.34) {
        const pts = [];
        const steps = lobes * 8;
        for (let i = 0; i <= steps; i++) {
          const angle = (i / steps) * Math.PI * 2;
          const lobeWave = Math.cos(angle * lobes);
          const r = radius * (0.95 + lobeWave * 0.14);
          pts.push(new THREE.Vector3(Math.cos(angle) * r, -lobeWave * 0.28, Math.sin(angle) * r));
        }
        return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, true), steps, tubeRadius, 8, true);
      }

        const fencePostGeo = new THREE.CylinderGeometry(0.16, 0.18, 1.65, 8);

        fencePostsX.forEach((px, idx) => {

          // Nối thanh ngang hàng rào (chừa lối đi ở giữa từ -1.4 đến 1.4)

            for (let b = 0; b < 3; b++) {

          const waveDip = Math.abs(Math.sin(angle * 3)) * 0.35;
          garlandPointsGold.push(new THREE.Vector3(Math.cos(angle) * radius, y - waveDip, Math.sin(angle) * radius));
          garlandPointsSilver.push(new THREE.Vector3(Math.cos(angle + Math.PI) * (radius * 0.97), y - waveDip * 0.8, Math.sin(angle + Math.PI) * (radius * 0.97)));
        }

        treeGroup.add(
          new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(garlandPointsGold), 140, 0.22, 8, false),
            new THREE.MeshStandardMaterial({ color: 0xffd86b, emissive: 0xb87914, emissiveIntensity: 0.52, metalness: 0.88, roughness: 0.15 })
          ),
          new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(garlandPointsSilver), 140, 0.14, 8, false),
            new THREE.MeshStandardMaterial({ color: 0xfff8e7, emissive: 0x9ecae8, emissiveIntensity: 0.45, metalness: 0.82, roughness: 0.18 })
          )
        );

        const baubleColors = [0xe63946, 0xffd166, 0x48bfe3, 0x4cd97b, 0xff6b9d, 0xfff3c4, 0xff9f1c];
        const baubleMats = baubleColors.map((c) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.22, metalness: 0.92, roughness: 0.08 }));
        const bulbGeo = new THREE.SphereGeometry(0.32, 10, 10);
        const orbGeo = new THREE.SphereGeometry(0.58, 14, 14);
        const capGeo = new THREE.CylinderGeometry(0.16, 0.18, 0.22, 8);
        const lightBulbs = [];

        for (let i = 0; i < 82; i++) {
          const u = (i + 0.5) / 82, angle = i * 2.39996;
          const y = 4.2 + u * 17.6, r = (1 - u * 0.83) * 10.1 + 0.45;
          const bx = Math.cos(angle) * r, bz = Math.sin(angle) * r;
          const cIdx = i % baubleColors.length;

          if (i % 2 === 0) {
            const bulb = new THREE.Mesh(
              bulbGeo,
              new THREE.MeshStandardMaterial({ color: baubleColors[cIdx], emissive: baubleColors[cIdx], emissiveIntensity: 1.15, roughness: 0.12 })
            );
            bulb.position.set(bx, y, bz);
            treeGroup.add(bulb);
            lightBulbs.push({ mesh: bulb, phase: rand(0, Math.PI * 2) });
          } else {
            const baubleGroup = new THREE.Group();
            const orb = new THREE.Mesh(orbGeo, baubleMats[cIdx]);
            const cap = new THREE.Mesh(capGeo, SHARED_MATS.goldTrim);
            cap.position.y = 0.56;
            baubleGroup.add(orb, cap);
            baubleGroup.position.set(bx, y, bz);
            treeGroup.add(baubleGroup);
          }
        }

        for (let i = 0; i < 14; i++) {
          const u = 0.12 + (i / 14) * 0.72, angle = i * 1.9 + 0.4;
          const y = 4.5 + u * 16.5, r = (1 - u * 0.83) * 10.35 + 0.45;
          const ox = Math.cos(angle) * r, oz = Math.sin(angle) * r;
          const item = (i % 2 === 0 ? candyCaneProto : redBowProto).clone();
          item.position.set(ox, y, oz);
          item.lookAt(ox * 2, y, oz * 2);
          treeGroup.add(item);
        }

        const starShape = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const rad = i % 2 === 0 ? 2.05 : 0.86;
          if (i === 0) starShape.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
          else starShape.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
        }
        starShape.closePath();

        const starExtrude = new THREE.ExtrudeGeometry(starShape, { depth: 0.52, bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.16, bevelSegments: 3 });
        starExtrude.center();

        const topStarMesh = new THREE.Mesh(
          starExtrude,
          new THREE.MeshStandardMaterial({ color: 0xfff0a8, emissive: 0xffc93c, emissiveIntensity: 1.1, metalness: 0.82, roughness: 0.12 })
        );
        topStarMesh.rotation.z = Math.PI; topStarMesh.position.set(0, 23.9, 0);

        const starGlowHalo = new THREE.Mesh(
          new THREE.SphereGeometry(2.8, 20, 20),
          new THREE.MeshBasicMaterial({ color: 0xffe899, transparent: true, opacity: 0.36 })
        );
        starGlowHalo.position.set(0, 23.9, 0);

        const starPointLight = new THREE.PointLight(0xffe694, 1.9, 38);
        starPointLight.position.set(0, 23.9, 2.0);

        treeGroup.add(topStarMesh, starGlowHalo, starPointLight);
        treeGroup.userData = { lightBulbs, topStarMesh, starGlowHalo };
        return treeGroup;

      const giantTree3D = createGiantChristmasTree3D();

      function createMiniPineTree3D(scale = 1, treeIdx = 0) {
        const mini = new THREE.Group();
        const trunk = new THREE.Mesh(sharedMiniTreeAssets.trunkGeo, SHARED_MATS.trunk);
        trunk.position.y = 1.1;
        mini.add(trunk);

        [0.45, 2.35, 4.45].forEach((baseAngle, gIdx) => {
          const angle = baseAngle + treeIdx * 0.7;
          const dist = 1.35 + (gIdx % 2) * 0.38;
          const sx = 0.85 + (gIdx % 2) * 0.25, sy = 0.72 + ((gIdx + 1) % 2) * 0.28, sz = 0.85 + (gIdx % 2) * 0.2;
          const miniGift = createDecorativeGiftBox3D(treeIdx + gIdx * 2, sx, sy, sz);
          miniGift.position.set(Math.cos(angle) * dist, 0.22 + sy * 0.45, Math.sin(angle) * dist);

          mini.add(miniGift);

        sharedMiniTreeAssets.tiers.forEach((t) => {

          const rim = new THREE.Mesh(t.rimGeo, SHARED_MATS.pineMiniSnow);
          rim.position.y = t.rimY;
          mini.add(c, rim);

        for (let i = 0; i < 8; i++) {
          const u = (i + 0.5) / 8, a = i * 2.4, y = 2.2 + u * 4.8, r = (1 - u * 0.72) * 2.85;
          const dot = new THREE.Mesh(sharedMiniTreeAssets.dotGeo, sharedMiniTreeAssets.dotMats[i % 4]);
          dot.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
          mini.add(dot);
        }

        const topDot = new THREE.Mesh(sharedMiniTreeAssets.topDotGeo, sharedMiniTreeAssets.topDotMat);
        topDot.position.y = 8.45;
        mini.add(topDot);
        mini.scale.setScalar(scale);
        return mini;

/* ==================== MÔ-ĐUN 1: BẢNG GỖ 3D KHẮC NỔI ĐẾM NGƯỢC GIÁNG SINH ==================== */
      let lastCountdownSec = -1;
      const signCanvas = document.createElement('canvas');
      signCanvas.width = 512;
      signCanvas.height = 256;
      const signCtx = signCanvas.getContext('2d');
      const signTexture = new THREE.CanvasTexture(signCanvas);

      function updateCountdownSignCanvas() {
        const now = new Date();
        let targetYear = now.getFullYear();
        let xmasDate = new Date(targetYear, 11, 25, 0, 0, 0);
        if (now > new Date(targetYear, 11, 26, 0, 0, 0)) {
          xmasDate = new Date(targetYear + 1, 11, 25, 0, 0, 0);
        }
        const diff = Math.max(0, xmasDate - now);
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const mins = Math.floor((diff % 3600000) / 60000);
        const secs = Math.floor((diff % 60000) / 1000);
        const pad = (n) => String(n).padStart(2, '0');

        // Vẽ nền vân gỗ thông Bắc Cực
        const bgGrad = signCtx.createLinearGradient(0, 0, 0, 256);
        bgGrad.addColorStop(0, '#4a2811');
        bgGrad.addColorStop(0.5, '#3b1f0c');
        bgGrad.addColorStop(1, '#2a1507');
        signCtx.fillStyle = bgGrad;
        signCtx.fillRect(0, 0, 512, 256);

        // Vân gỗ ngang & viền khắc vàng kim
        signCtx.strokeStyle = 'rgba(20, 8, 2, 0.45)';
        signCtx.lineWidth = 3;
        for (let y = 32; y < 256; y += 36) {
          signCtx.beginPath();
          signCtx.moveTo(0, y);
          signCtx.lineTo(512, y);
          signCtx.stroke();
        }
        signCtx.strokeStyle = '#e5b85c';
        signCtx.lineWidth = 6;
        signCtx.strokeRect(12, 12, 488, 232);
        signCtx.strokeStyle = 'rgba(255, 235, 175, 0.35)';
        signCtx.lineWidth = 2;
        signCtx.strokeRect(20, 20, 472, 216);

        // Tiêu đề khắc nổi
        signCtx.textAlign = 'center';
        signCtx.font = '700 24px "Be Vietnam Pro", sans-serif';
        signCtx.fillStyle = '#1a0902';
        signCtx.fillText('🎄 ĐẾM NGƯỢC ĐÊM GIÁNG SINH 🎄', 258, 56);
        signCtx.fillStyle = '#ffd97d';
        signCtx.fillText('🎄 ĐẾM NGƯỢC ĐÊM GIÁNG SINH 🎄', 256, 54);

        // 4 Ô số khắc nổi: NGÀY - GIỜ - PHÚT - GIÂY
        const units = [
          { val: pad(days), label: 'NGÀY' },
          { val: pad(hours), label: 'GIỜ' },
          { val: pad(mins), label: 'PHÚT' },
          { val: pad(secs), label: 'GIÂY' }
        ];
        units.forEach((u, idx) => {
          const cx = 76 + idx * 120;
          // Hốc gỗ khắc chìm
          signCtx.fillStyle = 'rgba(18, 7, 2, 0.65)';
          signCtx.fillRect(cx - 48, 76, 96, 96);
          signCtx.strokeStyle = 'rgba(255, 216, 130, 0.55)';
          signCtx.lineWidth = 2;
          signCtx.strokeRect(cx - 48, 76, 96, 96);

          // Số khắc nổi phát sáng ấm
          signCtx.font = '800 54px "Playfair Display", Georgia, serif';
          signCtx.fillStyle = '#140600';
          signCtx.fillText(u.val, cx + 2, 144);
          signCtx.fillStyle = '#fff3cf';
          signCtx.shadowColor = 'rgba(255, 195, 75, 0.85)';
          signCtx.shadowBlur = 10;
          signCtx.fillText(u.val, cx, 142);
          signCtx.shadowBlur = 0;

          // Nhãn đơn vị bên dưới
          signCtx.font = '700 18px "Be Vietnam Pro", sans-serif';
          signCtx.fillStyle = '#f5c869';
          signCtx.fillText(u.label, cx, 206);
        });

        signTexture.needsUpdate = true;
      }

      const snapshotCardBtn = document.getElementById('snapshotCardBtn');

          const outW = srcCanvas.width;
          const outH = srcCanvas.height;
          const cardCanvas = document.createElement('canvas');

          cardCanvas.height = outH;
          const ctx = cardCanvas.getContext('2d');

          // 1. Vẽ nền bầu trời đêm Bắc Cực (vì WebGLRenderer để alpha trong suốt)
          const skyGrad = ctx.createLinearGradient(0, 0, 0, outH);
          skyGrad.addColorStop(0, '#02060f');
          skyGrad.addColorStop(0.46, '#051428');
          skyGrad.addColorStop(0.78, '#0a2238');
          skyGrad.addColorStop(1, '#071826');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, outW, outH);

          // 2. Vẽ toàn bộ khung cảnh 3D lên thiệp
          ctx.drawImage(srcCanvas, 0, 0, outW, outH);

          // 3. Vẽ khung viền vàng kim lễ hội & Tiêu đề thiệp Giáng sinh
          const pad = Math.round(Math.min(outW, outH) * 0.028);
          ctx.strokeStyle = '#f5ca72';
          ctx.lineWidth = Math.max(3, Math.round(outW * 0.0035));
          ctx.strokeRect(pad, pad, outW - pad * 2, outH - pad * 2);
          ctx.strokeStyle = 'rgba(255, 240, 195, 0.45)';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(pad + 8, pad + 8, outW - (pad + 8) * 2, outH - (pad + 8) * 2);

          // Chữ ký thiệp ở góc dưới
          const titleFontSize = Math.max(22, Math.round(outW * 0.028));
          const subFontSize = Math.max(13, Math.round(outW * 0.013));
          ctx.textAlign = 'center';
          ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
          ctx.shadowBlur = 12;
          ctx.font = `700 ${titleFontSize}px "Playfair Display", Georgia, serif`;
          ctx.fillStyle = '#fff6df';
          ctx.fillText('✨ Merry Christmas · Giáng Sinh An Lành ✨', outW / 2, outH - pad - subFontSize * 2.1);

          ctx.font = `600 ${subFontSize}px "Be Vietnam Pro", sans-serif`;
          ctx.fillStyle = '#ffd887';
          const receiverLine = customCardData.to ? `Dành tặng ${customCardData.to} yêu quý!` : 'Chúc bạn một mùa lễ hội ấm áp, an lành & tràn ngập phép màu!';
          ctx.fillText(receiverLine, outW / 2, outH - pad - subFontSize * 0.6);

          // 4. Xuất file PNG tải về máy
          const link = document.createElement('a');

      /* ==================== MÔ-ĐUN 4: TỰ ĐỘNG TỐI ƯU HÓA FPS THEO THIẾT BỊ (SMART FPS AUTO-SCALER) ==================== */
      const fpsAutoScaler = {
        frames: 0,
        elapsed: 0,
        qualityTier: 2, // 2: Cao nhất, 1: Cân bằng, 0: Siêu mượt cho máy yếu
        basePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        update(dt) {
          if (document.hidden) return;
          this.frames++;
          this.elapsed += dt;
          if (this.elapsed >= 2.5) {
            const avgFps = this.frames / this.elapsed;
            if (avgFps < 38 && this.qualityTier > 0) {
              this.qualityTier--;
              this.applyTier();
            } else if (avgFps > 57 && this.qualityTier < 2) {
              this.qualityTier++;
              this.applyTier();
            }
            this.frames = 0;
            this.elapsed = 0;
          }
        },
        applyTier() {
          if (this.qualityTier === 2) {
            renderer.setPixelRatio(this.basePixelRatio);
            moonLight.castShadow = true;
          } else if (this.qualityTier === 1) {
            renderer.setPixelRatio(Math.min(this.basePixelRatio, 1.25));
            moonLight.castShadow = true;
          } else {
            renderer.setPixelRatio(1.0);
            moonLight.castShadow = false;
          }
        }
      };

/* ==================== TỰ ĐỘNG THÊM GÓC NHÌN THỨ NHẤT TRÊN CỖ XE VÀO CAMERA_MODES ==================== */

      // Âm thanh pháo hoa tổng hợp bằng Web Audio API
      function playFireworkBoomSound() {
        if (isMuted) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const dur = 0.65;
        const bufSize = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.22));
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buf;

        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(520, now);
        filter.frequency.exponentialRampToValueAtTime(95, now + dur);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
      }

      // Hệ thống chùm pháo hoa 3D nổ trên bầu trời

      /* ==================== MÔ-ĐUN 4: BỘ ĐIỀU KHIỂN 3 CHẾ ĐỘ THỜI TIẾT THỜI GIAN THỰC ==================== */

      /* ==================== MÔ-ĐUN 5: QUẢ CHÂU LƯU GIỮ LỜI CHÚC TRÊN CÂY THÔNG ==================== */
      const customWishBaubleGroup = new THREE.Group();

      // Lưu lời chúc vào Quả châu khi người dùng bấm Tạo Link Thiệp
      let treeSavedWish = {

      /* ==================== MÔ-ĐUN 3: TƯƠNG TÁC BẤT NGỜ KHI CHẠM VẬT THỂ 3D (EASTER EGGS) ==================== */
      let treeMagicPulse = 0;
      const interactiveTargets = [wishBaubleCore];

      window.addEventListener('pointerup', (e) => {

        if (hitObj.userData.snowmanRoot) {

      renderer.domElement.addEventListener('pointerdown', (e) => {

        userLookOffset.set(
          (((e.clientX - rect.left) / rect.width) * 2 - 1) * 4.5,
          (-((e.clientY - rect.top) / rect.height) * 2 + 1) * 2.5
        );

        if (isDraggingOrbit && isCurtainOpened) {
          const dx = e.clientX - prevDragPos.x, dy = e.clientY - prevDragPos.y;
          if (Math.hypot(e.clientX - dragStartPos.x, e.clientY - dragStartPos.y) > 5) {
            hasDraggedManual360 = true;

      window.addEventListener('pointerup', (e) => {

      renderer.domElement.addEventListener('wheel', (e) => {
