<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Merry Christmas 3D · Giáng sinh an lành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <!-- Thư viện 3D Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --night: #050f20;
      --gold: #ffd887;
      --cream: #fff7e8;
      --red: #d94850;
      --green: #0c573f;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: var(--font-sans);
      background: var(--night); color: var(--cream);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .scene {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 25%, rgba(20, 95, 110, .24), transparent 70%),
        radial-gradient(ellipse at 20% 15%, rgba(65, 50, 135, .20), transparent 60%),
        linear-gradient(180deg, #02060f 0%, #051428 46%, #0a2238 78%, #071826 100%);
    }

    /* Canvas 3D Three.js */
    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
      touch-action: none;
    }
    #webgl-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lớp phủ sương tuyết trắng xóa khoảnh khắc bông tuyết khổng lồ che kín ống kính */
    .snow-whiteout {
      position: absolute;
      z-index: 8;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(240, 250, 255, .94) 0%, rgba(215, 240, 255, .8) 55%, rgba(190, 228, 250, .58) 100%);
      opacity: 0;
      transition: opacity .6s cubic-bezier(.4, 0, .2, 1);
    }
    .snow-whiteout.active {
      opacity: 1;
    }

    /* ==================== 1. TẤM RÈM NHUNG ĐỎ MỞ ĐẦU ==================== */
    .curtain-stage {
      position: absolute; z-index: 30; inset: 0;
      display: flex; cursor: pointer;
      user-select: none;
      perspective: 1200px;
      transition: visibility 0s linear 2.3s;
    }
    .curtain-stage.open {
      pointer-events: none;
      visibility: hidden;
    }
    .curtain-valance {
      position: absolute; z-index: 4; top: 0; left: 0; width: 100%;
      height: clamp(56px, 9.5vh, 92px);
      background:
        repeating-linear-gradient(90deg,
          #5c0811 0px, #8f1120 26px, #b81d2f 52px, #8f1120 78px, #5c0811 104px);
      border-bottom: 5px solid #f4c96b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .68), inset 0 -6px 14px rgba(255, 215, 130, .28);
      transition: transform 1.65s cubic-bezier(.65, 0, .25, 1) .18s;
    }
    .curtain-stage.open .curtain-valance {
      transform: translateY(-135%);
    }
    .valance-lights {
      position: absolute; inset: 0; width: 100%; height: 145%; overflow: visible;
    }

    .curtain-panel {
      position: relative; width: 50.5%; height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 110, 110, .16), transparent 65%),
        repeating-linear-gradient(90deg,
          #46040c 0%, #7d0c19 4.5%, #ba1c2e 9%, #830e1c 13.5%, #46040c 18%);
      box-shadow: inset 0 0 85px rgba(20, 0, 4, .78), 0 0 50px rgba(0, 0, 0, .7);
      transition:
        transform 2.15s cubic-bezier(.55, .06, .18, 1),
        filter 2.15s ease;
      overflow: hidden;
      will-change: transform;
    }
    .curtain-panel.left {
      transform-origin: left top;
      border-right: 4px solid #f2c76e;
    }
    .curtain-panel.right {
      transform-origin: right top;
      border-left: 4px solid #f2c76e;
    }
    .curtain-stage.open .curtain-panel.left {
      transform: translateX(-92%) scaleX(0.72) rotate(4.5deg) skewY(-2deg);
      filter: brightness(0.75);
    }
    .curtain-stage.open .curtain-panel.right {
      transform: translateX(92%) scaleX(0.72) rotate(-4.5deg) skewY(2deg);
      filter: brightness(0.75);
    }

    .curtain-ornaments {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .bulb-glow-1 { animation: bulb-blink 1.1s ease-in-out infinite alternate; }
    .bulb-glow-2 { animation: bulb-blink 1.1s ease-in-out .38s infinite alternate; }
    .bulb-glow-3 { animation: bulb-blink 1.1s ease-in-out .75s infinite alternate; }
    .dangling-item {
      transform-box: fill-box; transform-origin: top center;
      animation: sway 3.2s ease-in-out infinite alternate;
    }
    .dangling-item.delay-1 { animation-delay: -.8s; }
    .dangling-item.delay-2 { animation-delay: -1.6s; }
    .dangling-item.delay-3 { animation-delay: -2.3s; }

    .curtain-hint {
      position: absolute; z-index: 6; left: 50%; bottom: 9%;
      transform: translateX(-50%);
      padding: 14px 32px; border-radius: 999px;
      background: rgba(58, 6, 14, .92);
      border: 2px solid rgba(255, 220, 142, .92);
      color: #fff6dc;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(.92rem, 1.8vw, 1.14rem);
      letter-spacing: .04em; white-space: nowrap;
      box-shadow: 0 0 30px rgba(255, 202, 104, .5), inset 0 0 12px rgba(255, 220, 142, .25);
      animation: hint-pulse 1.5s ease-in-out infinite alternate;
    }
    .curtain-stage.open .curtain-hint {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ==================== DÒNG CHỮ MERRY CHRISTMAS & GIÁNG SINH AN LÀNH ==================== */
    .greeting {
      position: absolute; z-index: 10; left: 50%; top: 47%; width: min(94vw, 1080px);
      text-align: center;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: none;
      transition:
        top 1.35s cubic-bezier(.22, .88, .26, 1),
        transform 1.35s cubic-bezier(.22, .88, .26, 1),
        opacity .5s ease;
    }
    .scene.dock-greeting .greeting {
      top: clamp(42px, 7.2vh, 68px);
      transform: translate(-50%, -50%) scale(0.42);
    }
    .greeting h1 {
      margin: 0; color: #fff6df;
      font-family: var(--font-serif);
      font-size: clamp(2.6rem, 7.6vw, 6.4rem);
      font-weight: 700; line-height: 1.04;
      letter-spacing: .03em;
      word-spacing: .22em;
      text-shadow:
        0 3px 0 #b88235,
        0 7px 18px rgba(12, 5, 2, .75),
        0 0 32px rgba(255, 209, 126, .88),
        0 0 85px rgba(255, 180, 91, .52);
      opacity: 0;
      transform: scale(.04) rotate(-6deg);
    }
    .scene.show-title .greeting h1 {
      animation: title-pop-in 1.2s cubic-bezier(.18, .9, .25, 1.2) forwards;
    }

    .greeting p {
      margin: clamp(14px, 2.4vh, 24px) 0 0; color: #fff3d6;
      font-family: var(--font-sans);
      font-size: clamp(1.08rem, 2.5vw, 1.72rem);
      font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      text-shadow:
        0 2px 10px rgba(4, 14, 28, .95),
        0 0 22px rgba(255, 210, 128, .85);
      opacity: 0;
      transform: translateY(24px) scale(.85);
    }
    .scene.show-subtitle .greeting p {
      animation: subtitle-rise-in .95s cubic-bezier(.2, .88, .28, 1.15) forwards;
    }

    /* ==================== NÚT ĐIỀU KHIỂN GÓC DƯỚI ==================== */
    .bottom-controls {
      position: absolute; z-index: 20; bottom: 2.2%; right: 2%; left: 2%;
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity .6s ease;
    }
    .scene.show-subtitle .bottom-controls {
      opacity: 1; pointer-events: auto;
    }
    .controls-group {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    }
    .control-btn {
      padding: 9px 16px; border-radius: 999px;
      background: rgba(11, 34, 54, .86);
      border: 1px solid rgba(255, 222, 148, .62);
      color: #ffefc9;
      font-family: var(--font-sans);
      font-size: 12.5px; font-weight: 600;
      letter-spacing: .03em;
      cursor: pointer; backdrop-filter: blur(6px);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .control-btn:hover {
      background: rgba(22, 58, 88, .96);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 210, 120, .28);
    }
    .control-btn.highlight {
      background: linear-gradient(135deg, rgba(168, 24, 42, .92), rgba(110, 14, 26, .95));
      border-color: #ffd885;
      color: #fff8e6;
    }
    .control-btn.active-360 {
      background: linear-gradient(135deg, rgba(16, 94, 72, .94), rgba(10, 58, 46, .96));
      border-color: #6df7c1;
      color: #eafff6;
    }

    /* ==================== POPUP MỞ LỜI CHÚC TRONG HỘP QUÀ 3D ==================== */
    .wish-modal-backdrop {
      position: fixed; z-index: 50; inset: 0;
      background: rgba(4, 12, 24, .76);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .wish-modal-backdrop.active {
      opacity: 1; visibility: visible;
    }
    .wish-modal {
      position: relative;
      width: min(92vw, 470px);
      padding: 32px 28px 26px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 218, 133, .26), transparent 65%),
        linear-gradient(160deg, #6d0f1c 0%, #430811 55%, #2a060d 100%);
      border: 2px solid #f5ca72;
      box-shadow: 0 22px 64px rgba(0, 0, 0, .82), 0 0 42px rgba(255, 206, 112, .38);
      text-align: center;
      color: #fff8e8;
      font-family: var(--font-sans);
      transform: scale(.65) translateY(30px);
      transition: transform .4s cubic-bezier(.2, .9, .25, 1.25);
    }
    .wish-modal-backdrop.active .wish-modal {
      transform: scale(1) translateY(0);
    }
    .wish-modal-icon {
      width: 84px; height: 84px; margin: -64px auto 12px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.5));
      animation: modal-gift-pop .7s cubic-bezier(.2, .9, .3, 1.4);
    }
    .wish-modal-badge {
      display: inline-block;
      padding: 5px 16px; border-radius: 999px;
      background: rgba(255, 216, 135, .18);
      border: 1px solid rgba(255, 216, 135, .55);
      color: #ffd984;
      font-family: var(--font-sans);
      font-size: .82rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .wish-modal h3 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3.2vw, 1.82rem);
      font-weight: 700;
      color: #ffe8a8;
      text-shadow: 0 2px 10px rgba(255, 198, 92, .4);
    }
    .wish-modal p {
      margin: 0 0 18px;
      font-family: var(--font-sans);
      font-size: clamp(1rem, 2.2vw, 1.14rem);
      line-height: 1.68;
      font-weight: 400;
      color: #fff6e5;
      word-break: break-word;
    }
    .wish-sender-line {
      margin: -6px 0 20px;
      font-size: .92rem;
      color: #ffd887;
      font-style: italic;
    }
    .wish-close-btn {
      padding: 11px 30px; border-radius: 999px;
      background: linear-gradient(180deg, #ffd97d 0%, #e09f36 100%);
      border: none; color: #3d1205;
      font-family: var(--font-sans);
      font-weight: 700; font-size: .96rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 197, 84, .45);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .wish-close-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 24px rgba(255, 210, 108, .65);
    }

    /* ==================== MODAL TẠO THIỆP & CHIA SẺ LỜI CHÚC RIÊNG ==================== */
    .creator-form {
      display: flex; flex-direction: column; gap: 12px; text-align: left;
      margin-top: 8px;
    }
    .creator-form label {
      font-size: .84rem; font-weight: 600; color: #ffe5a3;
      display: block; margin-bottom: 4px;
    }
    .creator-form input,
    .creator-form textarea {
      width: 100%; padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255, 216, 135, .45);
      background: rgba(20, 4, 8, .65);
      color: #fff8ea;
      font-family: var(--font-sans);
      font-size: .94rem;
      outline: none;
    }
    .creator-form input:focus,
    .creator-form textarea:focus {
      border-color: #ffd97d;
      box-shadow: 0 0 12px rgba(255, 217, 125, .35);
    }
    .creator-actions {
      display: flex; gap: 10px; justify-content: center; margin-top: 10px;
    }
    .secondary-btn {
      padding: 11px 20px; border-radius: 999px;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 220, 148, .45);
      color: #ffefc9;
      font-family: var(--font-sans);
      font-weight: 600; font-size: .92rem;
      cursor: pointer;
    }
    .copy-status {
      font-size: .84rem; color: #7ae582; margin-top: 8px; min-height: 1.2em;
      text-align: center; font-weight: 600;
    }

    /* ==================== KEYFRAMES ==================== */
    @keyframes bulb-blink {
      from { opacity: .45; filter: drop-shadow(0 0 2px currentColor); }
      to { opacity: 1; filter: drop-shadow(0 0 11px currentColor); }
    }
    @keyframes sway {
      from { transform: rotate(-4.5deg); }
      to { transform: rotate(4.5deg); }
    }
    @keyframes hint-pulse {
      from { transform: translateX(-50%) scale(.96); box-shadow: 0 0 18px rgba(255, 202, 104, .3); }
      to { transform: translateX(-50%) scale(1.04); box-shadow: 0 0 32px rgba(255, 214, 128, .65); }
    }
    @keyframes title-pop-in {
      0% { opacity: 0; transform: scale(.04) rotate(-8deg); filter: blur(14px); }
      58% { opacity: 1; transform: scale(1.14) rotate(2deg); filter: blur(0); }
      78% { opacity: 1; transform: scale(.96) rotate(-1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes subtitle-rise-in {
      0% { opacity: 0; transform: translateY(26px) scale(.84); filter: blur(8px); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes modal-gift-pop {
      0% { transform: scale(0) rotate(-18deg); }
      70% { transform: scale(1.15) rotate(6deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @media (max-width: 680px) {
      .greeting { top: 45%; }
      .scene.dock-greeting .greeting {
        top: 52px;
        transform: translate(-50%, -50%) scale(0.46);
      }
      .greeting h1 { font-size: clamp(2.1rem, 9.8vw, 3.8rem); }
      .greeting p { font-size: clamp(.9rem, 3.6vw, 1.18rem); letter-spacing: .12em; }
      .bottom-controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <!-- Ghép trực tiếp đúng tên 2 file nhạc của bạn -->
  <audio id="jingleBellsAudio" loop preload="auto">
    <source src="Jingle Bells with Lyrics  Christmas Songs HD  Christmas Songs and Carols - Christmas Songs and Carols - Love to Sing.mp3" type="audio/mpeg">

  </audio>
  <audio id="hoHoHoAudio" preload="auto">
    <source src="Ho Ho Ho Merry Christmas - Ted Breslin.mp3" type="audio/mpeg">
    <source src="hohoho.mp3" type="audio/mpeg">
  </audio>

  <main class="scene" id="scene" aria-label="Hoạt cảnh Giáng sinh 3D nhiệm màu">
    <!-- ==================== 1. TẤM RÈM MỞ ĐẦU ==================== -->
    <div class="curtain-stage" id="curtainStage" role="button" tabindex="0" aria-label="Nhấn để mở rèm Giáng sinh 3D">
      <div class="curtain-valance" aria-hidden="true">
        <svg class="valance-lights" viewBox="0 0 1200 130" preserveAspectRatio="none">

          <path d="M0 32 Q150 110 300 32 Q450 110 600 32 Q750 110 900 32 Q1050 110 1200 32" fill="none" stroke="#f6cf77" stroke-width="2" stroke-dasharray="6 6" opacity=".7"/>
          <g>
            <circle class="bulb-glow-1" cx="75" cy="48" r="9" fill="#ffeb7a" style="color:#ffeb7a"/>

            <circle class="bulb-glow-2" cx="600" cy="22" r="9" fill="#ffeb7a" style="color:#ffeb7a"/>
            <circle class="bulb-glow-3" cx="675" cy="48" r="9" fill="#63d2ff" style="color:#63d2ff"/>
            <circle class="bulb-glow-1" cx="750" cy="64" r="9" fill="#ff5964" style="color:#ff5964"/>
            <circle class="bulb-glow-2" cx="825" cy="48" r="9" fill="#4cd97b" style="color:#4cd97b"/>

          <g transform="translate(600 48)">
            <circle r="28" fill="none" stroke="#1d7a4c" stroke-width="12"/>
            <circle r="28" fill="none" stroke="#39a86b" stroke-width="6" stroke-dasharray="8 9"/>
            <path d="M-10-20 C-20-32 -28-16 -7-14 C7-16 20-32 10-20 Z" fill="#ff4757"/>

          <g transform="translate(900 48)">

        </svg>
      </div>

      <!-- Cánh rèm bên trái -->
      <div class="curtain-panel left" aria-hidden="true">
        <svg class="curtain-ornaments" viewBox="0 0 500 800" preserveAspectRatio="xMidYMid slice">
          <path d="M0 95 Q250 185 500 105" fill="none" stroke="#f3c76b" stroke-width="3" stroke-dasharray="8 6" opacity=".65"/>
          <path d="M0 290 Q240 390 500 300" fill="none" stroke="#f3c76b" stroke-width="2.5" stroke-dasharray="6 8" opacity=".45"/>

          <g class="dangling-item" transform="translate(245 215)">
            <line x1="0" y1="-155" x2="0" y2="-65" stroke="#f5cb76" stroke-width="3"/>
            <circle r="66" fill="none" stroke="#0f5f3c" stroke-width="28"/>

            <circle r="66" fill="none" stroke="#53bf82" stroke-width="6" stroke-dasharray="5 18"/>
            <circle cx="-46" cy="-42" r="7" fill="#ff4757"/><circle cx="48" cy="-38" r="7" fill="#ffd36b"/>
            <circle cx="-58" cy="14" r="7" fill="#ffd36b"/><circle cx="56" cy="20" r="7" fill="#ff4757"/>
            <circle cx="-26" cy="58" r="7" fill="#63d2ff"/><circle cx="28" cy="56" r="7" fill="#ff4757"/>
            <circle cx="0" cy="-66" r="7" fill="#ffeb7a"/><circle cx="0" cy="66" r="7" fill="#4cd97b"/>
            <path d="M-14 0 L-8 -22 L8 -22 L14 0 Z" fill="#ffd56b" stroke="#b57c1e" stroke-width="2"/>

  <script>
    (() => {
      const sceneEl = document.getElementById('scene');
      const webglContainer = document.getElementById('webgl-container');
      const snowWhiteout = document.getElementById('snowWhiteout');
      const curtainStage = document.getElementById('curtainStage');
      const curtainHint = document.getElementById('curtainHint');
      const replayBtn = document.getElementById('replayBtn');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const cameraViewBtn = document.getElementById('cameraViewBtn');
      const createCardBtn = document.getElementById('createCardBtn');
      const greetingSubtitle = document.getElementById('greetingSubtitle');

      const wishModalBackdrop = document.getElementById('wishModalBackdrop');
      const wishModalBadge = document.getElementById('wishModalBadge');
      const wishModalTitle = document.getElementById('wishModalTitle');
      const wishModalText = document.getElementById('wishModalText');
      const wishSenderLine = document.getElementById('wishSenderLine');
      const wishModalIcon = document.getElementById('wishModalIcon');
      const wishCloseBtn = document.getElementById('wishCloseBtn');

      const creatorModalBackdrop = document.getElementById('creatorModalBackdrop');
      const inputReceiver = document.getElementById('inputReceiver');
      const inputSender = document.getElementById('inputSender');
      const inputCustomWish = document.getElementById('inputCustomWish');
      const copyStatusText = document.getElementById('copyStatusText');
      const creatorCloseBtn = document.getElementById('creatorCloseBtn');
      const copyShareLinkBtn = document.getElementById('copyShareLinkBtn');

      const jingleBellsAudio = document.getElementById('jingleBellsAudio');
      const hoHoHoAudio = document.getElementById('hoHoHoAudio');

      let isCurtainOpened = false;
      let isMuted = false;
      let timers = [];

      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeOutBack = (t) => {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      };
      const smoothstep = (min, max, value) => {
        const x = clamp((value - min) / (max - min), 0, 1);
        return x * x * (3 - 2 * x);
      };

      /* ==================== BẢO MẬT NHÓM 10 & DỮ LIỆU THIỆP ==================== */
      function sanitizeText(str, maxLen = 240) {
        if (typeof str !== 'string') return '';
        return str.replace(/[\u0000-\u001F\u007F<>]/g, '').trim().slice(0, maxLen);
      }

      const urlParams = new URLSearchParams(window.location.search);
      const customCardData = {
        to: sanitizeText(urlParams.get('to') || '', 45),
        from: sanitizeText(urlParams.get('from') || '', 45),
        msg: sanitizeText(urlParams.get('msg') || '', 240)
      };
      if (customCardData.to) {
        greetingSubtitle.textContent = `Dành tặng ${customCardData.to} · Giáng sinh an lành`;
      }

      /* ==================== HỆ THỐNG ÂM THANH (2 FILE NHẠC + WEB AUDIO DỰ PHÒNG) ==================== */
      let audioCtx = null;
      let jingleLoopTimer = null;
      let sleighBellTimer = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSleighBellShake(duration = 0.14, volume = 0.08) {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const now = ctxAudio.currentTime;
        const bufferSize = Math.floor(ctxAudio.sampleRate * duration);
        const buffer = ctxAudio.createBuffer(1, bufferSize, ctxAudio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.32));
        }

        const noise = ctxAudio.createBufferSource();
        noise.buffer = buffer;

        const filter = ctxAudio.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4800, now);
        filter.Q.setValueAtTime(3.5, now);

        const gain = ctxAudio.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctxAudio.destination);
        noise.start(now);

        [2637, 3520].forEach((freq) => {
          const osc = ctxAudio.createOscillator();
          const bellGain = ctxAudio.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          bellGain.gain.setValueAtTime(volume * 0.35, now);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(bellGain);
          bellGain.connect(ctxAudio.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function playChimeNote(freq, startTime, duration, vol = 0.16) {
        if (isMuted || !audioCtx) return;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.setValueAtTime(0.3, startTime);

        osc1.connect(gain);
        osc2.connect(osc2Gain);
        osc2Gain.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.04);
        osc2.stop(startTime + duration + 0.04);
      }

      const NOTES = {
        C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
      };

      const JINGLE_BELLS_MELODY = [
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['E5', 'D4', 1], ['D5', null, 1], ['D5', 'A4', 1], ['E5', null, 1], ['D5', 'G4', 2], ['G5', 'B4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['G5', 'G4', 1], ['G5', null, 1], ['F5', 'B4', 1], ['D5', null, 1], ['C5', 'C4', 4]
      ];

      function startSynthesizedJingleBells() {
        stopSynthesizedJingleBells();
        if (document.hidden) return;
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const beatSec = 0.24;
        function scheduleSongLoop() {
          if (isMuted || document.hidden) return;
          let cursor = ctxAudio.currentTime + 0.05;
          let totalBeats = 0;

          JINGLE_BELLS_MELODY.forEach(([melodyNote, bassNote, beats]) => {
            const dur = beats * beatSec;
            if (melodyNote && NOTES[melodyNote]) {
              playChimeNote(NOTES[melodyNote], cursor, dur * 0.92, 0.14);
            }
            if (bassNote && NOTES[bassNote]) {
              playChimeNote(NOTES[bassNote], cursor, dur * 1.1, 0.08);
            }
            cursor += dur;
            totalBeats += beats;
          });

          jingleLoopTimer = setTimeout(scheduleSongLoop, totalBeats * beatSec * 1000);
        }

        scheduleSongLoop();
        sleighBellTimer = setInterval(() => {
          if (!isMuted && !document.hidden) playSleighBellShake(0.11, 0.045);
        }, beatSec * 1000);
      }

      function stopSynthesizedJingleBells() {

      function playSynthesizedHoHoHo() {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();

        [0, 180, 360, 540, 720, 900].forEach((delay) => {
          setTimeout(() => playSleighBellShake(0.16, 0.09), delay);
        });

        if (ctxAudio) {
          const hoPitches = [135, 128, 118];
          hoPitches.forEach((baseFreq, idx) => {
            const start = ctxAudio.currentTime + 0.1 + idx * 0.42;
            const dur = 0.32;

            const osc = ctxAudio.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq * 1.08, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.86, start + dur);

            const formant1 = ctxAudio.createBiquadFilter();
            formant1.type = 'bandpass';
            formant1.frequency.setValueAtTime(460, start);
            formant1.Q.setValueAtTime(4.5, start);

            const formant2 = ctxAudio.createBiquadFilter();
            formant2.type = 'bandpass';
            formant2.frequency.setValueAtTime(820, start);
            formant2.Q.setValueAtTime(5, start);

            const voiceGain = ctxAudio.createGain();
            voiceGain.gain.setValueAtTime(0.001, start);
            voiceGain.gain.linearRampToValueAtTime(0.28, start + 0.05);
            voiceGain.gain.exponentialRampToValueAtTime(0.002, start + dur);

            osc.connect(formant1);
            osc.connect(formant2);
            formant1.connect(voiceGain);
            formant2.connect(voiceGain);
            voiceGain.connect(ctxAudio.destination);

            osc.start(start);
            osc.stop(start + dur + 0.02);
          });
        }

        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance('Ho! Ho! Ho! Merry Christmas!');
            utter.lang = 'en-US';
            utter.pitch = 0.35;
            utter.rate = 0.78;
            utter.volume = 1;
            window.speechSynthesis.speak(utter);
          } catch (_) {}
        }
      }

      /* ==================== CÁNH CỔNG KHÔNG GIAN 3D (MAGIC DIMENSIONAL PORTAL) ==================== */
      function createPortalVortexTexture() {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = size;
        cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const R = size * 0.48;

        const baseGrad = c.createRadialGradient(cx, cy, 4, cx, cy, R);
        baseGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        baseGrad.addColorStop(0.18, 'rgba(255, 238, 158, 0.95)');
        baseGrad.addColorStop(0.42, 'rgba(72, 235, 255, 0.85)');
        baseGrad.addColorStop(0.68, 'rgba(138, 82, 255, 0.65)');
        baseGrad.addColorStop(0.88, 'rgba(255, 180, 72, 0.42)');
        baseGrad.addColorStop(1, 'rgba(20, 60, 120, 0)');
        c.fillStyle = baseGrad;
        c.beginPath();
        c.arc(cx, cy, R, 0, Math.PI * 2);
        c.fill();

        c.save();
        c.translate(cx, cy);
        for (let arm = 0; arm < 12; arm++) {
          c.save();
          c.rotate((arm * Math.PI * 2) / 12);
          c.strokeStyle = arm % 2 === 0 ? 'rgba(255, 240, 175, 0.72)' : 'rgba(120, 245, 255, 0.65)';
          c.lineWidth = 4.5;
          c.beginPath();
          for (let r = 8; r < R * 0.92; r += 6) {
            const a = r * 0.018;
            const px = Math.cos(a) * r;
            const py = Math.sin(a) * r;
            if (r === 8) c.moveTo(px, py);
            else c.lineTo(px, py);
          }
          c.stroke();
          c.restore();
        }

        c.strokeStyle = 'rgba(255, 230, 140, 0.9)';
        c.lineWidth = 3.5;
        c.setLineDash([12, 8, 4, 8]);
        c.beginPath();
        c.arc(0, 0, R * 0.82, 0, Math.PI * 2);
        c.stroke();

        c.strokeStyle = 'rgba(140, 250, 255, 0.85)';
        c.lineWidth = 2.5;
        c.setLineDash([6, 10]);
        c.beginPath();
        c.arc(0, 0, R * 0.64, 0, Math.PI * 2);
        c.stroke();
        c.restore();

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      /* ==================== MẶT TRĂNG 3D SẮC NÉT, TƯƠNG PHẢN CAO & KHÔNG BỊ CỰC QUANG CHE ==================== */
      function createRealisticLunarTexture() {

        const baseGrad = c.createLinearGradient(0, 0, 0, h);
        baseGrad.addColorStop(0, '#fff7dc');
        baseGrad.addColorStop(0.5, '#f7e5b4');
        baseGrad.addColorStop(1, '#e8ce92');
        c.fillStyle = baseGrad;
        c.fillRect(0, 0, w, h);

        // Các vùng biển trăng (Lunar Maria) có độ tương phản đậm rõ để nhìn từ xa vẫn thấy hình dáng mặt trăng
        const mariaSpots = [
          { x: 145, y: 92,  rx: 72, ry: 46, alpha: 0.36 },
          { x: 215, y: 128, rx: 58, ry: 42, alpha: 0.32 },
          { x: 290, y: 86,  rx: 52, ry: 38, alpha: 0.34 },
          { x: 350, y: 142, rx: 64, ry: 48, alpha: 0.28 },
          { x: 175, y: 168, rx: 44, ry: 32, alpha: 0.25 },
          { x: 92,  y: 142, rx: 40, ry: 28, alpha: 0.26 }
        ];
        mariaSpots.forEach((m) => {
          const g = c.createRadialGradient(m.x, m.y, 4, m.x, m.y, m.rx);
          g.addColorStop(0, `rgba(110, 92, 65, ${m.alpha})`);
          g.addColorStop(0.65, `rgba(130, 110, 78, ${m.alpha * 0.65})`);
          g.addColorStop(1, 'rgba(130, 110, 78, 0)');
          c.fillStyle = g;
          c.beginPath();
          c.ellipse(m.x, m.y, m.rx, m.ry, 0.2, 0, Math.PI * 2);

        // Các miệng hố thiên thạch (Lunar Craters) sắc nét
        for (let i = 0; i < 75; i++) {

          c.strokeStyle = 'rgba(255, 252, 232, 0.62)';
          c.lineWidth = r > 9 ? 2.4 : 1.3;
          c.beginPath();
          c.arc(cx, cy, r, 0, Math.PI * 2);
          c.stroke();

          const cg = c.createRadialGradient(cx - r * 0.25, cy - r * 0.25, 1, cx, cy, r);
          cg.addColorStop(0, 'rgba(115, 96, 68, 0.34)');
          cg.addColorStop(0.78, 'rgba(98, 82, 56, 0.38)');
          cg.addColorStop(1, 'rgba(255, 248, 220, 0.22)');
          c.fillStyle = cg;
          c.beginPath();
          c.arc(cx, cy, r, 0, Math.PI * 2);
          c.fill();
        }

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      /* ==================== CỰC QUANG TOÀN BẦU TRỜI DỊU MẮT & TRÁNH HOÀN TOÀN VÙNG MẶT TRĂNG ==================== */
      function createFullSkyAuroraDomeTexture() {
        const w = 1024;
        const h = 512;
        const cvs = document.createElement('canvas');
        cvs.width = w;
        cvs.height = h;
        const c = cvs.getContext('2d');

        c.clearRect(0, 0, w, h);

        // Nền hào quang dịu nhẹ bao phủ bầu trời 360 độ
        const skyGlow = c.createLinearGradient(0, 0, 0, h * 0.72);
        skyGlow.addColorStop(0, 'rgba(110, 70, 225, 0.18)');
        skyGlow.addColorStop(0.3, 'rgba(38, 205, 200, 0.22)');
        skyGlow.addColorStop(0.6, 'rgba(35, 235, 155, 0.24)');
        skyGlow.addColorStop(0.88, 'rgba(20, 160, 130, 0.08)');
        skyGlow.addColorStop(1, 'rgba(10, 40, 70, 0)');
        c.fillStyle = skyGlow;
        c.fillRect(0, 0, w, h);

        // Các dải sóng cực quang mềm mại chạy quanh 360 độ
        c.globalCompositeOperation = 'lighter';
        for (let band = 0; band < 5; band++) {
          c.beginPath();
          const baseY = 60 + band * 54;
          for (let x = 0; x <= w; x += 8) {
            const u = (x / w) * Math.PI * 2;
            const y =
              baseY +
              Math.sin(u * (2 + (band % 3)) + band * 1.3) * 26 +
              Math.cos(u * 5 - band) * 12;
            if (x === 0) c.moveTo(x, y);
            else c.lineTo(x, y);
          }
          c.strokeStyle =
            band % 2 === 0
              ? 'rgba(50, 240, 170, 0.20)'
              : 'rgba(85, 195, 245, 0.18)';
          c.lineWidth = 28;
          c.stroke();
        }

        for (let i = 0; i < 160; i++) {
          const rx = (i / 160) * w + rand(-4, 4);
          const rw = rand(3, 10);
          const topY = rand(15, 160);
          const botY = topY + rand(80, 190);
          const g = c.createLinearGradient(0, botY, 0, topY);
          const alpha = rand(0.05, 0.15);
          g.addColorStop(0, 'rgba(40, 245, 165, 0)');
          g.addColorStop(0.35, `rgba(55, 245, 185, ${alpha})`);
          g.addColorStop(0.7, `rgba(80, 210, 250, ${alpha * 0.8})`);
          g.addColorStop(1, 'rgba(175, 105, 245, 0)');
          c.fillStyle = g;
          c.fillRect(rx, topY, rw, botY - topY);
        }

        const tex = new THREE.CanvasTexture(cvs);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.needsUpdate = true;
        return tex;
      }

      // Texture rèm cực quang có tích hợp "Cửa Sổ Trời Quang" (Moon Cutout) để không làm mờ Mặt trăng
      function createAuroraCurtainTexture(paletteType = 0, cutoutMoonRight = false) {
        const w = 512;
        const h = 256;
        const cvs = document.createElement('canvas');
        cvs.width = w;
        cvs.height = h;
        const c = cvs.getContext('2d');

        const baseGrad = c.createLinearGradient(0, h, 0, 0);
        if (paletteType === 0) {
          baseGrad.addColorStop(0, 'rgba(30, 245, 155, 0)');
          baseGrad.addColorStop(0.2, 'rgba(42, 245, 170, 0.52)');
          baseGrad.addColorStop(0.5, 'rgba(55, 215, 245, 0.38)');
          baseGrad.addColorStop(0.8, 'rgba(155, 90, 245, 0.22)');
          baseGrad.addColorStop(1, 'rgba(155, 90, 245, 0)');
        } else if (paletteType === 1) {
          baseGrad.addColorStop(0, 'rgba(45, 235, 210, 0)');
          baseGrad.addColorStop(0.22, 'rgba(50, 245, 205, 0.48)');
          baseGrad.addColorStop(0.55, 'rgba(105, 170, 245, 0.34)');
          baseGrad.addColorStop(0.85, 'rgba(215, 90, 210, 0.20)');
          baseGrad.addColorStop(1, 'rgba(215, 90, 210, 0)');
        } else {
          baseGrad.addColorStop(0, 'rgba(75, 245, 145, 0)');
          baseGrad.addColorStop(0.22, 'rgba(90, 245, 160, 0.46)');
          baseGrad.addColorStop(0.62, 'rgba(40, 205, 190, 0.28)');
          baseGrad.addColorStop(1, 'rgba(40, 205, 190, 0)');
        }
        c.fillStyle = baseGrad;
        c.fillRect(0, 0, w, h);

        c.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 90; i++) {
          const rx = rand(0, w);
          const rw = rand(2, 8);
          const rayAlpha = rand(0.10, 0.28);
          const rayGrad = c.createLinearGradient(0, h * 0.92, 0, h * 0.08);
          rayGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
          rayGrad.addColorStop(0.28, `rgba(150, 250, 215, ${rayAlpha})`);
          rayGrad.addColorStop(0.68, `rgba(115, 215, 250, ${rayAlpha * 0.6})`);
          rayGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          c.fillStyle = rayGrad;
          c.fillRect(rx, 0, rw, h);
        }

        // Làm mềm hai đầu dải lụa
        c.globalCompositeOperation = 'destination-in';
        const edgeMask = c.createLinearGradient(0, 0, w, 0);
        edgeMask.addColorStop(0, 'rgba(0, 0, 0, 0)');
        edgeMask.addColorStop(0.08, 'rgba(0, 0, 0, 1)');
        edgeMask.addColorStop(0.92, 'rgba(0, 0, 0, 1)');
        edgeMask.addColorStop(1, 'rgba(0, 0, 0, 0)');
        c.fillStyle = edgeMask;
        c.fillRect(0, 0, w, h);

        // Khoét khoảng trời trong trẻo tại khu vực Mặt trăng đứng để Mặt trăng luôn tỏa sáng rõ nét
        if (cutoutMoonRight) {
          c.globalCompositeOperation = 'destination-out';
          const clearGrad = c.createRadialGradient(w * 0.61, h * 0.55, 18, w * 0.61, h * 0.55, 92);
          clearGrad.addColorStop(0, 'rgba(0, 0, 0, 0.95)');
          clearGrad.addColorStop(0.55, 'rgba(0, 0, 0, 0.65)');
          clearGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          c.fillStyle = clearGrad;
          c.beginPath();
          c.arc(w * 0.61, h * 0.55, 92, 0, Math.PI * 2);
          c.fill();
        }

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      // 8 Dải lụa Cực quang bao quanh 360 độ bầu trời, lùi sâu ra xa (z = -185..-215) và có khoảng trống nhường chỗ cho Mặt trăng
      const auroraLayers = [];

        { width: 480, height: 76, x: 0,   y: 136, z: -160, rotX: 0.65, rotY: 0.05,      speed: 0.82, amp: 15.5, texIdx: 2, opacity: 0.34 },
        // Hai bên Đông - Tây và phía Nam (để khi xoay 360 độ nhìn hướng nào cũng có cực quang)
        { width: 460, height: 64, x: -195,y: 54,  z: 0,    rotX: 0.14, rotY: Math.PI/2, speed: 1.24, amp: 12.0, texIdx: 2, opacity: 0.38 },
        { width: 460, height: 64, x: 195, y: 54,  z: 0,    rotX: 0.14, rotY: -Math.PI/2,speed: 1.16, amp: 12.0, texIdx: 1, opacity: 0.38 },
        { width: 520, height: 68, x: 0,   y: 52,  z: 195,  rotX: -0.14,rotY: Math.PI,   speed: 1.04, amp: 13.5, texIdx: 2, opacity: 0.38 }

      auroraConfigs.forEach((cfg, idx) => {

        const mesh = new THREE.Mesh(geo, mat);

      /* ==================== 800 CHẤM NHỎ NGÔI SAO PHÁT SÁNG TRÊN BẦU TRỜI 360 ĐỘ ==================== */
      function createGlowingStarDotTexture() {
        const size = 64;
        const cvs = document.createElement('canvas');
        cvs.width = size;
        cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;

        const glow = c.createRadialGradient(cx, cy, 1, cx, cy, 30);
        glow.addColorStop(0, 'rgba(255, 255, 255, 1)');
        glow.addColorStop(0.18, 'rgba(255, 250, 220, 0.95)');
        glow.addColorStop(0.42, 'rgba(200, 235, 255, 0.45)');
        glow.addColorStop(0.75, 'rgba(160, 215, 255, 0.12)');
        glow.addColorStop(1, 'rgba(160, 215, 255, 0)');
        c.fillStyle = glow;
        c.beginPath();
        c.arc(cx, cy, 30, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(cx, cy, 4.2, 0, Math.PI * 2);
        c.fill();

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      const glowingStarTex = createGlowingStarDotTexture();
      const totalStarCount = 800; // Đúng 800 ngôi sao phát sáng phân bổ khắp vòm trời 360 độ
      const groupStarCount = totalStarCount / 2;

      function createStarGroup(count, size, colorHex) {
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          // Phân bố đều trên vòm cầu 360 độ để xoay góc nào cũng thấy sao phát sáng
          const theta = rand(0, Math.PI * 2);
          const phi = rand(0.06, Math.PI * 0.46);
          const radius = rand(155, 310);
          positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
          positions[i * 3 + 1] = radius * Math.cos(phi) + 4;
          positions[i * 3 + 2] = radius * Math.sin(phi) * Math.sin(theta);
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
          color: colorHex,
          size: size,
          map: glowingStarTex,
          transparent: true,
          opacity: 0.95,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        });
        return { points: new THREE.Points(geo, mat), mat };
      }

      const starLayerA = createStarGroup(groupStarCount, 2.5, 0xfff8df);

      // Các dãy đồi tuyết bao quanh 4 phía (Đông, Tây, Nam, Bắc) phục vụ góc nhìn 360 độ
      [

      /* ==================== TEXTURE TINH THỂ BĂNG (DENDRITIC ICE CRYSTAL) ==================== */
      function createIceCrystalTexture(variant = 0) {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = size;
        cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const R = size * 0.42;

        c.clearRect(0, 0, size, size);

        const glowGrad = c.createRadialGradient(cx, cy, 4, cx, cy, R * 1.08);
        glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        glowGrad.addColorStop(0.28, 'rgba(210, 244, 255, 0.32)');
        glowGrad.addColorStop(0.65, 'rgba(165, 225, 255, 0.10)');
        glowGrad.addColorStop(1, 'rgba(165, 225, 255, 0)');
        c.fillStyle = glowGrad;
        c.beginPath();
        c.arc(cx, cy, R * 1.08, 0, Math.PI * 2);
        c.fill();

        c.save();
        c.translate(cx, cy);
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.shadowColor = 'rgba(195, 240, 255, 0.95)';
        c.shadowBlur = 14;

        for (let arm = 0; arm < 6; arm++) {
          c.save();
          c.rotate((arm * Math.PI) / 3);

          const mainGrad = c.createLinearGradient(0, 0, 0, -R);
          mainGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          mainGrad.addColorStop(0.7, 'rgba(235, 250, 255, 0.96)');
          mainGrad.addColorStop(1, 'rgba(195, 238, 255, 0.85)');

          c.strokeStyle = mainGrad;
          c.lineWidth = 7.5;
          c.beginPath();
          c.moveTo(0, 0);
          c.lineTo(0, -R);
          c.stroke();

          const branchSpecs = variant === 0
            ? [
                { pos: 0.28, len: 0.24, w: 5.0, sub: true },
                { pos: 0.50, len: 0.34, w: 5.2, sub: true },
                { pos: 0.70, len: 0.25, w: 4.4, sub: false },
                { pos: 0.86, len: 0.14, w: 3.6, sub: false }
              ]
            : variant === 1
            ? [
                { pos: 0.34, len: 0.30, w: 5.2, sub: true },
                { pos: 0.58, len: 0.28, w: 4.6, sub: true },
                { pos: 0.78, len: 0.18, w: 3.8, sub: false }
              ]
            : [
                { pos: 0.24, len: 0.20, w: 4.6, sub: false },
                { pos: 0.44, len: 0.35, w: 5.5, sub: true },
                { pos: 0.64, len: 0.26, w: 4.5, sub: true },
                { pos: 0.82, len: 0.16, w: 3.6, sub: false }
              ];

          branchSpecs.forEach((b) => {
            const y0 = -R * b.pos;
            const bLen = R * b.len;
            const angle = Math.PI / 3;
            const dx = Math.sin(angle) * bLen;
            const dy = -Math.cos(angle) * bLen;

            c.lineWidth = b.w;
            [-1, 1].forEach((side) => {
              c.beginPath();
              c.moveTo(0, y0);
              c.lineTo(side * dx, y0 + dy);
              c.stroke();

              if (b.sub) {
                const mx = side * dx * 0.58;
                const my = y0 + dy * 0.58;
                const twigLen = bLen * 0.42;
                c.lineWidth = b.w * 0.62;
                c.beginPath();
                c.moveTo(mx, my);
                c.lineTo(mx + side * twigLen * 0.35, my - twigLen * 0.92);
                c.stroke();
                c.lineWidth = b.w;
              }
            });
          });

          c.fillStyle = 'rgba(255, 255, 255, 0.96)';
          c.beginPath();
          c.moveTo(0, -R - 10);
          c.lineTo(8, -R + 6);
          c.lineTo(0, -R + 20);
          c.lineTo(-8, -R + 6);
          c.closePath();
          c.fill();

          c.restore();
        }

        [0.16, 0.29].forEach((hexRatio, idx) => {
          const hr = R * hexRatio;
          c.lineWidth = idx === 0 ? 5 : 3.2;
          c.strokeStyle = 'rgba(245, 253, 255, 0.92)';
          c.fillStyle = idx === 0 ? 'rgba(230, 248, 255, 0.35)' : 'rgba(210, 242, 255, 0.14)';
          c.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3 + (idx === 1 ? Math.PI / 6 : 0);
            const hx = Math.cos(a) * hr;
            const hy = Math.sin(a) * hr;
            if (i === 0) c.moveTo(hx, hy);
            else c.lineTo(hx, hy);
          }
          c.closePath();
          c.fill();
          c.stroke();
        });

        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(0, 0, 8, 0, Math.PI * 2);
        c.fill();

        c.restore();

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      function createScallopedPineGeometry(radius, height, lobes = 14) {
        const radialSegs = lobes * 6;
        const heightSegs = 12;
        const geo = new THREE.ConeGeometry(radius, height, radialSegs, heightSegs, false);
        const pos = geo.attributes.position;
        const halfH = height / 2;

        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);

          const t = clamp((halfH - y) / height, 0, 1);
          if (t > 0.04) {
            const angle = Math.atan2(z, x);
            const lobeWave = Math.cos(angle * lobes);
            const secondaryWave = Math.sin(angle * lobes * 2) * 0.25;

            const rFactor = 1 + (lobeWave * 0.16 + secondaryWave * 0.05) * Math.pow(t, 0.85);
            const flare = 1 + 0.08 * Math.pow(t, 1.6);

            x *= rFactor * flare;
            z *= rFactor * flare;

            if (y > -halfH + 0.05) {
              y -= Math.max(0, lobeWave) * 0.42 * Math.pow(t, 1.3);
            } else {
              y -= lobeWave * 0.32;
            }
          }
          pos.setXYZ(i, x, y, z);
        }

        geo.computeVertexNormals();
        return geo;
      }

      function createSnowDrapeRing(radius, lobes = 14, tubeRadius = 0.34) {
        const pts = [];
        const steps = lobes * 8;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const angle = u * Math.PI * 2;
          const lobeWave = Math.cos(angle * lobes);
          const r = radius * (0.95 + lobeWave * 0.14);
          const y = -lobeWave * 0.28;
          pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
        }
        const curve = new THREE.CatmullRomCurve3(pts, true);
        return new THREE.TubeGeometry(curve, steps, tubeRadius, 8, true);
      }

      function animateRigReindeers(rig, timeSec) {
        if (!rig) return;
        if (rig.userData.wavingArm) {
          rig.userData.wavingArm.rotation.z = Math.sin(timeSec * 6.5) * 0.28;
        }
        if (!rig.userData.reindeers) return;
        rig.userData.reindeers.forEach((deer) => {
          const offset = deer.userData.phaseOffset || 0;
          deer.position.y = 0.35 + Math.sin(timeSec * 9.5 + offset) * 0.26;
          deer.rotation.x = Math.cos(timeSec * 9.5 + offset) * 0.09;
          if (deer.userData.headGroup) {
            deer.userData.headGroup.rotation.x = Math.sin(timeSec * 9.5 + offset + 0.5) * 0.1;
          }
          deer.userData.legs.forEach((leg) => {
            const s = Math.sin(timeSec * 14 + leg.phase + offset);
            leg.pivot.rotation.x = s * 0.68;
            if (leg.knee) {
              leg.knee.rotation.x = leg.isFront ? Math.max(0, s) * 0.65 : -Math.max(0, -s) * 0.55;
            }
          });
        });
      }

      orbitSanta3D.visible = false;
      scene3D.add(orbitSanta3D);

      const trailCount = 160;
      const trailGeo = new THREE.BufferGeometry();
      const trailPos = new Float32Array(trailCount * 3);
      const trailData = [];
      for (let i = 0; i < trailCount; i++) {
        trailPos[i * 3] = 0;
        trailPos[i * 3 + 1] = -999;
        trailPos[i * 3 + 2] = 0;
        trailData.push({ vx: 0, vy: 0, vz: 0, life: 0 });
      }
      trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
      const trailPoints = new THREE.Points(
        trailGeo,
        new THREE.PointsMaterial({
          color: 0xffe27a,
          size: 1.5,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      scene3D.add(trailPoints);
      let trailCursor = 0;

      function emitSleighTrail(worldPos) {
        const attr = trailPoints.geometry.attributes.position;
        for (let k = 0; k < 2; k++) {
          const idx = trailCursor % trailCount;
          trailCursor++;
          attr.setXYZ(
            idx,
            worldPos.x + rand(-1.8, 1.8),
            worldPos.y + rand(0.5, 2.8),
            worldPos.z + rand(-3.5, -1.5)
          );
          trailData[idx].vx = rand(-1.5, 1.5);
          trailData[idx].vy = rand(-1.8, 0.8);
          trailData[idx].vz = rand(-1.5, 1.5);
          trailData[idx].life = 1.0;
        }
        attr.needsUpdate = true;
      }

      const skyReindeers3D = [];
      for (let i = 0; i < 4; i++) {
        const deer = createReindeer3D();
        const dir = i % 2 === 0 ? 1 : -1;
        deer.scale.setScalar(0.62);
        deer.rotation.y = dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        deer.position.set(dir > 0 ? -90 - i * 25 : 90 + i * 25, 22 + i * 5.5, -35 - i * 12);
        deer.userData.dir = dir;
        deer.userData.speed = 14 + i * 2.2;
        deer.userData.baseY = deer.position.y;
        deer.userData.phase = rand(0, Math.PI * 2);
        scene3D.add(deer);
        skyReindeers3D.push(deer);
      }

        const softLayerMat = new THREE.MeshBasicMaterial({
          map: tex,
