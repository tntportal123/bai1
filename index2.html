<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Merry Christmas 3D · Giáng sinh an lành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  <!-- Thư viện 3D Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --night: #061226;
      --gold: #ffd887;
      --cream: #fff7e8;
      --red: #d94850;
      --green: #0c573f;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: var(--font-sans);
      background: var(--night); color: var(--cream);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .scene {
      position: relative;
      width: 100%; height: 100%;
      overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 30%, rgba(36, 78, 135, .38), transparent 60%),
        linear-gradient(180deg, #040b18 0%, #0a1b36 52%, #0f2c47 82%, #0a2032 100%);
    }

    /* Canvas 3D Three.js */
    #webgl-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
    }
    #webgl-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Lớp phủ sương tuyết trắng xóa khoảnh khắc bông tuyết khổng lồ che kín ống kính */
    .snow-whiteout {
      position: absolute;
      z-index: 8;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(240, 250, 255, .92) 0%, rgba(215, 240, 255, .78) 55%, rgba(190, 228, 250, .55) 100%);
      opacity: 0;
      transition: opacity .55s ease;
    }
    .snow-whiteout.active {
      opacity: 1;
    }

    /* ==================== 1. TẤM RÈM NHUNG ĐỎ MỞ ĐẦU ==================== */
    .curtain-stage {
      position: absolute; z-index: 30; inset: 0;
      display: flex; cursor: pointer;
      user-select: none;
      transition: visibility 0s linear 2.2s;
    }
    .curtain-stage.open {
      pointer-events: none;
      visibility: hidden;
    }
    .curtain-valance {
      position: absolute; z-index: 4; top: 0; left: 0; width: 100%;
      height: clamp(56px, 9.5vh, 92px);
      background:
        repeating-linear-gradient(90deg,
          #5c0811 0px, #8f1120 26px, #b81d2f 52px, #8f1120 78px, #5c0811 104px);
      border-bottom: 5px solid #f4c96b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .68), inset 0 -6px 14px rgba(255, 215, 130, .28);
      transition: transform 1.6s cubic-bezier(.65, 0, .25, 1) .15s;
    }
    .curtain-stage.open .curtain-valance {
      transform: translateY(-130%);
    }
    .valance-lights {
      position: absolute; inset: 0; width: 100%; height: 145%; overflow: visible;
    }

    .curtain-panel {
      position: relative; width: 50.5%; height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 100, 100, .14), transparent 65%),
        repeating-linear-gradient(90deg,
          #4b050d 0%, #7d0c19 4.5%, #b51b2c 9%, #830e1c 13.5%, #4b050d 18%);
      box-shadow: inset 0 0 80px rgba(20, 0, 4, .75), 0 0 45px rgba(0, 0, 0, .65);
      transition: transform 2.05s cubic-bezier(.6, .04, .2, 1);
      overflow: hidden;
    }
    .curtain-panel.left {
      transform-origin: left top;
      border-right: 4px solid #f2c76e;
    }
    .curtain-panel.right {
      transform-origin: right top;
      border-left: 4px solid #f2c76e;
    }
    .curtain-stage.open .curtain-panel.left {
      transform: translateX(-96%) rotate(2deg);
    }
    .curtain-stage.open .curtain-panel.right {
      transform: translateX(96%) rotate(-2deg);
    }

    .curtain-ornaments {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .bulb-glow-1 { animation: bulb-blink 1.1s ease-in-out infinite alternate; }
    .bulb-glow-2 { animation: bulb-blink 1.1s ease-in-out .38s infinite alternate; }
    .bulb-glow-3 { animation: bulb-blink 1.1s ease-in-out .75s infinite alternate; }
    .dangling-item {
      transform-box: fill-box; transform-origin: top center;
      animation: sway 3.2s ease-in-out infinite alternate;
    }
    .dangling-item.delay-1 { animation-delay: -.8s; }
    .dangling-item.delay-2 { animation-delay: -1.6s; }
    .dangling-item.delay-3 { animation-delay: -2.3s; }

    .curtain-hint {
      position: absolute; z-index: 6; left: 50%; bottom: 9%;
      transform: translateX(-50%);
      padding: 14px 32px; border-radius: 999px;
      background: rgba(58, 6, 14, .9);
      border: 2px solid rgba(255, 220, 142, .9);
      color: #fff6dc;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: clamp(.92rem, 1.8vw, 1.14rem);
      letter-spacing: .04em; white-space: nowrap;
      box-shadow: 0 0 30px rgba(255, 202, 104, .5), inset 0 0 12px rgba(255, 220, 142, .25);
      animation: hint-pulse 1.5s ease-in-out infinite alternate;
    }
    .curtain-stage.open .curtain-hint {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ==================== DÒNG CHỮ MERRY CHRISTMAS & GIÁNG SINH AN LÀNH ==================== */
    .greeting {
      position: absolute; z-index: 10; left: 50%; top: 47%; width: min(92vw, 1000px);
      text-align: center; transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .greeting h1 {
      margin: 0; color: #fff6df;
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 8.8vw, 7.2rem);
      font-weight: 700; line-height: .96; letter-spacing: .02em;
      text-shadow:
        0 3px 0 #b88235,
        0 7px 18px rgba(12, 5, 2, .75),
        0 0 32px rgba(255, 209, 126, .88),
        0 0 85px rgba(255, 180, 91, .52);
      opacity: 0;
      transform: scale(.04) rotate(-6deg);
    }
    /* Bước 1: Xuất hiện chữ "Merry Christmas" trước */
    .scene.show-title .greeting h1 {
      animation: title-pop-in 1.2s cubic-bezier(.18, .9, .25, 1.2) forwards;
    }

    .greeting p {
      margin: clamp(14px, 2.4vh, 24px) 0 0; color: #fff3d6;
      font-family: var(--font-sans);
      font-size: clamp(1.08rem, 2.5vw, 1.72rem);
      font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
      text-shadow:
        0 2px 10px rgba(4, 14, 28, .95),
        0 0 22px rgba(255, 210, 128, .85);
      opacity: 0;
      transform: translateY(24px) scale(.85);
    }
    /* Bước 2: Tiếp theo xuất hiện chữ "Giáng sinh an lành" bên dưới */
    .scene.show-subtitle .greeting p {
      animation: subtitle-rise-in .95s cubic-bezier(.2, .88, .28, 1.15) forwards;
    }

    /* ==================== POPUP MỞ LỜI CHÚC TRONG HỘP QUÀ 3D ==================== */
    .wish-modal-backdrop {
      position: fixed; z-index: 50; inset: 0;
      background: rgba(4, 12, 24, .74);
      backdrop-filter: blur(7px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .wish-modal-backdrop.active {
      opacity: 1; visibility: visible;
    }
    .wish-modal {
      position: relative;
      width: min(92vw, 460px);
      padding: 32px 28px 26px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 218, 133, .24), transparent 65%),
        linear-gradient(160deg, #6d0f1c 0%, #430811 55%, #2a060d 100%);
      border: 2px solid #f5ca72;
      box-shadow: 0 22px 64px rgba(0, 0, 0, .8), 0 0 42px rgba(255, 206, 112, .38);
      text-align: center;
      color: #fff8e8;
      font-family: var(--font-sans);
      transform: scale(.65) translateY(30px);
      transition: transform .4s cubic-bezier(.2, .9, .25, 1.25);
    }
    .wish-modal-backdrop.active .wish-modal {
      transform: scale(1) translateY(0);
    }
    .wish-modal-icon {
      width: 84px; height: 84px; margin: -64px auto 12px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.5));
      animation: modal-gift-pop .7s cubic-bezier(.2, .9, .3, 1.4);
    }
    .wish-modal-badge {
      display: inline-block;
      padding: 5px 16px; border-radius: 999px;
      background: rgba(255, 216, 135, .18);
      border: 1px solid rgba(255, 216, 135, .55);
      color: #ffd984;
      font-family: var(--font-sans);
      font-size: .82rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .wish-modal h3 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3.2vw, 1.82rem);
      font-weight: 700;
      color: #ffe8a8;
      text-shadow: 0 2px 10px rgba(255, 198, 92, .4);
    }
    .wish-modal p {
      margin: 0 0 22px;
      font-family: var(--font-sans);
      font-size: clamp(1rem, 2.2vw, 1.14rem);
      line-height: 1.68;
      font-weight: 400;
      color: #fff6e5;
    }
    .wish-close-btn {
      padding: 11px 30px; border-radius: 999px;
      background: linear-gradient(180deg, #ffd97d 0%, #e09f36 100%);
      border: none; color: #3d1205;
      font-family: var(--font-sans);
      font-weight: 700; font-size: .96rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 197, 84, .45);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .wish-close-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 24px rgba(255, 210, 108, .65);
    }

    /* ==================== NÚT ĐIỀU KHIỂN GÓC DƯỚI ==================== */
    .bottom-controls {
      position: absolute; z-index: 20; bottom: 2%; right: 2%;
      display: flex; gap: 8px; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity .6s ease;
    }
    .scene.show-subtitle .bottom-controls {
      opacity: 1; pointer-events: auto;
    }
    .control-btn {
      padding: 9px 17px; border-radius: 999px;
      background: rgba(11, 34, 54, .84);
      border: 1px solid rgba(255, 222, 148, .6);
      color: #ffefc9;
      font-family: var(--font-sans);
      font-size: 12.5px; font-weight: 600;
      letter-spacing: .04em;
      cursor: pointer; backdrop-filter: blur(6px);
      transition: transform .2s ease, background .2s ease;
    }
    .control-btn:hover {
      background: rgba(22, 58, 88, .94);
      transform: translateY(-2px);
    }

    /* ==================== KEYFRAMES ==================== */
    @keyframes bulb-blink {
      from { opacity: .45; filter: drop-shadow(0 0 2px currentColor); }
      to { opacity: 1; filter: drop-shadow(0 0 11px currentColor); }
    }
    @keyframes sway {
      from { transform: rotate(-4.5deg); }
      to { transform: rotate(4.5deg); }
    }
    @keyframes hint-pulse {
      from { transform: translateX(-50%) scale(.96); box-shadow: 0 0 18px rgba(255, 202, 104, .3); }
      to { transform: translateX(-50%) scale(1.04); box-shadow: 0 0 32px rgba(255, 214, 128, .65); }
    }
    @keyframes title-pop-in {
      0% { opacity: 0; transform: scale(.04) rotate(-8deg); filter: blur(14px); }
      58% { opacity: 1; transform: scale(1.18) rotate(2deg); filter: blur(0); }
      78% { opacity: 1; transform: scale(.94) rotate(-1deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes subtitle-rise-in {
      0% { opacity: 0; transform: translateY(26px) scale(.84); filter: blur(8px); }
      70% { opacity: 1; transform: translateY(-4px) scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes modal-gift-pop {
      0% { transform: scale(0) rotate(-18deg); }
      70% { transform: scale(1.15) rotate(6deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @media (max-width: 640px) {
      .greeting { top: 45%; }
      .greeting h1 { font-size: clamp(2.4rem, 11.5vw, 4.3rem); }
      .greeting p { font-size: clamp(.92rem, 3.8vw, 1.2rem); letter-spacing: .12em; }
    }
  </style>
</head>
<body>
  <!-- Ghép trực tiếp đúng tên 2 file nhạc của bạn -->

      <!-- Cánh rèm bên trái -->

          <g class="dangling-item delay-2" transform="translate(390 255)">
            <line x1="0" y1="-150" x2="0" y2="-38" stroke="#f5cb76" stroke-width="3"/>

  <script>
    (() => {
      const sceneEl = document.getElementById('scene');
      const webglContainer = document.getElementById('webgl-container');
      const snowWhiteout = document.getElementById('snowWhiteout');
      const curtainStage = document.getElementById('curtainStage');
      const curtainHint = document.getElementById('curtainHint');
      const replayBtn = document.getElementById('replayBtn');
      const soundToggleBtn = document.getElementById('soundToggleBtn');
      const wishModalBackdrop = document.getElementById('wishModalBackdrop');
      const wishModalBadge = document.getElementById('wishModalBadge');
      const wishModalTitle = document.getElementById('wishModalTitle');
      const wishModalText = document.getElementById('wishModalText');
      const wishModalIcon = document.getElementById('wishModalIcon');
      const wishCloseBtn = document.getElementById('wishCloseBtn');

      const jingleBellsAudio = document.getElementById('jingleBellsAudio');
      const hoHoHoAudio = document.getElementById('hoHoHoAudio');

      let isCurtainOpened = false;
      let isMuted = false;
      let timers = [];

      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
      const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      /* ==================== HỆ THỐNG ÂM THANH (2 FILE NHẠC + WEB AUDIO DỰ PHÒNG) ==================== */
      let audioCtx = null;
      let jingleLoopTimer = null;
      let sleighBellTimer = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSleighBellShake(duration = 0.14, volume = 0.08) {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const now = ctxAudio.currentTime;
        const bufferSize = Math.floor(ctxAudio.sampleRate * duration);
        const buffer = ctxAudio.createBuffer(1, bufferSize, ctxAudio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.32));
        }

        const noise = ctxAudio.createBufferSource();
        noise.buffer = buffer;

        const filter = ctxAudio.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4800, now);
        filter.Q.setValueAtTime(3.5, now);

        const gain = ctxAudio.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctxAudio.destination);
        noise.start(now);

        [2637, 3520].forEach((freq) => {
          const osc = ctxAudio.createOscillator();
          const bellGain = ctxAudio.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          bellGain.gain.setValueAtTime(volume * 0.35, now);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(bellGain);
          bellGain.connect(ctxAudio.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function playChimeNote(freq, startTime, duration, vol = 0.16) {
        if (isMuted || !audioCtx) return;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.setValueAtTime(0.3, startTime);

        osc1.connect(gain);
        osc2.connect(osc2Gain);
        osc2Gain.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.04);
        osc2.stop(startTime + duration + 0.04);
      }

      const NOTES = {
        C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
        C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00
      };

      const JINGLE_BELLS_MELODY = [
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['E5', 'D4', 1], ['D5', null, 1], ['D5', 'A4', 1], ['E5', null, 1], ['D5', 'G4', 2], ['G5', 'B4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 2],
        ['E5', 'C4', 1], ['G5', null, 1], ['C5', 'E4', 1.5], ['D5', null, 0.5], ['E5', 'C4', 4],
        ['F5', 'F4', 1], ['F5', null, 1], ['F5', 'A4', 1.5], ['F5', null, 0.5],
        ['F5', 'C4', 1], ['E5', null, 1], ['E5', 'G4', 1], ['E5', null, 0.5], ['E5', null, 0.5],
        ['G5', 'G4', 1], ['G5', null, 1], ['F5', 'B4', 1], ['D5', null, 1], ['C5', 'C4', 4]
      ];

      function startSynthesizedJingleBells() {
        stopSynthesizedJingleBells();
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const beatSec = 0.24;
        function scheduleSongLoop() {
          if (isMuted) return;
          let cursor = ctxAudio.currentTime + 0.05;
          let totalBeats = 0;

          JINGLE_BELLS_MELODY.forEach(([melodyNote, bassNote, beats]) => {
            const dur = beats * beatSec;
            if (melodyNote && NOTES[melodyNote]) {
              playChimeNote(NOTES[melodyNote], cursor, dur * 0.92, 0.14);
            }
            if (bassNote && NOTES[bassNote]) {
              playChimeNote(NOTES[bassNote], cursor, dur * 1.1, 0.08);
            }
            cursor += dur;
            totalBeats += beats;
          });

          jingleLoopTimer = setTimeout(scheduleSongLoop, totalBeats * beatSec * 1000);
        }

        scheduleSongLoop();
        sleighBellTimer = setInterval(() => {
          if (!isMuted) playSleighBellShake(0.11, 0.045);
        }, beatSec * 1000);
      }

      function stopSynthesizedJingleBells() {
        if (jingleLoopTimer) { clearTimeout(jingleLoopTimer); jingleLoopTimer = null; }
        if (sleighBellTimer) { clearInterval(sleighBellTimer); sleighBellTimer = null; }
      }

      function startJingleBellsMusic() {
        jingleBellsAudio.muted = isMuted;
        jingleBellsAudio.currentTime = 0;
        const playPromise = jingleBellsAudio.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            stopSynthesizedJingleBells();
          }).catch(() => {
            startSynthesizedJingleBells();
          });
        } else {
          startSynthesizedJingleBells();
        }
      }

      function stopAllMusic() {
        jingleBellsAudio.pause();
        jingleBellsAudio.currentTime = 0;
        hoHoHoAudio.pause();
        hoHoHoAudio.currentTime = 0;
        stopSynthesizedJingleBells();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      function playSynthesizedHoHoHo() {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();

        [0, 180, 360, 540, 720, 900].forEach((delay) => {
          setTimeout(() => playSleighBellShake(0.16, 0.09), delay);
        });

        if (ctxAudio) {
          const hoPitches = [135, 128, 118];
          hoPitches.forEach((baseFreq, idx) => {
            const start = ctxAudio.currentTime + 0.1 + idx * 0.42;
            const dur = 0.32;

            const osc = ctxAudio.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq * 1.08, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.86, start + dur);

            const formant1 = ctxAudio.createBiquadFilter();
            formant1.type = 'bandpass';
            formant1.frequency.setValueAtTime(460, start);
            formant1.Q.setValueAtTime(4.5, start);

            const formant2 = ctxAudio.createBiquadFilter();
            formant2.type = 'bandpass';
            formant2.frequency.setValueAtTime(820, start);
            formant2.Q.setValueAtTime(5, start);

            const voiceGain = ctxAudio.createGain();
            voiceGain.gain.setValueAtTime(0.001, start);
            voiceGain.gain.linearRampToValueAtTime(0.28, start + 0.05);
            voiceGain.gain.exponentialRampToValueAtTime(0.002, start + dur);

            osc.connect(formant1);
            osc.connect(formant2);
            formant1.connect(voiceGain);
            formant2.connect(voiceGain);
            voiceGain.connect(ctxAudio.destination);

            osc.start(start);
            osc.stop(start + dur + 0.02);
          });
        }

        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance('Ho! Ho! Ho! Merry Christmas!');
            utter.lang = 'en-US';
            utter.pitch = 0.35;
            utter.rate = 0.78;
            utter.volume = 1;
            window.speechSynthesis.speak(utter);
          } catch (_) {}
        }
      }

      function playSantaHoHoHoSound() {
        if (isMuted) return;
        hoHoHoAudio.muted = isMuted;
        hoHoHoAudio.currentTime = 0;
        const playPromise = hoHoHoAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playSynthesizedHoHoHo();
          });
        } else {
          playSynthesizedHoHoHo();
        }
      }

      soundToggleBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        jingleBellsAudio.muted = isMuted;
        hoHoHoAudio.muted = isMuted;
        soundToggleBtn.textContent = isMuted ? '🔇 Bật nhạc' : '🔊 Tắt nhạc';
        if (isMuted) {
          stopSynthesizedJingleBells();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } else if (isCurtainOpened && jingleBellsAudio.paused) {
          startSynthesizedJingleBells();
        }
      });

      /* ==================== 15 LỜI CHÚC GIÁNG SINH NGẪU NHIÊN ==================== */
      const WISHES_POOL = [
        { title: "Giáng Sinh Ấm Áp", text: "Chúc bạn một mùa Giáng sinh ngập tràn hơi ấm bên gia đình, mọi ước nguyện đêm Noel đều sớm trở thành hiện thực!" },
        { title: "Bình An & Hạnh Phúc", text: "Chúc bạn luôn giữ được nụ cười rạng rỡ, tâm hồn bình yên và trái tim tràn đầy yêu thương trong mùa lễ hội này." },
        { title: "May Mắn Ngập Tràn", text: "Ông già Noel gửi tặng bạn một túi đầy ắp may mắn, sức khỏe dồi dào và những niềm vui bất ngờ mỗi ngày!" },
        { title: "Thành Công Rực Rỡ", text: "Chúc mọi dự định, học tập và công việc của bạn trong chặng đường sắp tới đều tỏa sáng rực rỡ như ngôi sao trên đỉnh thông!" },
        { title: "Ngọt Ngào Như Kẹo Gậy", text: "Chúc mùa Giáng sinh của bạn ngọt ngào như những chiếc kẹo gậy, lung linh như ánh đèn vàng và trọn vẹn từng khoảnh khắc." },
        { title: "Vạn Sự Như Ý", text: "Mong rằng tiếng chuông Giáng sinh ngân vang sẽ mang đến cho bạn khởi đầu mới thuận lợi, vạn sự hanh thông và tốt lành." },
        { title: "Tràn Đầy Năng Lượng", text: "Chúc bạn luôn tràn đầy nhiệt huyết, vượt qua mọi thử thách nhẹ nhàng như cưỡi xe tuần lộc bay trên bầu trời đêm!" },
        { title: "Yêu Thương Đong Đầy", text: "Giáng sinh là mùa sẻ chia — chúc bạn luôn được bao bọc bởi tình yêu thương chân thành từ những người thân yêu nhất." },
        { title: "Niềm Vui Bất Tận", text: "Chúc những muộn phiền tan biến theo từng bông tuyết rơi, nhường chỗ cho niềm vui và tiếng cười ngập tràn ngôi nhà bạn." },

      /* ==================== TEXTURE TINH THỂ BĂNG (DENDRITIC ICE CRYSTAL) ĐỘ NÉT CAO ==================== */
      // Tạo 3 mẫu bông tuyết tinh thể pha lê 6 cánh bằng Canvas 2D thay vì khối hộp nhựa
      function createIceCrystalTexture(variant = 0) {
        const size = 512;
        const cvs = document.createElement('canvas');
        cvs.width = size;
        cvs.height = size;
        const c = cvs.getContext('2d');
        const cx = size / 2;
        const cy = size / 2;
        const R = size * 0.42;

        c.clearRect(0, 0, size, size);

        // Hào quang băng giá mềm mại ở tâm
        const glowGrad = c.createRadialGradient(cx, cy, 4, cx, cy, R * 1.08);
        glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.65)');
        glowGrad.addColorStop(0.28, 'rgba(210, 244, 255, 0.32)');
        glowGrad.addColorStop(0.65, 'rgba(165, 225, 255, 0.10)');
        glowGrad.addColorStop(1, 'rgba(165, 225, 255, 0)');
        c.fillStyle = glowGrad;
        c.beginPath();
        c.arc(cx, cy, R * 1.08, 0, Math.PI * 2);
        c.fill();

        c.save();
        c.translate(cx, cy);
        c.lineCap = 'round';
        c.lineJoin = 'round';
        c.shadowColor = 'rgba(195, 240, 255, 0.95)';
        c.shadowBlur = 14;

        // Vẽ 6 nhánh tinh thể đối xứng hoàn hảo
        for (let arm = 0; arm < 6; arm++) {
          c.save();
          c.rotate((arm * Math.PI) / 3);

          // Thân chính của nhánh tinh thể
          const mainGrad = c.createLinearGradient(0, 0, 0, -R);
          mainGrad.addColorStop(0, 'rgba(255, 255, 255, 1)');
          mainGrad.addColorStop(0.7, 'rgba(235, 250, 255, 0.96)');
          mainGrad.addColorStop(1, 'rgba(195, 238, 255, 0.85)');

          c.strokeStyle = mainGrad;
          c.lineWidth = 7.5;
          c.beginPath();
          c.moveTo(0, 0);
          c.lineTo(0, -R);
          c.stroke();

          // Các cặp nhánh phụ kiểu dương xỉ băng (dendritic sub-branches)
          const branchSpecs = variant === 0
            ? [
                { pos: 0.28, len: 0.24, w: 5.0, sub: true },
                { pos: 0.50, len: 0.34, w: 5.2, sub: true },
                { pos: 0.70, len: 0.25, w: 4.4, sub: false },
                { pos: 0.86, len: 0.14, w: 3.6, sub: false }
              ]
            : variant === 1
            ? [
                { pos: 0.34, len: 0.30, w: 5.2, sub: true },
                { pos: 0.58, len: 0.28, w: 4.6, sub: true },
                { pos: 0.78, len: 0.18, w: 3.8, sub: false }
              ]
            : [
                { pos: 0.24, len: 0.20, w: 4.6, sub: false },
                { pos: 0.44, len: 0.35, w: 5.5, sub: true },
                { pos: 0.64, len: 0.26, w: 4.5, sub: true },
                { pos: 0.82, len: 0.16, w: 3.6, sub: false }
              ];

          branchSpecs.forEach((b) => {
            const y0 = -R * b.pos;
            const bLen = R * b.len;
            const angle = Math.PI / 3;
            const dx = Math.sin(angle) * bLen;
            const dy = -Math.cos(angle) * bLen;

            c.lineWidth = b.w;
            [-1, 1].forEach((side) => {
              c.beginPath();
              c.moveTo(0, y0);
              c.lineTo(side * dx, y0 + dy);
              c.stroke();

              // Nhánh tinh thể cấp 3 nhỏ li ti
              if (b.sub) {
                const mx = side * dx * 0.58;
                const my = y0 + dy * 0.58;
                const twigLen = bLen * 0.42;
                c.lineWidth = b.w * 0.62;
                c.beginPath();
                c.moveTo(mx, my);
                c.lineTo(mx + side * twigLen * 0.35, my - twigLen * 0.92);
                c.stroke();
                c.lineWidth = b.w;
              }
            });
          });

          // Đầu nhọn kim cương lấp lánh ở đỉnh mỗi nhánh
          c.fillStyle = 'rgba(255, 255, 255, 0.96)';
          c.beginPath();
          c.moveTo(0, -R - 10);
          c.lineTo(8, -R + 6);
          c.lineTo(0, -R + 20);
          c.lineTo(-8, -R + 6);
          c.closePath();
          c.fill();

          c.restore();
        }

        // Lục giác pha lê trong suốt ở tâm bông tuyết
        [0.16, 0.29].forEach((hexRatio, idx) => {
          const hr = R * hexRatio;
          c.lineWidth = idx === 0 ? 5 : 3.2;
          c.strokeStyle = 'rgba(245, 253, 255, 0.92)';
          c.fillStyle = idx === 0 ? 'rgba(230, 248, 255, 0.35)' : 'rgba(210, 242, 255, 0.14)';
          c.beginPath();
          for (let i = 0; i < 6; i++) {
            const a = (i * Math.PI) / 3 + (idx === 1 ? Math.PI / 6 : 0);
            const hx = Math.cos(a) * hr;
            const hy = Math.sin(a) * hr;
            if (i === 0) c.moveTo(hx, hy);
            else c.lineTo(hx, hy);
          }
          c.closePath();
          c.fill();
          c.stroke();
        });

        // Điểm sáng lấp lánh giữa tâm
        c.fillStyle = '#ffffff';
        c.beginPath();
        c.arc(0, 0, 8, 0, Math.PI * 2);
        c.fill();

        c.restore();

        const tex = new THREE.CanvasTexture(cvs);
        tex.needsUpdate = true;
        return tex;
      }

      // Tạo tầng tán lá thông 3D xếp múi lượn sóng tự nhiên (Scalloped Pine Boughs) thay cho hình nón phẳng
      function createScallopedPineGeometry(radius, height, lobes = 14) {
        const radialSegs = lobes * 6;
        const heightSegs = 12;
        const geo = new THREE.ConeGeometry(radius, height, radialSegs, heightSegs, false);
        const pos = geo.attributes.position;
        const halfH = height / 2;

        for (let i = 0; i < pos.count; i++) {
          let x = pos.getX(i);
          let y = pos.getY(i);
          let z = pos.getZ(i);

          // t = 0 ở đỉnh tầng, t = 1 ở mép đáy tán lá
          const t = clamp((halfH - y) / height, 0, 1);
          if (t > 0.04) {
            const angle = Math.atan2(z, x);
            const lobeWave = Math.cos(angle * lobes);
            const secondaryWave = Math.sin(angle * lobes * 2) * 0.25;

            // Độ xòe uốn lượn của từng cành thông
            const rFactor = 1 + (lobeWave * 0.16 + secondaryWave * 0.05) * Math.pow(t, 0.85);
            // Đường cong hơi trũng nhẹ tự nhiên của cành thông chịu sức nặng của tuyết
            const flare = 1 + 0.08 * Math.pow(t, 1.6);

            x *= rFactor * flare;
            z *= rFactor * flare;

            // Đầu cành thông hơi rủ xuống tạo gợn sóng ở viền tán lá
            if (y > -halfH + 0.05) {
              y -= Math.max(0, lobeWave) * 0.42 * Math.pow(t, 1.3);
            } else {
              // Đáy tán lá cũng uốn lượn theo từng cành
              y -= lobeWave * 0.32;
            }
          }
          pos.setXYZ(i, x, y, z);
        }

        geo.computeVertexNormals();
        return geo;
      }

      // Tạo viền tuyết trắng phủ uốn lượn ôm sát theo các đầu cành thông
      function createSnowDrapeRing(radius, lobes = 14, tubeRadius = 0.34) {
        const pts = [];
        const steps = lobes * 8;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const angle = u * Math.PI * 2;
          const lobeWave = Math.cos(angle * lobes);
          const r = radius * (0.95 + lobeWave * 0.14);
          const y = -lobeWave * 0.28;
          pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
        }
        const curve = new THREE.CatmullRomCurve3(pts, true);
        return new THREE.TubeGeometry(curve, steps, tubeRadius, 8, true);
      }

      // Tạo chiếc kẹo gậy 3D sọc đỏ-trắng treo trên cây thông
      function createCandyCane3D() {
        const caneGroup = new THREE.Group();
        const pts = [
          new THREE.Vector3(0, -0.7, 0),
          new THREE.Vector3(0, 0.35, 0),
          new THREE.Vector3(0.12, 0.62, 0),
          new THREE.Vector3(0.38, 0.65, 0),
          new THREE.Vector3(0.52, 0.42, 0)
        ];
        const curve = new THREE.CatmullRomCurve3(pts);

        // Tạo texture sọc chéo đỏ trắng cho kẹo gậy
        const cCanvas = document.createElement('canvas');
        cCanvas.width = 64;
        cCanvas.height = 64;
        const cCtx = cCanvas.getContext('2d');
        cCtx.fillStyle = '#ffffff';
        cCtx.fillRect(0, 0, 64, 64);
        cCtx.fillStyle = '#e63946';
        for (let i = -64; i < 128; i += 22) {
          cCtx.beginPath();
          cCtx.moveTo(i, 0);
          cCtx.lineTo(i + 10, 0);
          cCtx.lineTo(i + 42, 64);
          cCtx.lineTo(i + 32, 64);
          cCtx.closePath();
          cCtx.fill();
        }
        const stripeTex = new THREE.CanvasTexture(cCanvas);
        stripeTex.wrapS = THREE.RepeatWrapping;
        stripeTex.wrapT = THREE.RepeatWrapping;
        stripeTex.repeat.set(4, 1);

        const mesh = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 24, 0.11, 10, false),
          new THREE.MeshStandardMaterial({ map: stripeTex, roughness: 0.25, metalness: 0.1 })
        );
        caneGroup.add(mesh);
        return caneGroup;
      }

      function createGiantChristmasTree3D() {
        const treeGroup = new THREE.Group();

        // Thân gỗ thông cổ thụ
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(1.6, 2.5, 6.8, 18),
          new THREE.MeshStandardMaterial({ color: 0x59341e, roughness: 0.88 })
        );
        trunk.position.y = 2.6;

        const pineMat = new THREE.MeshStandardMaterial({
          color: 0x126e4b,
          emissive: 0x052418,
          emissiveIntensity: 0.35,
          roughness: 0.56,
          metalness: 0.08
        });
        const snowCapMat = new THREE.MeshStandardMaterial({
          color: 0xf4fcfb,
          emissive: 0x9ad2e6,
          emissiveIntensity: 0.15,
          roughness: 0.55
        });

        // 6 tầng tán lá thông xếp múi dày dặn và tự nhiên
        const tiers = [
          { r: 10.8, h: 6.8, y: 6.8,  lobes: 16, tube: 0.36 },
          { r: 9.2,  h: 6.2, y: 10.3, lobes: 15, tube: 0.33 },
          { r: 7.6,  h: 5.6, y: 13.5, lobes: 14, tube: 0.30 },
          { r: 6.0,  h: 5.0, y: 16.4, lobes: 12, tube: 0.27 },
          { r: 4.4,  h: 4.4, y: 19.0, lobes: 11, tube: 0.24 },
          { r: 2.8,  h: 3.9, y: 21.3, lobes: 9,  tube: 0.20 }
        ];

        tiers.forEach((t) => {
          const boughGeo = createScallopedPineGeometry(t.r, t.h, t.lobes);
          const boughMesh = new THREE.Mesh(boughGeo, pineMat);
          boughMesh.position.y = t.y;
          boughMesh.castShadow = true;
          boughMesh.receiveShadow = true;
          treeGroup.add(boughMesh);

          const snowRingGeo = createSnowDrapeRing(t.r, t.lobes, t.tube);
          const snowRing = new THREE.Mesh(snowRingGeo, snowCapMat);
          snowRing.position.y = t.y - t.h / 2 + 0.15;
          treeGroup.add(snowRing);
        });

        // 2 Dải dây kim tuyến xoắn ốc (Vàng kim & Bạc lấp lánh)
        const garlandPointsGold = [];
        const garlandPointsSilver = [];
        const turns = 5.2;
        const steps = 160;
        for (let i = 0; i <= steps; i++) {
          const u = i / steps;
          const angle = u * Math.PI * 2 * turns;
          const y = 4.0 + u * 18.0;
          const radius = (1 - u * 0.83) * 10.2 + 0.4;
          const waveDip = Math.abs(Math.sin(angle * 3)) * 0.35;
          garlandPointsGold.push(new THREE.Vector3(Math.cos(angle) * radius, y - waveDip, Math.sin(angle) * radius));
          garlandPointsSilver.push(new THREE.Vector3(Math.cos(angle + Math.PI) * (radius * 0.97), y - waveDip * 0.8, Math.sin(angle + Math.PI) * (radius * 0.97)));
        }

        const goldGarland = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(garlandPointsGold), 160, 0.22, 8, false),
          new THREE.MeshStandardMaterial({
            color: 0xffd86b,
            emissive: 0xb87914,
            emissiveIntensity: 0.52,
            metalness: 0.82,
            roughness: 0.2
          })
        );
        const silverGarland = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(garlandPointsSilver), 160, 0.14, 8, false),
          new THREE.MeshStandardMaterial({
            color: 0xfff8e7,
            emissive: 0x9ecae8,
            emissiveIntensity: 0.45,
            metalness: 0.75,
            roughness: 0.22
          })
        );
        treeGroup.add(goldGarland, silverGarland);

        // Quả châu kim loại bóng, đèn fairy lights, kẹo gậy & nơ đỏ
        const baubleColors = [0xe63946, 0xffd166, 0x48bfe3, 0x4cd97b, 0xff6b9d, 0xfff3c4, 0xff9f1c];
        const lightBulbs = [];
        const capMat = new THREE.MeshStandardMaterial({ color: 0xffd76b, metalness: 0.8, roughness: 0.2 });

        for (let i = 0; i < 82; i++) {
          const u = (i + 0.5) / 82;
          const angle = i * 2.39996;
          const y = 4.2 + u * 17.6;
          const r = (1 - u * 0.83) * 10.1 + 0.45;
          const bx = Math.cos(angle) * r;
          const bz = Math.sin(angle) * r;

          const colorHex = baubleColors[i % baubleColors.length];
          const isGlowingBulb = i % 2 === 0;

          if (isGlowingBulb) {
            const bulb = new THREE.Mesh(
              new THREE.SphereGeometry(0.32, 12, 12),
              new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 1.1,
                roughness: 0.15
              })
            );
            bulb.position.set(bx, y, bz);
            treeGroup.add(bulb);
            lightBulbs.push({ mesh: bulb, phase: rand(0, Math.PI * 2) });
          } else {
            const baubleGroup = new THREE.Group();
            const orb = new THREE.Mesh(
              new THREE.SphereGeometry(0.58, 16, 16),
              new THREE.MeshStandardMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 0.24,
                metalness: 0.85,
                roughness: 0.12
              })
            );
            const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.22, 10), capMat);
            cap.position.y = 0.56;
            baubleGroup.add(orb, cap);
            baubleGroup.position.set(bx, y, bz);
            treeGroup.add(baubleGroup);
          }
        }

        // Treo thêm kẹo gậy 3D và nơ đỏ 3D quanh tán thông
        for (let i = 0; i < 14; i++) {
          const u = 0.12 + (i / 14) * 0.72;
          const angle = i * 1.9 + 0.4;
          const y = 4.5 + u * 16.5;
          const r = (1 - u * 0.83) * 10.35 + 0.45;
          const ox = Math.cos(angle) * r;
          const oz = Math.sin(angle) * r;

          const item = i % 2 === 0 ? createCandyCane3D() : createRedBow3D();
          item.position.set(ox, y, oz);
          item.lookAt(ox * 2, y, oz * 2);
          treeGroup.add(item);
        }

        treeGroup.userData.lightBulbs = lightBulbs;

        // Ngôi sao 3D đa diện lấp lánh trên đỉnh cây thông (y = 23.8)
        const starShape = new THREE.Shape();
        const outerR = 2.05;
        const innerR = 0.86;
        for (let i = 0; i < 10; i++) {
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const rad = i % 2 === 0 ? outerR : innerR;
          const sx = Math.cos(a) * rad;
          const sy = Math.sin(a) * rad;
          if (i === 0) starShape.moveTo(sx, sy);
          else starShape.lineTo(sx, sy);
        }
        starShape.closePath();

        const starExtrude = new THREE.ExtrudeGeometry(starShape, {
          depth: 0.52,
          bevelEnabled: true,
          bevelThickness: 0.2,
          bevelSize: 0.16,
          bevelSegments: 4
        });
        starExtrude.center();

        const topStarMesh = new THREE.Mesh(
          starExtrude,
          new THREE.MeshStandardMaterial({
            color: 0xfff0a8,
            emissive: 0xffc93c,
            emissiveIntensity: 1.05,
            metalness: 0.68,
            roughness: 0.16
          })
        );
        topStarMesh.rotation.z = Math.PI;
        topStarMesh.position.set(0, 23.9, 0);
        treeGroup.add(topStarMesh);

        const starGlowHalo = new THREE.Mesh(
          new THREE.SphereGeometry(2.8, 24, 24),
          new THREE.MeshBasicMaterial({ color: 0xffe899, transparent: true, opacity: 0.34 })
        );
        starGlowHalo.position.set(0, 23.9, 0);
        treeGroup.add(starGlowHalo);

        const starPointLight = new THREE.PointLight(0xffe694, 1.8, 36);
        starPointLight.position.set(0, 23.9, 2.0);
        treeGroup.add(starPointLight);

        treeGroup.userData.topStarMesh = topStarMesh;
        treeGroup.userData.starGlowHalo = starGlowHalo;

        return treeGroup;
      }

      const giantTree3D = createGiantChristmasTree3D();
      giantTree3D.position.set(0, -1, 0);
      worldTreeGroup.add(giantTree3D);

      // Tạo rừng thông nhỏ 3D bên dưới với tán lá xếp múi & phủ tuyết đẹp mắt
      function createMiniPineTree3D(scale = 1) {
        const mini = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
          color: 0x156b4c,
          emissive: 0x041d14,
          emissiveIntensity: 0.3,
          roughness: 0.6
        });
        const snowMat = new THREE.MeshStandardMaterial({ color: 0xedf9f8, roughness: 0.65 });

        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.42, 0.62, 2.4, 12),
          new THREE.MeshStandardMaterial({ color: 0x5c3824 })
        );
        trunk.position.y = 1.1;
        mini.add(trunk);

        [
          { r: 3.2, h: 3.1, y: 2.9, lobes: 10 },
          { r: 2.5, h: 2.7, y: 4.6, lobes: 9 },
          { r: 1.8, h: 2.3, y: 6.1, lobes: 8 },
          { r: 1.1, h: 1.9, y: 7.3, lobes: 7 }
        ].forEach((tier) => {
          const c = new THREE.Mesh(createScallopedPineGeometry(tier.r, tier.h, tier.lobes), mat);
          c.position.y = tier.y;
          mini.add(c);

          const rim = new THREE.Mesh(createSnowDrapeRing(tier.r, tier.lobes, 0.14), snowMat);
          rim.position.y = tier.y - tier.h / 2 + 0.1;
          mini.add(rim);
        });

        // Quả châu nhỏ & sao nhỏ trên cây thông phụ
        const miniColors = [0xff5964, 0xffd875, 0x63d2ff, 0x4cd97b];
        for (let i = 0; i < 8; i++) {
          const u = (i + 0.5) / 8;
          const a = i * 2.4;
          const y = 2.2 + u * 4.8;
          const r = (1 - u * 0.72) * 2.85;
          const dot = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 10, 10),
            new THREE.MeshBasicMaterial({ color: miniColors[i % miniColors.length] })
          );
          dot.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
          mini.add(dot);
        }

        const topDot = new THREE.Mesh(
          new THREE.OctahedronGeometry(0.45, 0),
          new THREE.MeshBasicMaterial({ color: 0xffe885 })
        );
        topDot.position.y = 8.45;
        mini.add(topDot);

        mini.scale.setScalar(scale);
        return mini;
      }

      miniTreePositions.forEach((p) => {

      /* ==================== MÔ HÌNH 3D ÔNG GIÀ NOEL & TUẦN LỘC ĐIÊU KHẮC MỀM MẠI, SỐNG ĐỘNG ==================== */
      // Chú tuần lộc 3D được tạo hình bằng các khối bo tròn mềm mại, sừng phân nhánh cong, lông ngực trắng và khớp chân 2 đoạn
      function createReindeer3D() {
        const deer = new THREE.Group();

        const coatMat = new THREE.MeshStandardMaterial({ color: 0xa65e2e, roughness: 0.48, metalness: 0.05 });
        const darkCoatMat = new THREE.MeshStandardMaterial({ color: 0x753d18, roughness: 0.55 });
        const creamFurMat = new THREE.MeshStandardMaterial({ color: 0xfaf0dc, roughness: 0.65 });
        const antlerMat = new THREE.MeshStandardMaterial({ color: 0xf5d79c, roughness: 0.35, metalness: 0.1 });
        const hoofMat = new THREE.MeshStandardMaterial({ color: 0x2b190e, roughness: 0.4 });
        const collarMat = new THREE.MeshStandardMaterial({ color: 0xd92638, roughness: 0.35 });
        const goldBellMat = new THREE.MeshStandardMaterial({
          color: 0xffdb6e,
          emissive: 0x8a5a00,
          emissiveIntensity: 0.35,
          metalness: 0.85,
          roughness: 0.18
        });
        const rudolphNoseMat = new THREE.MeshStandardMaterial({
          color: 0xff2436,
          emissive: 0xff1a2b,
          emissiveIntensity: 1.2,
          roughness: 0.15
        });

        // Thân tuần lộc bo tròn thon gọn (hướng về phía +Z)
        const torso = new THREE.Mesh(new THREE.SphereGeometry(0.82, 18, 16), coatMat);
        torso.scale.set(0.85, 0.9, 1.95);
        torso.position.set(0, 2.25, 0);
        deer.add(torso);

        // Ngực & bụng lông kem trắng mềm mại
        const chestFur = new THREE.Mesh(new THREE.SphereGeometry(0.66, 16, 14), creamFurMat);
        chestFur.scale.set(0.82, 0.85, 1.15);
        chestFur.position.set(0, 2.15, 0.92);
        deer.add(chestFur);

        const underBelly = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 12), creamFurMat);
        underBelly.scale.set(0.75, 0.45, 1.65);
        underBelly.position.set(0, 1.72, -0.05);
        deer.add(underBelly);

        // Đốm sao trắng trên lưng tuần lộc
        [-0.45, 0.45].forEach((sideX) => {
          [-0.4, 0.1, 0.55].forEach((posZ, idx) => {
            const spot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 8), creamFurMat);
            spot.scale.set(0.4, 0.8, 1.1);
            spot.position.set(sideX * (idx === 1 ? 1.04 : 0.96), 2.55 + (idx % 2) * 0.14, posZ);
            deer.add(spot);
          });
        });

        // Đuôi bông xù trắng kem
        const tailGroup = new THREE.Group();
        tailGroup.position.set(0, 2.65, -1.52);
        const tailBase = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.72, 12), creamFurMat);
        tailBase.rotation.x = -Math.PI / 2.8;
        tailGroup.add(tailBase);
        deer.add(tailGroup);

        // Cổ vươn cao duyên dáng
        const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.54, 1.65, 14), coatMat);
        neck.rotation.x = Math.PI / 5.5;
        neck.position.set(0, 3.15, 1.18);
        deer.add(neck);

        // Vòng cổ đỏ đính chuông lục lạc vàng quanh cổ
        const collar = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.11, 10, 22), collarMat);
        collar.rotation.x = Math.PI / 2.5;
        collar.position.set(0, 2.9, 1.12);
        deer.add(collar);

        for (let b = -2; b <= 2; b++) {
          const a = b * 0.42;
          const bell = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 10), goldBellMat);
          bell.position.set(Math.sin(a) * 0.52, 2.75 - Math.cos(a) * 0.12, 1.12 + Math.cos(a) * 0.48);
          deer.add(bell);
        }

        // Đầu & mõm thon bo tròn
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 3.88, 1.65);

        const cranium = new THREE.Mesh(new THREE.SphereGeometry(0.56, 16, 16), coatMat);
        cranium.scale.set(0.92, 0.95, 1.08);
        headGroup.add(cranium);

        const snout = new THREE.Mesh(new THREE.SphereGeometry(0.4, 14, 14), darkCoatMat);
        snout.scale.set(0.82, 0.76, 1.35);
        snout.position.set(0, -0.1, 0.62);
        headGroup.add(snout);

        // Mũi đỏ Rudolph phát sáng lung linh
        const nose = new THREE.Mesh(new THREE.SphereGeometry(0.22, 14, 14), rudolphNoseMat);
        nose.position.set(0, -0.02, 1.18);
        headGroup.add(nose);

        const noseHalo = new THREE.Mesh(
          new THREE.SphereGeometry(0.38, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xff3b47, transparent: true, opacity: 0.35 })
        );
        noseHalo.position.copy(nose.position);
        headGroup.add(noseHalo);

        // Đôi mắt to long lanh có đốm sáng trắng (catchlight)
        const eyeBlackMat = new THREE.MeshBasicMaterial({ color: 0x140b06 });
        const eyeSparkleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        [-0.42, 0.42].forEach((ex) => {
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 12), eyeBlackMat);
          eye.position.set(ex, 0.12, 0.35);
          headGroup.add(eye);

          const sparkle = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 8), eyeSparkleMat);
          sparkle.position.set(ex + (ex > 0 ? 0.04 : -0.04), 0.16, 0.44);
          headGroup.add(sparkle);
        });

        // Đôi tai vểnh mềm mại
        [-1, 1].forEach((side) => {
          const ear = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 10), coatMat);
          ear.scale.set(0.45, 1.35, 0.35);
          ear.position.set(side * 0.56, 0.36, -0.1);
          ear.rotation.z = -side * 0.65;
          ear.rotation.x = -0.2;
          headGroup.add(ear);
        });

        // Cặp sừng ngà uốn cong nhiều nhánh (Curved Multi-tine Antlers)
        [-1, 1].forEach((side) => {
          const mainPts = [
            new THREE.Vector3(side * 0.22, 0.42, -0.05),
            new THREE.Vector3(side * 0.62, 0.95, -0.25),
            new THREE.Vector3(side * 0.85, 1.52, -0.05),
            new THREE.Vector3(side * 0.65, 1.98, 0.32)
          ];
          const mainBeam = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(mainPts), 16, 0.065, 8, false),
            antlerMat
          );
          headGroup.add(mainBeam);

          const tine1Pts = [
            new THREE.Vector3(side * 0.58, 0.88, -0.2),
            new THREE.Vector3(side * 0.45, 1.28, 0.28)
          ];
          const tine1 = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tine1Pts), 8, 0.048, 6, false),
            antlerMat
          );
          headGroup.add(tine1);

          const tine2Pts = [
            new THREE.Vector3(side * 0.78, 1.38, -0.1),
            new THREE.Vector3(side * 1.08, 1.78, -0.22)
          ];
          const tine2 = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tine2Pts), 8, 0.048, 6, false),
            antlerMat
          );
          headGroup.add(tine2);
        });

        deer.add(headGroup);
        deer.userData.headGroup = headGroup;

        // 4 chân có khớp đùi, cẳng chân và móng guốc cử động nhịp nhàng
        const legs = [];
        const legOffsets = [
          { x: -0.42, z: 1.05, phase: 0, isFront: true },
          { x:  0.42, z: 1.05, phase: Math.PI * 0.85, isFront: true },
          { x: -0.44, z: -1.05, phase: Math.PI, isFront: false },
          { x:  0.44, z: -1.05, phase: Math.PI * 0.15, isFront: false }
        ];
        legOffsets.forEach((lo) => {
          const hipPivot = new THREE.Group();
          hipPivot.position.set(lo.x, 1.75, lo.z);

          const upperLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.13, 0.9, 10), coatMat);
          upperLeg.position.y = -0.42;
          hipPivot.add(upperLeg);

          const kneeJoint = new THREE.Group();
          kneeJoint.position.y = -0.85;
          hipPivot.add(kneeJoint);

          const lowerLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.09, 0.82, 10), darkCoatMat);
          lowerLeg.position.y = -0.38;
          kneeJoint.add(lowerLeg);

          const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.22, 10), hoofMat);
          hoof.position.set(0, -0.8, 0.04);
          kneeJoint.add(hoof);

          deer.add(hipPivot);
          legs.push({ pivot: hipPivot, knee: kneeJoint, phase: lo.phase, isFront: lo.isFront });
        });
        deer.userData.legs = legs;

        return deer;
      }

      // Cỗ xe Ông già Noel 3D sang trọng + Ông già Noel chi tiết + 4 chú tuần lộc dẫn đầu
      function createSantaSleigh3D() {
        const rig = new THREE.Group();

        const redVelvetMat = new THREE.MeshStandardMaterial({

        const backrest = new THREE.Mesh(new THREE.SphereGeometry(1.72, 18, 16), redVelvetMat);

        // 2 Thanh trượt tuyết vàng uốn cong xoắn ốc ở mũi (Ornate Curved Golden Runners)
        [-1.55, 1.55].forEach((sx) => {
          const runnerPts = [
            new THREE.Vector3(sx, 0.35, -6.5),
            new THREE.Vector3(sx, 0.35, -3.5),
            new THREE.Vector3(sx, 0.42, -0.8),
            new THREE.Vector3(sx, 1.35, 0.25),
            new THREE.Vector3(sx, 2.25, -0.15),

          // Chân trụ vàng nối gầm xe với thanh trượt
          [-4.8, -2.2].forEach((sz) => {

        // Bao tải quà khổng lồ phía sau với những hộp quà nhỏ đầy màu sắc nhô ra
        const giftSack = new THREE.Mesh(new THREE.SphereGeometry(1.58, 18, 18), sackMat);
