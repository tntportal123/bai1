<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07152b">
  <title>Merry Christmas · Giáng sinh an lành</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --night: #07152b;
      --gold: #ffd887;
      --cream: #fff7e8;
      --red: #d94850;
      --green: #0c573f;
      --font-sans: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: var(--font-sans);
      background: var(--night); color: var(--cream);
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      position: relative;
      width: 100%; height: 100%; min-height: 500px;
      overflow: hidden; isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 76%, rgba(22, 91, 100, .45), transparent 37%),
        radial-gradient(ellipse at 50% 34%, rgba(41, 73, 120, .42), transparent 53%),
        linear-gradient(180deg, #081326 0%, #0c2040 48%, #112e4a 77%, #0b2637 100%);
    }
    .scene::before {
      content: ""; position: absolute; z-index: -1; inset: auto -15% -19%;
      height: 36%; border-radius: 50% 50% 0 0 / 23% 23% 0 0;
      background: linear-gradient(180deg, #e7f5f1 0%, #b8d9dc 100%);
      box-shadow: 0 -18px 70px rgba(218, 250, 255, .13);
    }

    .sky-glow {
      position: absolute; left: 50%; top: 48%; width: min(78vw, 850px); aspect-ratio: 1;
      transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(244, 203, 130, .11), rgba(118, 181, 194, .04) 42%, transparent 69%);
      animation: breathe 6s ease-in-out infinite alternate;
    }
    .moon {
      position: absolute; right: 11%; top: 9%; width: clamp(52px, 8vw, 96px); aspect-ratio: 1;
      border-radius: 50%; background: #ffedc4;
      box-shadow: 0 0 22px #ffe9bb, 0 0 75px rgba(255, 221, 162, .48);
      opacity: .86;
    }
    .moon::after {
      content: ""; position: absolute; width: 100%; height: 100%; left: 20%; top: -12%;
      border-radius: 50%; background: #10223e;
    }
    .stars { position: absolute; inset: 0; pointer-events: none; }
    .star {
      position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff2d3;
      box-shadow: 0 0 9px 2px rgba(255, 230, 184, .65);
      animation: twinkle var(--twinkle, 3s) ease-in-out infinite alternate;
    }

    /* ==================== RÈM NHUNG ĐỎ MỞ ĐẦU ==================== */
    .curtain-stage {
      position: absolute; z-index: 30; inset: 0;
      display: flex; cursor: pointer;
      user-select: none;
      transition: visibility 0s linear 2.2s;
    }
    .curtain-stage.open {
      pointer-events: none;
      visibility: hidden;
    }
    .curtain-valance {
      position: absolute; z-index: 4; top: 0; left: 0; width: 100%;
      height: clamp(56px, 9.5vh, 92px);
      background:
        repeating-linear-gradient(90deg,
          #5c0811 0px, #8f1120 26px, #b81d2f 52px, #8f1120 78px, #5c0811 104px);
      border-bottom: 5px solid #f4c96b;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .68), inset 0 -6px 14px rgba(255, 215, 130, .28);
      transition: transform 1.6s cubic-bezier(.65, 0, .25, 1) .15s;
    }
    .curtain-stage.open .curtain-valance {
      transform: translateY(-130%);
    }
    .valance-lights {
      position: absolute; inset: 0; width: 100%; height: 145%; overflow: visible;
    }

    .curtain-panel {
      position: relative; width: 50.5%; height: 100%;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 100, 100, .14), transparent 65%),
        repeating-linear-gradient(90deg,
          #4b050d 0%, #7d0c19 4.5%, #b51b2c 9%, #830e1c 13.5%, #4b050d 18%);
      box-shadow: inset 0 0 80px rgba(20, 0, 4, .75), 0 0 45px rgba(0, 0, 0, .65);
      transition: transform 2.05s cubic-bezier(.6, .04, .2, 1);
      overflow: hidden;
    }
    .curtain-panel.left {
      transform-origin: left top;
      border-right: 4px solid #f2c76e;
    }
    .curtain-panel.right {
      transform-origin: right top;
      border-left: 4px solid #f2c76e;
    }
    .curtain-stage.open .curtain-panel.left {
      transform: translateX(-96%) rotate(2deg);
    }
    .curtain-stage.open .curtain-panel.right {
      transform: translateX(96%) rotate(-2deg);
    }

    .curtain-ornaments {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .bulb-glow-1 { animation: bulb-blink 1.1s ease-in-out infinite alternate; }
    .bulb-glow-2 { animation: bulb-blink 1.1s ease-in-out .38s infinite alternate; }
    .bulb-glow-3 { animation: bulb-blink 1.1s ease-in-out .75s infinite alternate; }
    .dangling-item {
      transform-box: fill-box; transform-origin: top center;
      animation: sway 3.2s ease-in-out infinite alternate;
    }
    .dangling-item.delay-1 { animation-delay: -.8s; }
    .dangling-item.delay-2 { animation-delay: -1.6s; }
    .dangling-item.delay-3 { animation-delay: -2.3s; }

    .curtain-hint {
      position: absolute; z-index: 6; left: 50%; bottom: 9%;
      transform: translateX(-50%);
      padding: 13px 30px; border-radius: 999px;
      background: rgba(58, 6, 14, .88);
      border: 2px solid rgba(255, 220, 142, .85);
      color: #fff6dc;
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: clamp(.92rem, 1.8vw, 1.12rem);
      letter-spacing: .04em; white-space: nowrap;
      box-shadow: 0 0 30px rgba(255, 202, 104, .45), inset 0 0 12px rgba(255, 220, 142, .2);
      animation: hint-pulse 1.5s ease-in-out infinite alternate;
    }
    .curtain-stage.open .curtain-hint {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ==================== TUẦN LỘC BAY QUA LẠI ==================== */
    .sky-reindeers {
      position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: hidden;
      opacity: 0; transition: opacity 1s ease;
    }
    .scene.ambient-reindeer-active .sky-reindeers {
      opacity: 1;
    }
    .reindeer-runner {
      position: absolute; width: clamp(110px, 14vw, 185px);
      filter: drop-shadow(0 0 12px rgba(255, 224, 152, .45));
      opacity: .92;
    }
    .reindeer-runner.r-ltr-1 {
      top: 12%; left: -22%;
      animation: fly-ltr-1 15s linear infinite;
    }
    .reindeer-runner.r-rtl-1 {
      top: 23%; right: -22%;
      animation: fly-rtl-1 18s linear 2.5s infinite;
    }
    .reindeer-runner.r-ltr-2 {
      top: 34%; left: -22%; width: clamp(92px, 11vw, 145px); opacity: .78;
      animation: fly-ltr-2 21s linear 6s infinite;
    }
    .reindeer-runner.r-rtl-2 {
      top: 16%; right: -22%; width: clamp(98px, 12vw, 155px); opacity: .82;
      animation: fly-rtl-2 16.5s linear 9s infinite;
    }

    /* ==================== ÔNG GIÀ NOEL BAY ==================== */
    .orbit {
      position: absolute; z-index: 6; inset: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible;
    }
    .intro-sleigh-group {
      opacity: 0;
      will-change: transform, opacity;
    }
    .orbit-sleigh-wrap {
      opacity: 0;
      transition: opacity 1.1s ease;
    }
    .scene.stage-orbit-santa .orbit-sleigh-wrap {
      opacity: 1;
    }
    .sleigh {
      overflow: visible;
      filter: drop-shadow(0 8px 16px rgba(4, 12, 25, .55)) drop-shadow(0 0 20px rgba(255, 223, 148, .38));
    }

    /* ==================== BÔNG TUYẾT KHỔNG LỒ & MƯA TUYẾT ==================== */
    #snow {
      position: absolute; z-index: 3; inset: 0; width: 100%; height: 100%; pointer-events: none;
      opacity: 0; transition: opacity .9s ease;
    }
    .scene.stage-snow #snow { opacity: 1; }

    .intro-snow { position: absolute; z-index: 5; inset: 0; overflow: hidden; pointer-events: none; }
    .intro-flake {
      position: absolute; top: -44vh; left: var(--x); width: var(--size); height: var(--size);
      overflow: visible; opacity: 0;
      filter: drop-shadow(0 0 18px rgba(229, 249, 255, .82));
    }
    .scene.stage-snow .intro-flake {
      animation: mega-fall 3.1s cubic-bezier(.36,.05,.62,.97) var(--delay) forwards;
    }
    .intro-flake path {
      fill: none; stroke: #f5fcff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .snowbanks {
      position: absolute; z-index: 1; inset: auto 0 0; height: 19%; pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(224, 243, 239, .28) 20%, #e7f5f1 72%);
      clip-path: ellipse(72% 76% at 50% 100%);
    }

    /* ==================== CÂY THÔNG NOEL CHÍNH & RỪNG THÔNG NHỎ ==================== */
    .tree-wrap {
      position: absolute; z-index: 4; left: 50%; top: 53%;
      width: clamp(250px, 41vw, 510px); height: min(77vh, 670px);
      transform: translate(-50%, -46%) scale(.66); opacity: 0;
      filter: drop-shadow(0 16px 28px rgba(1, 13, 22, .4));
      pointer-events: none;
    }
    .scene.stage-tree .tree-wrap {
      animation: tree-arrive 2.1s cubic-bezier(.2,.82,.25,1) forwards;
    }
    .tree-svg { width: 100%; height: 100%; overflow: visible; }
    .tree-lights { animation: lights 2s ease-in-out infinite alternate; }
    .tree-lights-alt { animation: lights 2s ease-in-out 1s infinite alternate; }
    .top-star-inner {
      transform-box: fill-box; transform-origin: center;
      animation: star-pulse 2.2s ease-in-out infinite alternate;
    }

    .mini-forest {
      position: absolute; z-index: 3; inset: auto 0 0; height: 32%;
      pointer-events: none;
    }
    .mini-tree {
      position: absolute; bottom: var(--bottom, 7%);
      width: var(--w, clamp(52px, 8.5vw, 114px));
      filter: drop-shadow(0 7px 10px rgba(5, 28, 31, .3));
      opacity: 0;
    }
    .scene.stage-tree .mini-tree {
      animation:
        decor-arrive 1.1s ease var(--d, .35s) forwards,
        bob 4s ease-in-out calc(var(--d, .35s) + 1.1s) infinite;
    }

    /* ==================== DÒNG CHỮ MERRY CHRISTMAS ==================== */
    .greeting {
      position: absolute; z-index: 7; left: 50%; top: 47%; width: min(92vw, 1000px);
      text-align: center; transform: translate(-50%, -50%) scale(.03); opacity: 0;
      pointer-events: none;
    }
    .scene.stage-greeting .greeting {
      animation: greeting-arrive 1.3s cubic-bezier(.18,.9,.25,1.2) forwards;
    }
    .greeting h1 {
      margin: 0; color: #fff6df;
      font-family: var(--font-serif);
      font-size: clamp(2.7rem, 8.6vw, 7rem);
      font-weight: 700; line-height: .96; letter-spacing: .02em;
      text-shadow:
        0 2px 0 #ce9d55,
        0 5px 0 rgba(111, 62, 31, .5),
        0 0 28px rgba(255, 209, 126, .82),
        0 0 82px rgba(255, 180, 91, .48);
    }
    .greeting p {
      margin: clamp(12px, 2.2vh, 22px) 0 0; color: #fff1cf;
      font-family: var(--font-sans);
      font-size: clamp(1rem, 2.2vw, 1.55rem);
      font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
      opacity: .96;
      text-shadow: 0 2px 14px rgba(10, 24, 42, .85), 0 0 18px rgba(255, 208, 131, .65);
    }

    /* ==================== 15 HỘP QUÀ RƠI LIÊN TỤC NHƯ BÔNG TUYẾT ==================== */
    .gifts-container {
      position: absolute; z-index: 12; inset: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .scene.stage-greeting .gifts-container {
      opacity: 1;
    }

    .gift-item {
      position: absolute; top: 0; left: 0;
      width: clamp(46px, 5.4vw, 68px); aspect-ratio: 1;
      cursor: pointer; pointer-events: auto;
      background: none; border: none; padding: 0;
      filter: drop-shadow(0 6px 12px rgba(4, 15, 28, .48));
      will-change: transform;
      touch-action: manipulation;
      user-select: none;
    }
    .gift-item svg {
      width: 100%; height: 100%; overflow: visible;
      transition: transform .2s cubic-bezier(.2, .9, .3, 1.4), filter .2s ease;
    }
    .gift-item:hover svg {
      transform: scale(1.25);
      filter: drop-shadow(0 0 16px rgba(255, 230, 145, .95));
    }

    /* ==================== POPUP MỞ LỜI CHÚC TRONG HỘP QUÀ ==================== */
    .wish-modal-backdrop {
      position: fixed; z-index: 50; inset: 0;
      background: rgba(4, 12, 24, .72);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; visibility: hidden;
      transition: opacity .35s ease, visibility .35s ease;
    }
    .wish-modal-backdrop.active {
      opacity: 1; visibility: visible;
    }
    .wish-modal {
      position: relative;
      width: min(92vw, 460px);
      padding: 32px 28px 26px;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 218, 133, .22), transparent 65%),
        linear-gradient(160deg, #6d0f1c 0%, #430811 55%, #2a060d 100%);
      border: 2px solid #f5ca72;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .75), 0 0 40px rgba(255, 206, 112, .35);
      text-align: center;
      color: #fff8e8;
      font-family: var(--font-sans);
      transform: scale(.65) translateY(30px);
      transition: transform .4s cubic-bezier(.2, .9, .25, 1.25);
    }
    .wish-modal-backdrop.active .wish-modal {
      transform: scale(1) translateY(0);
    }
    .wish-modal-icon {
      width: 82px; height: 82px; margin: -62px auto 12px;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.45));
      animation: modal-gift-pop .7s cubic-bezier(.2, .9, .3, 1.4);
    }
    .wish-modal-badge {
      display: inline-block;
      padding: 5px 16px; border-radius: 999px;
      background: rgba(255, 216, 135, .18);
      border: 1px solid rgba(255, 216, 135, .55);
      color: #ffd984;
      font-family: var(--font-sans);
      font-size: .82rem; font-weight: 600;
      letter-spacing: .08em; text-transform: uppercase;
      margin-bottom: 12px;
    }
    .wish-modal h3 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: clamp(1.4rem, 3.2vw, 1.8rem);
      font-weight: 700;
      color: #ffe8a8;
      text-shadow: 0 2px 10px rgba(255, 198, 92, .4);
    }
    .wish-modal p {
      margin: 0 0 22px;
      font-family: var(--font-sans);
      font-size: clamp(1rem, 2.2vw, 1.14rem);
      line-height: 1.68;
      font-weight: 400;
      color: #fff6e5;
    }
    .wish-close-btn {
      padding: 11px 30px; border-radius: 999px;
      background: linear-gradient(180deg, #ffd97d 0%, #e09f36 100%);
      border: none; color: #3d1205;
      font-family: var(--font-sans);
      font-weight: 700; font-size: .96rem;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(255, 197, 84, .4);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .wish-close-btn:hover {
      transform: translateY(-2px) scale(1.04);
      box-shadow: 0 10px 24px rgba(255, 210, 108, .6);
    }

    /* ==================== NÚT ĐIỀU KHIỂN GÓC DƯỚI ==================== */
    .bottom-controls {
      position: absolute; z-index: 20; bottom: 1.8%; right: 2%;
      display: flex; gap: 8px; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity .6s ease;
    }
    .scene.stage-greeting .bottom-controls {
      opacity: 1; pointer-events: auto;
    }
    .control-btn {
      padding: 8px 16px; border-radius: 999px;
      background: rgba(11, 34, 54, .82);
      border: 1px solid rgba(255, 222, 148, .55);
      color: #ffefc9;
      font-family: var(--font-sans);
      font-size: 12.5px; font-weight: 600;
      letter-spacing: .04em;
      cursor: pointer; backdrop-filter: blur(6px);
      transition: transform .2s ease, background .2s ease;
    }
    .control-btn:hover {
      background: rgba(22, 58, 88, .92);
      transform: translateY(-2px);
    }

    /* ==================== KEYFRAMES ==================== */
    @keyframes breathe { to { opacity: .55; transform: translate(-50%, -50%) scale(1.08); } }
    @keyframes twinkle { from { opacity: .22; transform: scale(.65); } to { opacity: 1; transform: scale(1.3); } }
    @keyframes bulb-blink {
      from { opacity: .45; filter: drop-shadow(0 0 2px currentColor); }
      to { opacity: 1; filter: drop-shadow(0 0 11px currentColor); }
    }
    @keyframes sway {
      from { transform: rotate(-4.5deg); }
      to { transform: rotate(4.5deg); }
    }
    @keyframes hint-pulse {
      from { transform: translateX(-50%) scale(.96); box-shadow: 0 0 18px rgba(255, 202, 104, .3); }
      to { transform: translateX(-50%) scale(1.04); box-shadow: 0 0 32px rgba(255, 214, 128, .65); }
    }

    @keyframes fly-ltr-1 {
      0% { transform: translate3d(-15vw, 2vh, 0) rotate(-6deg); }
      25% { transform: translate3d(25vw, -4vh, 0) rotate(3deg); }
      50% { transform: translate3d(60vw, 2vh, 0) rotate(-4deg); }
      75% { transform: translate3d(95vw, -3vh, 0) rotate(4deg); }
      100% { transform: translate3d(135vw, 1vh, 0) rotate(0deg); }
    }
    @keyframes fly-ltr-2 {
      0% { transform: translate3d(-15vw, 0, 0) rotate(-4deg); }
      50% { transform: translate3d(55vw, -6vh, 0) rotate(5deg); }
      100% { transform: translate3d(135vw, 2vh, 0) rotate(-2deg); }
    }
    @keyframes fly-rtl-1 {
      0% { transform: translate3d(15vw, 1vh, 0) scaleX(-1) rotate(-5deg); }
      35% { transform: translate3d(-35vw, -4vh, 0) scaleX(-1) rotate(4deg); }
      70% { transform: translate3d(-85vw, 3vh, 0) scaleX(-1) rotate(-3deg); }
      100% { transform: translate3d(-135vw, -2vh, 0) scaleX(-1) rotate(2deg); }
    }
    @keyframes fly-rtl-2 {
      0% { transform: translate3d(15vw, -2vh, 0) scaleX(-1) rotate(3deg); }
      50% { transform: translate3d(-60vw, 4vh, 0) scaleX(-1) rotate(-5deg); }
      100% { transform: translate3d(-135vw, -1vh, 0) scaleX(-1) rotate(2deg); }
    }

    @keyframes mega-fall {
      0% { opacity: 0; transform: translate3d(-50%, -3vh, 0) rotate(-25deg); }
      12% { opacity: .95; }
      88% { opacity: .88; }
      100% { opacity: 0; transform: translate3d(-50%, 185vh, 0) rotate(335deg); }
    }
    @keyframes tree-arrive {
      0% { transform: translate(-50%, -42%) scale(.62); opacity: 0; }
      100% { transform: translate(-50%, -48%) scale(1); opacity: 1; }
    }
    @keyframes lights {
      from { opacity: .62; }
      to { opacity: 1; filter: drop-shadow(0 0 7px #ffd36c); }
    }
    @keyframes star-pulse {
      from { transform: scale(.92) rotate(-4deg); filter: drop-shadow(0 0 8px #ffe699); }
      to { transform: scale(1.1) rotate(4deg); filter: drop-shadow(0 0 22px #fff2be); }
    }
    @keyframes greeting-arrive {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.02) rotate(-8deg); filter: blur(16px); }
      56% { opacity: 1; transform: translate(-50%, -50%) scale(1.22) rotate(2deg); filter: blur(0); }
      74% { opacity: 1; transform: translate(-50%, -50%) scale(.92) rotate(-1deg); }
      88% { opacity: 1; transform: translate(-50%, -50%) scale(1.05) rotate(.4deg); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0); filter: blur(0); }
    }
    @keyframes decor-arrive { to { opacity: .94; } }
    @keyframes bob { 50% { translate: 0 -7px; } }
    @keyframes modal-gift-pop {
      0% { transform: scale(0) rotate(-18deg); }
      70% { transform: scale(1.15) rotate(6deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @media (max-width: 640px) {
      .moon { right: 7%; top: 7%; }
      .tree-wrap { top: 53%; height: 60vh; width: min(74vw, 350px); }
      .intro-flake { top: -36vh; }
      .greeting { top: 45%; }
      .greeting h1 { font-size: clamp(2.4rem, 11.5vw, 4.3rem); }
      .greeting p { font-size: clamp(.88rem, 3.6vw, 1.15rem); letter-spacing: .12em; }
    }
  </style>
</head>
<body>
  <!-- Ghép trực tiếp đúng tên 2 file nhạc của bạn -->
  <audio id="jingleBellsAudio" loop preload="auto">
    <source src="Jingle Bells with Lyrics  Christmas Songs HD  Christmas Songs and Carols - Christmas Songs and Carols - Love to Sing.mp3" type="audio/mpeg">
    <source src="jingle-bells.mp3" type="audio/mpeg">
  </audio>
  <audio id="hoHoHoAudio" preload="auto">
    <source src="Ho Ho Ho Merry Christmas - Ted Breslin.mp3" type="audio/mpeg">
    <source src="hohoho.mp3" type="audio/mpeg">
  </audio>

  <main class="scene" id="scene" aria-label="Hoạt cảnh Giáng sinh nhiệm màu">
    <!-- ==================== 1. TẤM RÈM MỞ ĐẦU ==================== -->

    (() => {

      const rand = (min, max) => Math.random() * (max - min) + min;

      /* ==================== HỆ THỐNG PHÁT 2 FILE NHẠC CỦA BẠN + DỰ PHÒNG WEB AUDIO ==================== */
      let audioCtx = null;
      let jingleLoopTimer = null;
      let sleighBellTimer = null;

      function ensureAudioContext() {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playSleighBellShake(duration = 0.14, volume = 0.08) {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const now = ctxAudio.currentTime;
        const bufferSize = Math.floor(ctxAudio.sampleRate * duration);
        const buffer = ctxAudio.createBuffer(1, bufferSize, ctxAudio.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.32));
        }

        const noise = ctxAudio.createBufferSource();
        noise.buffer = buffer;

        const filter = ctxAudio.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(4800, now);
        filter.Q.setValueAtTime(3.5, now);

        const gain = ctxAudio.createGain();
        gain.gain.setValueAtTime(volume, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctxAudio.destination);
        noise.start(now);

        [2637, 3520].forEach((freq) => {
          const osc = ctxAudio.createOscillator();
          const bellGain = ctxAudio.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          bellGain.gain.setValueAtTime(volume * 0.35, now);
          bellGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(bellGain);
          bellGain.connect(ctxAudio.destination);
          osc.start(now);
          osc.stop(now + duration);
        });
      }

      function playChimeNote(freq, startTime, duration, vol = 0.16) {
        if (isMuted || !audioCtx) return;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'triangle';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(freq, startTime);
        osc2.frequency.setValueAtTime(freq * 2, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.linearRampToValueAtTime(vol, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + duration);

        const osc2Gain = audioCtx.createGain();
        osc2Gain.gain.setValueAtTime(0.3, startTime);

        osc1.connect(gain);
        osc2.connect(osc2Gain);
        osc2Gain.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(startTime);
        osc2.start(startTime);
        osc1.stop(startTime + duration + 0.04);
        osc2.stop(startTime + duration + 0.04);
      }

        stopSynthesizedJingleBells();
        const ctxAudio = ensureAudioContext();
        if (!ctxAudio) return;

        const beatSec = 0.24;
        function scheduleSongLoop() {
          if (isMuted) return;
          let cursor = ctxAudio.currentTime + 0.05;
          let totalBeats = 0;

          JINGLE_BELLS_MELODY.forEach(([melodyNote, bassNote, beats]) => {
            const dur = beats * beatSec;
            if (melodyNote && NOTES[melodyNote]) {
              playChimeNote(NOTES[melodyNote], cursor, dur * 0.92, 0.14);
            }
            if (bassNote && NOTES[bassNote]) {
              playChimeNote(NOTES[bassNote], cursor, dur * 1.1, 0.08);
            }
            cursor += dur;
            totalBeats += beats;
          });

          jingleLoopTimer = setTimeout(scheduleSongLoop, totalBeats * beatSec * 1000);
        }

        scheduleSongLoop();
        sleighBellTimer = setInterval(() => {
          if (!isMuted) playSleighBellShake(0.11, 0.045);
        }, beatSec * 1000);
      }

      function stopSynthesizedJingleBells() {
        if (jingleLoopTimer) { clearTimeout(jingleLoopTimer); jingleLoopTimer = null; }
        if (sleighBellTimer) { clearInterval(sleighBellTimer); sleighBellTimer = null; }
      }

      function startJingleBellsMusic() {
        jingleBellsAudio.muted = isMuted;
        jingleBellsAudio.currentTime = 0;
        const playPromise = jingleBellsAudio.play();

        if (playPromise !== undefined) {
          playPromise.then(() => {
            stopSynthesizedJingleBells();
          }).catch(() => {
            startSynthesizedJingleBells();
          });
        } else {
          startSynthesizedJingleBells();
        }
      }

      function stopAllMusic() {
        jingleBellsAudio.pause();
        jingleBellsAudio.currentTime = 0;
        hoHoHoAudio.pause();
        hoHoHoAudio.currentTime = 0;
        stopSynthesizedJingleBells();
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
      }

      function playSynthesizedHoHoHo() {
        if (isMuted) return;
        const ctxAudio = ensureAudioContext();

        [0, 180, 360, 540, 720, 900].forEach((delay) => {
          setTimeout(() => playSleighBellShake(0.16, 0.09), delay);
        });

        if (ctxAudio) {
          const hoPitches = [135, 128, 118];
          hoPitches.forEach((baseFreq, idx) => {
            const start = ctxAudio.currentTime + 0.1 + idx * 0.42;
            const dur = 0.32;

            const osc = ctxAudio.createOscillator();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq * 1.08, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.86, start + dur);

            const formant1 = ctxAudio.createBiquadFilter();
            formant1.type = 'bandpass';
            formant1.frequency.setValueAtTime(460, start);
            formant1.Q.setValueAtTime(4.5, start);

            const formant2 = ctxAudio.createBiquadFilter();
            formant2.type = 'bandpass';
            formant2.frequency.setValueAtTime(820, start);
            formant2.Q.setValueAtTime(5, start);

            const voiceGain = ctxAudio.createGain();
            voiceGain.gain.setValueAtTime(0.001, start);
            voiceGain.gain.linearRampToValueAtTime(0.28, start + 0.05);
            voiceGain.gain.exponentialRampToValueAtTime(0.002, start + dur);

            osc.connect(formant1);
            osc.connect(formant2);
            formant1.connect(voiceGain);
            formant2.connect(voiceGain);
            voiceGain.connect(ctxAudio.destination);

            osc.start(start);
            osc.stop(start + dur + 0.02);
          });
        }

        if ('speechSynthesis' in window) {
          try {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance('Ho! Ho! Ho! Merry Christmas!');
            utter.lang = 'en-US';
            utter.pitch = 0.35;
            utter.rate = 0.78;
            utter.volume = 1;
            window.speechSynthesis.speak(utter);
          } catch (_) {}
        }
      }

      function playSantaHoHoHoSound() {
        if (isMuted) return;
        hoHoHoAudio.muted = isMuted;
        hoHoHoAudio.currentTime = 0;
        const playPromise = hoHoHoAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            playSynthesizedHoHoHo();
          });
        } else {
          playSynthesizedHoHoHo();
        }
      }

      soundToggleBtn.addEventListener('click', () => {
        isMuted = !isMuted;
        jingleBellsAudio.muted = isMuted;
        hoHoHoAudio.muted = isMuted;
        soundToggleBtn.textContent = isMuted ? '🔇 Bật nhạc' : '🔊 Tắt nhạc';
        if (isMuted) {
          stopSynthesizedJingleBells();
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } else if (isCurtainOpened && jingleBellsAudio.paused) {
          startSynthesizedJingleBells();
        }
      });

      /* ==================== 15 LỜI CHÚC GIÁNG SINH NGẪU NHIÊN ==================== */
      const WISHES_POOL = [
        { title: "Giáng Sinh Ấm Áp", text: "Chúc bạn một mùa Giáng sinh ngập tràn hơi ấm bên gia đình, mọi ước nguyện đêm Noel đều sớm trở thành hiện thực!" },
        { title: "Bình An & Hạnh Phúc", text: "Chúc bạn luôn giữ được nụ cười rạng rỡ, tâm hồn bình yên và trái tim tràn đầy yêu thương trong mùa lễ hội này." },
        { title: "May Mắn Ngập Tràn", text: "Ông già Noel gửi tặng bạn một túi đầy ắp may mắn, sức khỏe dồi dào và những niềm vui bất ngờ mỗi ngày!" },
        { title: "Thành Công Rực Rỡ", text: "Chúc mọi dự định, học tập và công việc của bạn trong chặng đường sắp tới đều tỏa sáng rực rỡ như ngôi sao trên đỉnh thông!" },
        { title: "Ngọt Ngào Như Kẹo Gậy", text: "Chúc mùa Giáng sinh của bạn ngọt ngào như những chiếc kẹo gậy, lung linh như ánh đèn vàng và trọn vẹn từng khoảnh khắc." },
        { title: "Vạn Sự Như Ý", text: "Mong rằng tiếng chuông Giáng sinh ngân vang sẽ mang đến cho bạn khởi đầu mới thuận lợi, vạn sự hanh thông và tốt lành." },
        { title: "Tràn Đầy Năng Lượng", text: "Chúc bạn luôn tràn đầy nhiệt huyết, vượt qua mọi thử thách nhẹ nhàng như cưỡi xe tuần lộc bay trên bầu trời đêm!" },
        { title: "Yêu Thương Đong Đầy", text: "Giáng sinh là mùa sẻ chia — chúc bạn luôn được bao bọc bởi tình yêu thương chân thành từ những người thân yêu nhất." },
        { title: "Niềm Vui Bất Tận", text: "Chúc những muộn phiền tan biến theo từng bông tuyết rơi, nhường chỗ cho niềm vui và tiếng cười ngập tràn ngôi nhà bạn." },
        { title: "Phép Màu Đêm Đông", text: "Chúc phép màu của đêm Giáng sinh chạm đến trái tim bạn, mang theo những điều kỳ diệu đẹp đẽ nhất mà bạn hằng mong đợi." },
        { title: "Sức Khỏe & An Khang", text: "Món quà quý giá nhất chính là sức khỏe. Chúc bạn và gia đình một mùa đông ấm áp, bình an và thật nhiều sức khỏe!" },
        { title: "Tỏa Sáng Theo Cách Riêng", text: "Hãy luôn tự tin và tỏa sáng lấp lánh như những vì sao trên bầu trời đêm Giáng sinh. Chúc bạn luôn vững bước và hạnh phúc!" },
        { title: "Tài Lộc Gõ Cửa", text: "Chúc mùa lễ hội cuối năm mang tới cho bạn thật nhiều tin vui, tài lộc rủng rỉnh và những cơ hội tuyệt vời mới." },
        { title: "Kỷ Niệm Đáng Nhớ", text: "Chúc bạn có một đêm Noel thật đáng nhớ bên bạn bè và người thân, lưu giữ thêm thật nhiều kỷ niệm đẹp trong thanh xuân." },
        { title: "Một Năm Mới Tuyệt Vời", text: "Merry Christmas & Happy New Year! Chúc bạn khép lại năm cũ thật trọn vẹn và sẵn sàng đón chào năm mới rực rỡ!" }
      ];

      const GIFT_PALETTES = [
        { box: "#e63946", lid: "#ff5964", ribbon: "#ffd166" },
        { box: "#1e824c", lid: "#2ecc71", ribbon: "#ffeb85" },
        { box: "#2b6cb0", lid: "#4299e1", ribbon: "#ffd166" },
        { box: "#8e44ad", lid: "#ab69c6", ribbon: "#ffeaa7" },
        { box: "#d97706", lid: "#f59e0b", ribbon: "#fff3c4" },
        { box: "#c53030", lid: "#e53e3e", ribbon: "#9ae6b4" },
        { box: "#0d9488", lid: "#14b8a6", ribbon: "#fde68a" }
      ];

      function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function createGiftSVG(palette) {
        return `
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <ellipse cx="50" cy="92" rx="34" ry="6" fill="rgba(0,0,0,.28)"/>
            <rect x="20" y="42" width="60" height="46" rx="6" fill="${palette.box}" stroke="rgba(255,255,255,.28)" stroke-width="2"/>
            <rect x="44" y="42" width="12" height="46" fill="${palette.ribbon}"/>
            <rect x="20" y="60" width="60" height="10" fill="${palette.ribbon}"/>
            <rect x="15" y="30" width="70" height="15" rx="5" fill="${palette.lid}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
            <rect x="43" y="30" width="14" height="15" fill="${palette.ribbon}"/>
            <path d="M50 30 C35 12 18 22 34 31 C42 33 47 31 50 30 C53 31 58 33 66 31 C82 22 65 12 50 30 Z"
                  fill="${palette.ribbon}" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>
            <circle cx="50" cy="29" r="5" fill="#ffffff" opacity=".7"/>
          </svg>
        `;
      }

      let fallingGifts = [];
      let giftsFallingActive = false;

      function renderGifts() {
        giftsContainer.innerHTML = '';
        fallingGifts = [];
        const shuffledWishes = shuffleArray(WISHES_POOL);
        const colOrder = shuffleArray(Array.from({ length: 15 }, (_, idx) => idx));

        shuffledWishes.forEach((wish, i) => {
          const palette = GIFT_PALETTES[i % GIFT_PALETTES.length];
          const btn = document.createElement('button');
          btn.className = 'gift-item';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Mở hộp quà Giáng sinh');
          btn.innerHTML = createGiftSVG(palette);

          const openHandler = (e) => {
            e.stopPropagation();
            openGiftWish(wish, palette);
          };
          btn.addEventListener('pointerdown', openHandler);
          btn.addEventListener('click', openHandler);

          giftsContainer.appendChild(btn);

          const xPercent = 4 + (colOrder[i] / 14) * 88 + rand(-1.5, 1.5);
          fallingGifts.push({
            el: btn,
            xPercent,
            y: -rand(90, 960),
            speed: rand(1.15, 2.05),
            swayAmp: rand(10, 24),
            swaySpeed: rand(0.0012, 0.0024),
            rotAmp: rand(8, 16),
            phase: rand(0, Math.PI * 2)
          });
        });
      }

      function openGiftWish(wish, palette) {
        playSleighBellShake(0.18, 0.09);
        wishModalBadge.textContent = 'Món quà Giáng sinh 🎁';
        wishModalTitle.textContent = wish.title;
        wishModalText.textContent = wish.text;
        wishModalIcon.innerHTML = createGiftSVG(palette);
        wishModalBackdrop.classList.add('active');
      }

      function closeGiftWish() {
        wishModalBackdrop.classList.remove('active');
      }

      wishCloseBtn.addEventListener('click', closeGiftWish);
      wishModalBackdrop.addEventListener('click', (e) => {
        if (e.target === wishModalBackdrop) closeGiftWish();
      });
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wishModalBackdrop.classList.contains('active')) {
          closeGiftWish();
        }
      });

      /* ==================== TẠO SAO TRÊN BẦU TRỜI ==================== */
      for (let i = 0; i < 48; i++) {
        const star = document.createElement('i');
        star.className = 'star';
        star.style.left = `${rand(3, 97)}%`;
        star.style.top = `${rand(3, 72)}%`;
        star.style.setProperty('--twinkle', `${rand(1.8, 4.8)}s`);
        star.style.animationDelay = `${rand(-5, 0)}s`;
        stars.appendChild(star);
      }

      /* ==================== KHỞI TẠO HẠT TUYẾT & BÔNG TUYẾT 6 CÁNH NHỎ ==================== */
      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = canvas.clientWidth; height = canvas.clientHeight;
        canvas.width = Math.round(width * dpr); canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.max(85, Math.min(200, Math.round(width * height / 6800)));
        flakes = Array.from({ length: count }, () => ({
          x: rand(0, width), y: rand(-height, height), r: rand(1, 4.2),
          speed: rand(.45, 2.1), drift: rand(-.42, .42), phase: rand(0, Math.PI * 2),
          alpha: rand(.35, .9)
        }));

        const crystalCount = Math.max(18, Math.min(40, Math.round(width * height / 34000)));
        crystalFlakes = Array.from({ length: crystalCount }, () => ({
          x: rand(0, width),
          y: rand(-height, height),
          size: rand(6, 13.5),
          speed: rand(.55, 1.55),
          drift: rand(-.38, .38),
          phase: rand(0, Math.PI * 2),
          angle: rand(0, Math.PI * 2),
          spin: (Math.random() < .5 ? -1 : 1) * rand(.004, .018),
          alpha: rand(.48, .92)
        }));
      }

      function drawSmallSnowflake(x, y, size, angle, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.strokeStyle = `rgba(244, 251, 255, ${alpha})`;
        ctx.lineWidth = Math.max(1.15, size * 0.13);
        ctx.lineCap = 'round';
        ctx.shadowBlur = 7;
        ctx.shadowColor = 'rgba(215, 243, 255, .85)';

        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(0, -size);
          const bPos = -size * 0.58;
          const bLen = size * 0.34;
          ctx.moveTo(0, bPos);
          ctx.lineTo(-bLen * 0.72, bPos - bLen * 0.68);
          ctx.moveTo(0, bPos);
          ctx.lineTo(bLen * 0.72, bPos - bLen * 0.68);
          ctx.stroke();
          ctx.rotate(Math.PI / 3);
        }
        ctx.restore();
      }

      /* ==================== CHUYỂN ĐỘNG ÔNG GIÀ NOEL & HỘP QUÀ RƠI ==================== */
      let introFlightStart = 0;
      let introFlightActive = false;
      const INTRO_FLIGHT_DURATION = 4200;

      function startIntroSantaFlight() {
        introFlightStart = performance.now();
        introFlightActive = true;
        playSantaHoHoHoSound();
      }

      function updateIntroSantaFlight(time) {
        if (!introFlightActive || !introSleighGroup) return;
        const elapsed = time - introFlightStart;
        const p = elapsed / INTRO_FLIGHT_DURATION;

        if (p >= 1) {
          introFlightActive = false;
          introSleighGroup.style.opacity = '0';
          return;
        }

        const startX = -260;
        const endX = 1260;
        const x = startX + (endX - startX) * p;
        const baseLineY = 475 - 65 * p;
        const arcLift = 335 * Math.sin(p * Math.PI);
        const y = baseLineY - arcLift;

        const dx = endX - startX;
        const dy = -65 - 335 * Math.PI * Math.cos(p * Math.PI);
        const tiltDeg = Math.atan2(dy, dx) * (180 / Math.PI) * 0.65;
        const scale = 0.94 + 0.16 * Math.sin(p * Math.PI);

        let opacity = 1;
        if (p < 0.08) opacity = p / 0.08;
        else if (p > 0.9) opacity = (1 - p) / 0.1;

        introSleighGroup.style.opacity = opacity.toFixed(3);
        introSleighGroup.setAttribute(
          'transform',
          `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${tiltDeg.toFixed(1)}) scale(${scale.toFixed(3)})`
        );
      }

      function updateFallingGifts(time, delta) {
        if (!giftsFallingActive || !fallingGifts.length) return;
        for (const g of fallingGifts) {
          g.y += g.speed * delta;
          if (g.y > height + 90) {
            g.y = -rand(80, 240);
          }
          const swayX = Math.sin(time * g.swaySpeed + g.phase) * g.swayAmp;
          const rot = Math.sin(time * g.swaySpeed + g.phase) * g.rotAmp;
          const xPos = (g.xPercent / 100) * width + swayX;
          g.el.style.transform = `translate3d(${xPos.toFixed(1)}px, ${g.y.toFixed(1)}px, 0) rotate(${rot.toFixed(1)}deg)`;
        }
      }

      function updateSantaEllipseOrbit(time) {
        if (!orbitSleighNode) return;
        const period = 12500;
        const angle = ((time % period) / period) * Math.PI * 2;
        const centerX = 500;
        const centerY = 405;
        const radiusX = 435;
        const radiusY = 272;

        const x = centerX + radiusX * Math.cos(angle);
        const y = centerY + radiusY * Math.sin(angle);
        const vx = -radiusX * Math.sin(angle);
        const vy = radiusY * Math.cos(angle);
        const goingLeft = vx < 0;

        const depthScale = 0.88 + 0.2 * ((Math.sin(angle) + 1) / 2);
        const tilt = (vy / radiusY) * (goingLeft ? -11 : 11);
        const flipX = goingLeft ? -depthScale : depthScale;

        orbitSleighNode.setAttribute(
          'transform',
          `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${flipX.toFixed(3)} ${depthScale.toFixed(3)})`
        );
      }

      function draw(time) {
        const delta = Math.min((time - (last || time)) / 16.7, 2.5);
        last = time;

        updateIntroSantaFlight(time);
        updateSantaEllipseOrbit(time);
        updateFallingGifts(time, delta);

        ctx.clearRect(0, 0, width, height);

        for (const f of flakes) {
          f.y += f.speed * delta;
          f.x += (f.drift + Math.sin(time / 1000 + f.phase) * .34) * delta;
          if (f.y > height + 8) { f.y = -8; f.x = rand(0, width); }
          if (f.x < -8) f.x = width + 8; else if (f.x > width + 8) f.x = -8;

          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
          ctx.shadowBlur = f.r > 3.1 ? 11 : 4;
          ctx.shadowColor = 'rgba(232,247,255,.9)';
          ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        for (const cf of crystalFlakes) {
          cf.y += cf.speed * delta;
          cf.x += (cf.drift + Math.cos(time / 900 + cf.phase) * .36) * delta;
          cf.angle += cf.spin * delta;
          if (cf.y > height + 18) { cf.y = -18; cf.x = rand(0, width); }
          if (cf.x < -18) cf.x = width + 18; else if (cf.x > width + 18) cf.x = -18;
          drawSmallSnowflake(cf.x, cf.y, cf.size, cf.angle, cf.alpha);
        }

        requestAnimationFrame(draw);
      }

      /* ==================== KỊCH BẢN TRÌNH DIỄN TUẦN TỰ ==================== */
      function clearTimers() {
        timers.forEach(id => clearTimeout(id));
        timers = [];
      }
      function schedule(fn, delay) {
        timers.push(setTimeout(fn, delay));
      }

      function openCurtain() {
        if (isCurtainOpened) return;
        isCurtainOpened = true;

        // 1. Ẩn ngay lập tức dòng chữ hướng dẫn
        if (curtainHint) curtainHint.style.display = 'none';

        // 2. Phát ngay nhạc Jingle Bells khi nhấn mở rèm
        startJingleBellsMusic();

        // 3. Kéo rèm sang hai bên
        curtainStage.classList.add('open');
        scene.classList.add('ambient-reindeer-active');

        // 4. Ông già Noel bay vòng cung ra màn hình kèm âm thanh "Ho Ho Ho"
        schedule(() => startIntroSantaFlight(), 450);

        // 5. Những bông tuyết khổng lồ rơi xuống + mưa tuyết
        schedule(() => scene.classList.add('stage-snow'), 4450);

        // 6. Cây thông Noel & rừng thông nhỏ hiện lên
        schedule(() => scene.classList.add('stage-tree'), 5050);

        // 7. Chữ "Merry Christmas / Giáng sinh an lành" + 15 hộp quà bắt đầu rơi liên tục
        schedule(() => {
          scene.classList.add('stage-greeting');
          giftsFallingActive = true;
        }, 7250);

        // 8. Ông già Noel bay vòng elip quanh cây thông liên tục
        schedule(() => scene.classList.add('stage-orbit-santa'), 8150);
      }

      function resetAndStandbyCurtain() {
        clearTimers();
        isCurtainOpened = false;
        introFlightActive = false;
        giftsFallingActive = false;
        if (introSleighGroup) introSleighGroup.style.opacity = '0';
        closeGiftWish();
        stopAllMusic();

        curtainStage.classList.remove('open');
        if (curtainHint) curtainHint.style.display = '';

        scene.classList.remove(
          'ambient-reindeer-active',
          'stage-snow',
          'stage-tree',
          'stage-greeting',
          'stage-orbit-santa'
        );

        void scene.offsetWidth;
        renderGifts();
      }

      curtainStage.addEventListener('click', openCurtain);
      curtainStage.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openCurtain();
        }
      });
      replayBtn.addEventListener('click', resetAndStandbyCurtain);

      window.addEventListener('resize', resize, { passive: true });
      resize();
      renderGifts();
      requestAnimationFrame(draw);
    })();
  </script>
